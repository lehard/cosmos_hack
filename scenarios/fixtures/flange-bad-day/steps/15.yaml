    body: {"process_version_id":"flange-1","step_key":"welding.kt3_radiography","element_id":"W4","name":"КТ-3 Рентген шва","kind":"automatedInspection","lane":"Сварочный цех","documentation":"Дефектоскопист лаборатории НК снимает шов, расшифровывает снимки и пишет заключение: внутренние поры, несплавления, прожог в корне.\nЗапись: заключение НК (ГОСТ 7512). Юридически значимо заключение, а не снимок.\nПредусловие — квалификация дефектоскописта. Узкое место № 1: очередь в лабораторию 4–24 ч [ПП].\nЧто может пойти не так: заключение не пришло — ЗТ-3 закрыта; долгая очередь задерживает обнаружение дефектов.\nСобытия (наш каталог): Е-45 inspection.result.","properties":{"inspectionPoint":"KT-3","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Заключение рентгена записано по каждому участку шва.","system_action":"Система хранит заключение лаборатории НК и не пропускает ЗТ-3 без него, если рентген назначен."}],"counters":{"step_key":"welding.kt3_radiography","queue":16,"in_progress":1,"passed":4,"defects":3,"nonconformities":2},"items":[{"entity":"item","id":"ENT01:F-019"},{"entity":"item","id":"ENT01:F-020"},{"entity":"item","id":"ENT01:F-022"},{"entity":"item","id":"ENT01:F-024"},{"entity":"item","id":"ENT01:F-026"},{"entity":"item","id":"ENT01:F-027"},{"entity":"item","id":"ENT01:F-028"},{"entity":"item","id":"ENT01:F-029"},{"entity":"item","id":"ENT01:F-030"},{"entity":"item","id":"ENT01:F-031"},{"entity":"item","id":"ENT01:F-032"},{"entity":"item","id":"ENT01:F-033"},{"entity":"item","id":"ENT01:F-034"},{"entity":"item","id":"ENT01:F-035"},{"entity":"item","id":"ENT01:F-036"},{"entity":"item","id":"ENT01:F-223"},{"entity":"item","id":"ENT01:F-224"}],"nonconformities":[{"entity":"nonconformity","id":"NC-02"},{"entity":"nonconformity","id":"NC-03"}]}
