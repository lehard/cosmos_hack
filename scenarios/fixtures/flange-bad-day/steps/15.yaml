    body: {"process_version_id":"flange-1","step_key":"assembly.torque","element_id":"A6","name":"Затяжка по схеме","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Сборщик затягивает крепёж крест-накрест в 2–3 прохода (например, 30 % → 70 % → 100 % момента) ключом с записью момента и ставит метки краской [ПП].\nЗапись: журнал затяжек. Момент видит только ключ, камера его не видит.\nПредусловие — действующая поверка ключа.\nЧто может пойти не так: момент вне нормы → сигнал; у ключа истекла поверка — прежние результаты под сомнением.\nСобытия (наш каталог): Е-53 machine.parameters.","properties":{"operationCode":"070","stepKind":"operation"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Ключ с действующей поверкой; если его признали непригодным, прежние затяжки пересмотрены.","system_action":"Предусловие шага блокирует затяжку ключом с истёкшей поверкой; при непригодности ключа система помечает прежние результаты «под сомнением»."}],"counters":{"step_key":"assembly.torque","queue":0,"in_progress":1,"passed":1,"defects":0},"items":[{"entity":"item","id":"ENT01:F-007"}],"nonconformities":[]}
