    body: {"process_version_id":"flange-1","step_key":"welding.zt3_acceptance","element_id":"W5","name":"ЗТ-3 Приёмка ОТК","kind":"humanInspection","lane":"Сварочный цех","documentation":"Контролёр ОТК смотрит камеру по всем участкам шва, заключение рентгена и журнал сварки и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК; главный сварщик — при ремонте шва.\nЗаписи: отметка ОТК, журнал предъявления, клеймо сварщика. Закрывающая точка ЗТ-3. Журнал сварки должен быть в норме или разобран.\nЧто может пойти не так: решение принято до прихода опоздавшего журнала — система ставит на нём метку «пересмотрите».\nСобытия (наш каталог): Е-47 decision.gate_passed.","properties":{"closingPoint":"ZT-3","paperAttester":"head_of_workshop","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-3 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"welding.zt3_acceptance","queue":1,"in_progress":0,"passed":8,"defects":0},"items":[{"entity":"item","id":"ENT01:F-025"}],"nonconformities":[]}
