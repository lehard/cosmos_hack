  - op: process.node.read
    params: {"step_key":"assembly.zt4_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.zt4_acceptance","element_id":"A9","name":"ЗТ-4 ч.2 Приёмка сборки ОТК","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Контролёр ОТК смотрит камеру сборки, журнал ключа и результат КТ-4d и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК. Записи: карта сборки, журнал предъявления.\nЗакрывающая точка ЗТ-4; после вскрытия здесь же закрывается запись о вскрытии (ЗТ-В).\nЧто может пойти не так: нет одного из результатов — приёмка заблокирована.\nСобытия (наш каталог): Е-55 decision.gate_passed, Е-121 intervention.closed.","properties":{"closingPoint":"ZT-4.2","paperAttester":"site_foreman","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 n)","check":"Есть свидетельства, что все операции и проверки сборки завершены: камера, журнал ключа, КТ-4d.","system_action":"Без любого из этих результатов приёмка сборки заблокирована."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-4 ч.2 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"assembly.zt4_acceptance","queue":0,"in_progress":0,"passed":3,"defects":0},"items":[],"nonconformities":[]}
