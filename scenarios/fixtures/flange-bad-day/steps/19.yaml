  - op: process.node.read
    params: {"step_key":"testing.leak_test","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.leak_test","element_id":"T1","name":"Испытание на герметичность","kind":"automatedInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель ставит сборку на стенд с течеискателем: подготовка, наддув и выдержка, измерение — около 60 мин плюс 15 мин смена оснастки [ПП].\nЗаписи: журнал стенда (давление, выдержка, фон), программа и методика испытаний.\nПредусловия: поверка стенда и течеискателя, контрольная течь проверена. Узкое место № 2.\nЧто может пойти не так: давление не набрано → «оценка невозможна»; течь → брак, вскрытие и повторное испытание.\nСобытия (наш каталог): Е-60 operation.started, Е-61 machine.parameters, Е-62 inspection.result.","properties":{"operationCode":"080","reworkLimit":"2","reworkLimitScope":"loop","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Стенд и течеискатель с действующей поверкой, контрольная течь проверена.","system_action":"Предусловия шага блокируют испытание на стенде с истёкшей поверкой или без проверки контрольной течи."}],"counters":{"step_key":"testing.leak_test","queue":2,"in_progress":0,"passed":4,"defects":0},"items":[{"entity":"item","id":"ENT01:F-007"},{"entity":"item","id":"ENT01:F-008"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.kt5_camera","version_id":"flange-1"}
