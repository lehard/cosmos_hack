    body: {"process_version_id":"flange-1","step_key":"final.release_to_warehouse","element_id":"K4","name":"Сдача на склад готовой продукции","kind":"operation","lane":"ОТК и выпуск","documentation":"Кладовщик принимает изделие на склад готовой продукции.\nЗаписи: паспорт или формуляр, маршрутный лист на склад. Норма 10–15 мин [ПП].\nЭто исполнение ЗТ-6: следом в 1С уходит «выпуск годного».\nЧто может пойти не так: «учтено в 1С» ставится только после ответа 1С.\nСобытия (наш каталог): Е-74 item.released.","properties":{"stepKind":"movement"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.6","check":"Выпуск изделия зарегистрирован и сохранён.","system_action":"Система регистрирует сдачу на склад готовой продукции с паспортом или формуляром и отправляет в 1С «выпуск годного»."}],"counters":{"step_key":"final.release_to_warehouse","queue":0,"in_progress":0,"passed":0,"defects":0},"items":[],"nonconformities":[]}
