    body: {"process_version_id":"flange-1","step_key":"assembly.nonconformity","element_id":"AN","name":"Брак (Н)","kind":"callActivity","lane":"Сборочно-испытательный цех","documentation":"Вызов подпроцесса брака после приёмки сборки.\nРешают технолог и комиссия. Записи: заявление о несоответствии, решение по несоответствующей продукции.\nЧто может пойти не так: изделие не перенесли в изолятор физически — тревога.","properties":{},"norm_refs":[],"counters":{"step_key":"assembly.nonconformity","queue":0,"in_progress":0,"passed":0,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.leak_test","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.leak_test","element_id":"T1","name":"Испытание на герметичность","kind":"automatedInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель ставит сборку на стенд с течеискателем: подготовка, наддув и выдержка, измерение — около 60 мин плюс 15 мин смена оснастки [ПП].\nЗаписи: журнал стенда (давление, выдержка, фон), программа и методика испытаний.\nПредусловия: поверка стенда и течеискателя, контрольная течь проверена. Узкое место № 2.\nЧто может пойти не так: давление не набрано → «оценка невозможна»; течь → брак, вскрытие и повторное испытание.\nСобытия (наш каталог): Е-60 operation.started, Е-61 machine.parameters, Е-62 inspection.result.","properties":{"operationCode":"080","reworkLimit":"2","reworkLimitScope":"loop","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Стенд и течеискатель с действующей поверкой, контрольная течь проверена.","system_action":"Предусловия шага блокируют испытание на стенде с истёкшей поверкой или без проверки контрольной течи."}],"counters":{"step_key":"testing.leak_test","queue":2,"in_progress":0,"passed":0,"defects":0},"items":[{"entity":"item","id":"ENT01:F-007"},{"entity":"item","id":"ENT01:F-008"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.zt5_protocol","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.zt5_protocol","element_id":"T2","name":"ЗТ-5 Протокол испытаний","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель и контролёр ОТК подписывают протокол; ПЗ или ВП — если изделие в перечне приёмок.\nЗапись: протокол испытаний (подписи исполнителя, ОТК, ПЗ; номер пломбы).\nЗакрывающая точка ЗТ-5.\nЧто может пойти не так: представитель заказчика приходит по извещению, ожидание 1–8 ч [ПП].\nСобытия (наш каталог): Е-63 decision.gate_passed.","properties":{"closingPoint":"ZT-5","paperAttester":"head_of_qc","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-5 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"testing.zt5_protocol","queue":0,"in_progress":0,"passed":0,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.kt5_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"final.kt5_camera","element_id":"K2","name":"КТ-5 Камера окончательного контроля (4 ракурса)","kind":"automatedInspection","lane":"ОТК и выпуск","documentation":"Камера снимает изделие с 4 ракурсов на поворотном столе (по желанию): повреждения при перемещении, маркировка, комплектность.\nВыполняет VisionQC. Контрольная точка КТ-5. Запись: снимки в истории изделия.\nЧто может пойти не так: признак дефекта → сигнал; плохой кадр → «оценка невозможна».\nСобытия (наш каталог): Е-70 inspection.result.","properties":{"inspectionPoint":"KT-5","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-5 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-5 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"final.kt5_camera","queue":0,"in_progress":0,"passed":0,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.zt6_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"final.zt6_acceptance","element_id":"K3","name":"ЗТ-6 Окончательный контроль ОТК","kind":"humanInspection","lane":"ОТК и выпуск","documentation":"Контролёр ОТК смотрит сводку всех методов маршрута и решает: принять, мало данных, не принять. ВП или ПЗ — если изделие в перечне.\nЗаписи: журнал предъявления ОТК, извещение о предъявлении ВП или ПЗ, свидетельство о приёмке в паспорте или формуляре.\nЗакрывающая точка ЗТ-6. Повторное предъявление подписывает сотрудник уровнем выше; нельзя принимать изделие, которое сам делал.\nЧто может пойти не так: нет результата какого-то метода, открыто несоответствие или вскрытие — пройти нельзя.\nСобытия (наш каталог): Е-71 item.inspection_summary, Е-72 item.presented, Е-73 decision.gate_passed.","properties":{"closingPoint":"ZT-6","paperAttester":"head_of_qc","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 n)","check":"Есть свидетельства, что все запланированные операции и проверки маршрута завершены или задокументированы.","system_action":"Система показывает сводку методов маршрута; нет результата, открыто несоответствие или вскрытие — ЗТ-6 не пройти."},{"standard":"ГОСТ Р 58876-2020","clause":"8.6 b)","check":"Видно, кто санкционировал приёмку изделия.","system_action":"Подпись ЗТ-6 хранится с автором, ролью и полномочием."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-6 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"final.zt6_acceptance","queue":6,"in_progress":0,"passed":0,"defects":0},"items":[{"entity":"item","id":"ENT01:F-002"},{"entity":"item","id":"ENT01:F-003"},{"entity":"item","id":"ENT01:F-004"},{"entity":"item","id":"ENT01:F-005"},{"entity":"item","id":"ENT01:F-006"},{"entity":"item","id":"ENT01:F-010"}],"nonconformities":[]}
