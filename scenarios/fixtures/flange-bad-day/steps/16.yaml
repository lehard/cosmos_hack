    body: {"process_version_id":"flange-1","step_key":"welding.kt3_radiography","element_id":"W4","name":"КТ-3 Рентген шва","kind":"automatedInspection","lane":"Сварочный цех","documentation":"Дефектоскопист лаборатории НК снимает шов, расшифровывает снимки и пишет заключение: внутренние поры, несплавления, прожог в корне.\nЗапись: заключение НК (ГОСТ 7512). Юридически значимо заключение, а не снимок.\nПредусловие — квалификация дефектоскописта. Узкое место № 1: очередь в лабораторию 4–24 ч [ПП].\nЧто может пойти не так: заключение не пришло — ЗТ-3 закрыта; долгая очередь задерживает обнаружение дефектов.\nСобытия (наш каталог): Е-45 inspection.result.","properties":{"inspectionPoint":"KT-3","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Заключение рентгена записано по каждому участку шва.","system_action":"Система хранит заключение лаборатории НК и не пропускает ЗТ-3 без него, если рентген назначен."}],"counters":{"step_key":"welding.kt3_radiography","queue":16,"in_progress":0,"passed":5,"defects":3,"nonconformities":2},"items":[{"entity":"item","id":"ENT01:F-020"},{"entity":"item","id":"ENT01:F-022"},{"entity":"item","id":"ENT01:F-024"},{"entity":"item","id":"ENT01:F-026"},{"entity":"item","id":"ENT01:F-027"},{"entity":"item","id":"ENT01:F-028"},{"entity":"item","id":"ENT01:F-029"},{"entity":"item","id":"ENT01:F-030"},{"entity":"item","id":"ENT01:F-031"},{"entity":"item","id":"ENT01:F-032"},{"entity":"item","id":"ENT01:F-033"},{"entity":"item","id":"ENT01:F-034"},{"entity":"item","id":"ENT01:F-035"},{"entity":"item","id":"ENT01:F-036"},{"entity":"item","id":"ENT01:F-223"},{"entity":"item","id":"ENT01:F-224"}],"nonconformities":[{"entity":"nonconformity","id":"NC-02"},{"entity":"nonconformity","id":"NC-03"}]}
  - op: process.node.read
    params: {"step_key":"welding.zt3_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.zt3_acceptance","element_id":"W5","name":"ЗТ-3 Приёмка ОТК","kind":"humanInspection","lane":"Сварочный цех","documentation":"Контролёр ОТК смотрит камеру по всем участкам шва, заключение рентгена и журнал сварки и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК; главный сварщик — при ремонте шва.\nЗаписи: отметка ОТК, журнал предъявления, клеймо сварщика. Закрывающая точка ЗТ-3. Журнал сварки должен быть в норме или разобран.\nЧто может пойти не так: решение принято до прихода опоздавшего журнала — система ставит на нём метку «пересмотрите».\nСобытия (наш каталог): Е-47 decision.gate_passed.","properties":{"closingPoint":"ZT-3","paperAttester":"head_of_workshop","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-3 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"welding.zt3_acceptance","queue":2,"in_progress":0,"passed":8,"defects":0},"items":[{"entity":"item","id":"ENT01:F-019"},{"entity":"item","id":"ENT01:F-025"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.leak_test","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.leak_test","element_id":"T1","name":"Испытание на герметичность","kind":"automatedInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель ставит сборку на стенд с течеискателем: подготовка, наддув и выдержка, измерение — около 60 мин плюс 15 мин смена оснастки [ПП].\nЗаписи: журнал стенда (давление, выдержка, фон), программа и методика испытаний.\nПредусловия: поверка стенда и течеискателя, контрольная течь проверена. Узкое место № 2.\nЧто может пойти не так: давление не набрано → «оценка невозможна»; течь → брак, вскрытие и повторное испытание.\nСобытия (наш каталог): Е-60 operation.started, Е-61 machine.parameters, Е-62 inspection.result.","properties":{"operationCode":"080","reworkLimit":"2","reworkLimitScope":"loop","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Стенд и течеискатель с действующей поверкой, контрольная течь проверена.","system_action":"Предусловия шага блокируют испытание на стенде с истёкшей поверкой или без проверки контрольной течи."}],"counters":{"step_key":"testing.leak_test","queue":0,"in_progress":1,"passed":3,"defects":0},"items":[{"entity":"item","id":"ENT01:F-006"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.kt5_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"final.kt5_camera","element_id":"K2","name":"КТ-5 Камера окончательного контроля (4 ракурса)","kind":"automatedInspection","lane":"ОТК и выпуск","documentation":"Камера снимает изделие с 4 ракурсов на поворотном столе (по желанию): повреждения при перемещении, маркировка, комплектность.\nВыполняет VisionQC. Контрольная точка КТ-5. Запись: снимки в истории изделия.\nЧто может пойти не так: признак дефекта → сигнал; плохой кадр → «оценка невозможна».\nСобытия (наш каталог): Е-70 inspection.result.","properties":{"inspectionPoint":"KT-5","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-5 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-5 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"final.kt5_camera","queue":0,"in_progress":0,"passed":6,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.zt6_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"final.zt6_acceptance","element_id":"K3","name":"ЗТ-6 Окончательный контроль ОТК","kind":"humanInspection","lane":"ОТК и выпуск","documentation":"Контролёр ОТК смотрит сводку всех методов маршрута и решает: принять, мало данных, не принять. ВП или ПЗ — если изделие в перечне.\nЗаписи: журнал предъявления ОТК, извещение о предъявлении ВП или ПЗ, свидетельство о приёмке в паспорте или формуляре.\nЗакрывающая точка ЗТ-6. Повторное предъявление подписывает сотрудник уровнем выше; нельзя принимать изделие, которое сам делал.\nЧто может пойти не так: нет результата какого-то метода, открыто несоответствие или вскрытие — пройти нельзя.\nСобытия (наш каталог): Е-71 item.inspection_summary, Е-72 item.presented, Е-73 decision.gate_passed.","properties":{"closingPoint":"ZT-6","paperAttester":"head_of_qc","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 n)","check":"Есть свидетельства, что все запланированные операции и проверки маршрута завершены или задокументированы.","system_action":"Система показывает сводку методов маршрута; нет результата, открыто несоответствие или вскрытие — ЗТ-6 не пройти."},{"standard":"ГОСТ Р 58876-2020","clause":"8.6 b)","check":"Видно, кто санкционировал приёмку изделия.","system_action":"Подпись ЗТ-6 хранится с автором, ролью и полномочием."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-6 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"final.zt6_acceptance","queue":5,"in_progress":0,"passed":1,"defects":0},"items":[{"entity":"item","id":"ENT01:F-002"},{"entity":"item","id":"ENT01:F-003"},{"entity":"item","id":"ENT01:F-004"},{"entity":"item","id":"ENT01:F-005"},{"entity":"item","id":"ENT01:F-010"}],"nonconformit