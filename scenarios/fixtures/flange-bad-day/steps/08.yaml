    params: {"step_key":"welding.kt3_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.kt3_camera","element_id":"W3","name":"КТ-3 Камера на шов (участки 40 мм)","kind":"automatedInspection","lane":"Сварочный цех","documentation":"Камера проходит вдоль шва по участкам 40 мм (У1…У8) и ищет подрез, брызги, поры на поверхности, кратер, прожог.\nВыполняет VisionQC. Прожог или подрез → карантин и черновик карточки несоответствия (правило R-07).\nКонтрольная точка КТ-3. Порог качества наблюдения 0,6 [П]: ниже порога «признаков нет» считается «оценка невозможна».\nЧто может пойти не так: «признаков нет» не закрывает внутренние дефекты — нужен рентген; высокая уверенность на плохом кадре не засчитывается.\nСобытия (наш каталог): Е-44 inspection.result.","properties":{"inspectionPoint":"KT-3","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-3 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-3 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"welding.kt3_camera","queue":0,"in_progress":1,"passed":3,"defects":0},"items":[{"entity":"item","id":"ENT01:F-017"}],"nonconformities":[]}
