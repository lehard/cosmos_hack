    body: {"process_version_id":"flange-1","step_key":"welding.edge_prep","element_id":"W1","name":"Подготовка кромок","kind":"operation","lane":"Сварочный цех","documentation":"Сварщик или слесарь зачищает и травит кромки под сварку.\nЗапись: журнал сварочных работ (время подготовки кромок).\nКонец шага запускает окно 8 ч до начала сварки [ПП, по аналогии с ПНАЭ Г-7-022-90 п. 5.2.6]. Травить кромки можно не больше 3 раз.\nЧто может пойти не так: кромки подготовили «впрок», и окно истекло в очереди.","properties":{"operationCode":"020","reworkLimit":"3","reworkLimitScope":"loop","stepKind":"operation"},"norm_refs":[],"counters":{"step_key":"welding.edge_prep","queue":4,"in_progress":0,"passed":3,"defects":0},"items":[{"entity":"item","id":"ENT01:F-037"},{"entity":"item","id":"ENT01:F-038"},{"entity":"item","id":"ENT01:F-039"},{"entity":"item","id":"ENT01:F-040"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.weld","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.weld","element_id":"W2","name":"Сварка фланца с патрубком","kind":"operation","lane":"Сварочный цех","documentation":"Сварщик сваривает фланец с патрубком на источнике ИС-1 или ИС-2; источник пишет ток, напряжение, скорость.\nЭто специальный процесс: его результат нельзя полностью оценить последующим контролем (ГОСТ Р 58633 п. 3.17, п. 6.7). Перед началом проверяются аттестация сварщика на дату, сроки проволоки и газа, исправность источника, окно кромок.\nЗаписи: журнал сварочных работ, журнал параметров спецпроцесса, клеймо сварщика у шва.\nЧто может пойти не так: ток вне уставки 160 ± 10 А [ПП] — нарушение режима даже без видимого дефекта; все изделия окна нарушения идут в несоответствие.\nСобытия (наш каталог): Е-40 operation.started, Е-42 machine.parameters, Е-43 machine.state.","properties":{"operationCode":"030","reworkLimit":"3","reworkLimitScope":"zone","specialProcess":"true","stepKind":"operation"},"norm_refs":[{"standard":"ГОСТ Р 58633-2020","clause":"3.17, 6.7","check":"Сварка отмечена как специальный процесс: её результат нельзя полностью оценить последующим контролем.","system_action":"Система помечает шаг как специальный процесс и хранит журнал параметров каждого выполнения."},{"standard":"ГОСТ Р 58633-2020","clause":"7.1","check":"Фактические значения ключевых характеристик сварки (ток, напряжение, скорость) зарегистрированы.","system_action":"Источник пишет параметры шва; система хранит сводку на каждое выполнение сварки и сравнивает её с уставкой."},{"standard":"ГОСТ Р 59861-2021","clause":"7.4.14","check":"При нарушении режима работы приостановлены до установления и устранения причин.","system_action":"Система выдаёт сигнал нарушения режима и предлагает остановить источник; остановку ставит и снимает уполномоченный человек."},{"standard":"ГОСТ Р 58633-2020","clause":"8.2","check":"У сварщика действующая аттестация на дату операции (по аналогии: при аттестации процесса проверяют квалификацию исполнителей и допуск).","system_action":"Предусловие шага блокирует начало сварки без действующей аттестации сварщика."}],"counters":{"step_key":"welding.weld","queue":0,"in_progress":0,"passed":3,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.kt3_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.kt3_camera","element_id":"W3","name":"КТ-3 Камера на шов (участки 40 мм)","kind":"automatedInspection","lane":"Сварочный цех","documentation":"Камера проходит вдоль шва по участкам 40 мм (У1…У8) и ищет подрез, брызги, поры на поверхности, кратер, прожог.\nВыполняет VisionQC. Прожог или подрез → карантин и черновик карточки несоответствия (правило R-07).\nКонтрольная точка КТ-3. Порог качества наблюдения 0,6 [П]: ниже порога «признаков нет» считается «оценка невозможна».\nЧто может пойти не так: «признаков нет» не закрывает внутренние дефекты — нужен рентген; высокая уверенность на плохом кадре не засчитывается.\nСобытия (наш каталог): Е-44 inspection.result.","properties":{"inspectionPoint":"KT-3","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-3 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-3 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"welding.kt3_camera","queue":0,"in_progress":1,"passed":2,"defects":0},"items":[{"entity":"item","id":"ENT01:F-017"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.zt5_protocol","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.zt5_protocol","element_id":"T2","name":"ЗТ-5 Протокол испытаний","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель и контролёр ОТК подписывают протокол; ПЗ или ВП — если изделие в перечне приёмок.\nЗапись: протокол испытаний (подписи исполнителя, ОТК, ПЗ; номер пломбы).\nЗакрывающая точка ЗТ-5.\nЧто может пойти не так: представитель заказчика приходит по извещению, ожидание 1–8 ч [ПП].\nСобытия (наш каталог): Е-63 decision.gate_passed.","properties":{"closingPoint":"ZT-5","paperAttester":"head_of_qc","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-5 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"testing.zt5_protocol","queue":0,"in_progress":0,"passed":2,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.kt5_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"final.kt5_camera","element_id":"K2","name":"КТ-5 Камера окончательного контроля (4 ракурса)","kind":"automatedInspection","lane":"ОТК и выпуск","documentation":"Камера снимает изделие с 4 ракурсов на поворотном столе (по желанию): повреждения при перемещении, маркировка, комплектность.\nВыполняет VisionQC. Контрольная точка КТ-5. Запись: снимки в истории изделия.\nЧто может пойти не так: признак дефекта → сигнал; плохой кадр → «оценка невозможна».\nСобытия (наш каталог): Е-70 inspection.result.","properties":{"inspectionPoint":"KT-5","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-5 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-5 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"final.kt5_camera","queue":3,"in_progress":1,"passed":1,"defects":0},"items":[{"entity":"item","id":"ENT01:F-002"},{"entity":"item","id":"ENT01:F-003"},{"entity":"item","id":"ENT01:F-004"},{"entity":"item","id":"ENT01:F-005"}],"nonconformities":[]}
