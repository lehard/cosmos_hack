    body: {"process_version_id":"flange-1","step_key":"welding.edge_prep","element_id":"W1","name":"Подготовка кромок","kind":"operation","lane":"Сварочный цех","documentation":"Сварщик или слесарь зачищает и травит кромки под сварку.\nЗапись: журнал сварочных работ (время подготовки кромок).\nКонец шага запускает окно 8 ч до начала сварки [ПП, по аналогии с ПНАЭ Г-7-022-90 п. 5.2.6]. Травить кромки можно не больше 3 раз.\nЧто может пойти не так: кромки подготовили «впрок», и окно истекло в очереди.","properties":{"operationCode":"020","reworkLimit":"3","reworkLimitScope":"loop","stepKind":"operation"},"norm_refs":[],"counters":{"step_key":"welding.edge_prep","queue":4,"in_progress":0,"passed":3,"defects":0},"items":[{"entity":"item","id":"ENT01:F-037"},{"entity":"item","id":"ENT01:F-038"},{"entity":"item","id":"ENT01:F-039"},{"entity":"item","id":"ENT01:F-040"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.weld","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.weld","element_id":"W2","name":"Сварка фланца с патрубком","kind":"operation","lane":"Сварочный цех","documentation":"Сварщик сваривает фланец с патрубком на источнике ИС-1 или ИС-2; источник пишет ток, напряжение, скорость.\nЭто специальный процесс: его результат нельзя полностью оценить последующим контролем (ГОСТ Р 58633 п. 3.17, п. 6.7). Перед началом проверяются аттестация сварщика на дату, сроки проволоки и газа, исправность источника, окно кромок.\nЗаписи: журнал сварочных работ, журнал параметров спецпроцесса, клеймо сварщика у шва.\nЧто может пойти не так: ток вне уставки 160 ± 10 А [ПП] — нарушение режима даже без видимого дефекта; все изделия окна нарушения идут в несоответствие.\nСобытия (наш каталог): Е-40 operation.started, Е-42 machine.parameters, Е-43 machine.state.","properties":{"operationCode":"030","reworkLimit":"3","reworkLimitScope":"zone","specialProcess":"true","stepKind":"operation"},"norm_refs":[{"standard":"ГОСТ Р 58633-2020","clause":"3.17, 6.7","check":"Сварка отмечена как специальный процесс: её результат нельзя полностью оценить последующим контролем.","system_action":"Система помечает шаг как специальный процесс и хранит журнал параметров каждого выполнения."},{"standard":"ГОСТ Р 58633-2020","clause":"7.1","check":"Фактические значения ключевых характеристик сварки (ток, напряжение, скорость) зарегистрированы.","system_action":"Источник пишет параметры шва; система хранит сводку на каждое выполнение сварки и сравнивает её с уставкой."},{"standard":"ГОСТ Р 59861-2021","clause":"7.4.14","check":"При нарушении режима работы приостановлены до установления и устранения причин.","system_action":"Система выдаёт сигнал нарушения режима и предлагает остановить источник; остановку ставит и снимает уполномоченный человек."},{"standard":"ГОСТ Р 58633-2020","clause":"8.2","check":"У сварщика действующая аттестация на дату операции (по аналогии: при аттестации процесса проверяют квалификацию исполнителей и допуск).","system_action":"Предусловие шага блокирует начало сварки без действующей аттестации сварщика."}],"counters":{"step_key":"welding.weld","queue":0,"in_progress":0,"passed":4,"defects":0},"items":[],"nonconformities":[]}
