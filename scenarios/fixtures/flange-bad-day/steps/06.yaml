    body: {"process_version_id":"flange-1","step_key":"welding.weld","element_id":"W2","name":"Сварка фланца с патрубком","kind":"operation","lane":"Сварочный цех","documentation":"Сварщик сваривает фланец с патрубком на источнике ИС-1 или ИС-2; источник пишет ток, напряжение, скорость.\nЭто специальный процесс: его результат нельзя полностью оценить последующим контролем (ГОСТ Р 58633 п. 3.17, п. 6.7). Перед началом проверяются аттестация сварщика на дату, сроки проволоки и газа, исправность источника, окно кромок.\nЗаписи: журнал сварочных работ, журнал параметров спецпроцесса, клеймо сварщика у шва.\nЧто может пойти не так: ток вне уставки 160 ± 10 А [ПП] — нарушение режима даже без видимого дефекта; все изделия окна нарушения идут в несоответствие.\nСобытия (наш каталог): Е-40 operation.started, Е-42 machine.parameters, Е-43 machine.state.","properties":{"operationCode":"030","reworkLimit":"3","reworkLimitScope":"zone","specialProcess":"true","stepKind":"operation"},"norm_refs":[{"standard":"ГОСТ Р 58633-2020","clause":"3.17, 6.7","check":"Сварка отмечена как специальный процесс: её результат нельзя полностью оценить последующим контролем.","system_action":"Система помечает шаг как специальный процесс и хранит журнал параметров каждого выполнения."},{"standard":"ГОСТ Р 58633-2020","clause":"7.1","check":"Фактические значения ключевых характеристик сварки (ток, напряжение, скорость) зарегистрированы.","system_action":"Источник пишет параметры шва; система хранит сводку на каждое выполнение сварки и сравнивает её с уставкой."},{"standard":"ГОСТ Р 59861-2021","clause":"7.4.14","check":"При нарушении режима работы приостановлены до установления и устранения причин.","system_action":"Система выдаёт сигнал нарушения режима и предлагает остановить источник; остановку ставит и снимает уполномоченный человек."},{"standard":"ГОСТ Р 58633-2020","clause":"8.2","check":"У сварщика действующая аттестация на дату операции (по аналогии: при аттестации процесса проверяют квалификацию исполнителей и допуск).","system_action":"Предусловие шага блокирует начало сварки без действующей аттестации сварщика."}],"counters":{"step_key":"welding.weld","queue":0,"in_progress":0,"passed":13,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.kt3_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.kt3_camera","element_id":"W3","name":"КТ-3 Камера на шов (участки 40 мм)","kind":"automatedInspection","lane":"Сварочный цех","documentation":"Камера проходит вдоль шва по участкам 40 мм (У1…У8) и ищет подрез, брызги, поры на поверхности, кратер, прожог.\nВыполняет VisionQC. Прожог или подрез → карантин и черновик карточки несоответствия (правило R-07).\nКонтрольная точка КТ-3. Порог качества наблюдения 0,6 [П]: ниже порога «признаков нет» считается «оценка невозможна».\nЧто может пойти не так: «признаков нет» не закрывает внутренние дефекты — нужен рентген; высокая уверенность на плохом кадре не засчитывается.\nСобытия (наш каталог): Е-44 inspection.result.","properties":{"inspectionPoint":"KT-3","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-3 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-3 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"welding.kt3_camera","queue":0,"in_progress":1,"passed":12,"defects":0},"items":[{"entity":"item","id":"ENT01:F-019"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.kt3_radiography","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.kt3_radiography","element_id":"W4","name":"КТ-3 Рентген шва","kind":"automatedInspection","lane":"Сварочный цех","documentation":"Дефектоскопист лаборатории НК снимает шов, расшифровывает снимки и пишет заключение: внутренние поры, несплавления, прожог в корне.\nЗапись: заключение НК (ГОСТ 7512). Юридически значимо заключение, а не снимок.\nПредусловие — квалификация дефектоскописта. Узкое место № 1: очередь в лабораторию 4–24 ч [ПП].\nЧто может пойти не так: заключение не пришло — ЗТ-3 закрыта; долгая очередь задерживает обнаружение дефектов.\nСобытия (наш каталог): Е-45 inspection.result.","properties":{"inspectionPoint":"KT-3","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Заключение рентгена записано по каждому участку шва.","system_action":"Система хранит заключение лаборатории НК и не пропускает ЗТ-3 без него, если рентген назначен."}],"counters":{"step_key":"welding.kt3_radiography","queue":9,"in_progress":0,"passed":13,"defects":0},"items":[{"entity":"item","id":"ENT01:F-020"},{"entity":"item","id":"ENT01:F-022"},{"entity":"item","id":"ENT01:F-024"},{"entity":"item","id":"ENT01:F-026"},{"entity":"item","id":"ENT01:F-030"},{"entity":"item","id":"ENT01:F-033"},{"entity":"item","id":"ENT01:F-034"},{"entity":"item","id":"ENT01:F-035"},{"entity":"item","id":"ENT01:F-223"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.zt3_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.zt3_acceptance","element_id":"W5","name":"ЗТ-3 Приёмка ОТК","kind":"humanInspection","lane":"Сварочный цех","documentation":"Контролёр ОТК смотрит камеру по всем участкам шва, заключение рентгена и журнал сварки и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК; главный сварщик — при ремонте шва.\nЗаписи: отметка ОТК, журнал предъявления, клеймо сварщика. Закрывающая точка ЗТ-3. Журнал сварки должен быть в норме или разобран.\nЧто может пойти не так: решение принято до прихода опоздавшего журнала — система ставит на нём метку «пересмотрите».\nСобытия (наш каталог): Е-47 decision.gate_passed.","properties":{"closingPoint":"ZT-3","paperAttester":"head_of_workshop","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-3 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"welding.zt3_acceptance","queue":6,"in_progress":0,"passed":7,"defects":0},"items":[{"entity":"item","id":"ENT01:F-012"},{"entity":"item","id":"ENT01:F-014"},{"entity":"item","id":"ENT01:F-016"},{"entity":"item","id":"ENT01:F-018"},{"entity":"item","id":"ENT01:F-221"},{"entity":"item","id":"ENT01:F-222"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.send_to_assembly","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.send_to_assembly","element_id":"W6","name":"Отправка в сборочный цех","kind":"operation","lane":"Сварочный цех","documentation":"Мастер или кладовщик отправляет сварной узел в сборочно-испытательный цех (скан).\nЗапись: маршрутный лист.\nМежцеховая кладовая 0,5–4 ч, 2 рейса в смену [ПП].\nЧто может пойти не так: долгое ожидание → уведомление мастеру; повреждение при перемещении.\nСобытия (наш каталог): Е-30 movement.sent.","properties":{"stepKind":"movement"},"norm_refs":[],"counters":{"step_key":"welding.send_to_assembly","queue":2,"in_progress":0,"passed":6,"defects":0},"items":[{"entity":"item","id":"ENT01:F-011"},{"entity":"item","id":"ENT01:F-013"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.receive","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.receive","element_id":"A0","name":"Приёмка цехом: осмотр, подпись мастера","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Мастер сборочно-испытательного цеха принимает сварной узел и осматривает его.\nПодписывает принимающий мастер; это часть ЗТ-3.\nЗаписи: маршрутный лист, накладная на передачу между цехами.\nНашли повреждение при приёмке → сигнал.\nСобытия (наш каталог): Е-31 movement.received.","properties":{"paperAttester":"head_of_workshop","stepKind":"movement"},"norm_refs":[],"counters":{"step_key":"assembly.receive","queue":0,"in_progress":0,"passed":6,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.seal_install","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.seal_install","element_id":"A1","name":"Установка уплотнения","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Сборщик ставит уплотнение в канавку фланца.\nЗапись: карта сборки. Норма 5–10 мин [ПП].\nПосле вскрытия уплотнение ставят только новое.\nЧто может пойти не так: уплотнение из партии, которую позже признают браком.\nСобытия (наш каталог): Е-51 assembly.component_linked.","properties":{"operationCode":"040","stepKind":"operation"},"norm_refs":[],"counters":{"step_key":"assembly.seal_install","queue":5,"in_progress":4,"passed":6,"defects":0},"items":[{"entity":"item","id":"ENT01:F-217"},{"entity":"item","id":"ENT01:F-218"},{"entity":"item","id":"ENT01:F-219"},{"entity":"item","id":"ENT01:F-220"},{"entity":"item","id":"ENT01:F-006"},{"entity":"item","id":"ENT01:F-007"},{"entity":"item","id":"ENT01:F-008"},{"entity":"item","id":"ENT01:F-009"},{"entity":"item","id":"ENT01:F-015"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.torque","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.torque","element_id":"A6","name":"Затяжка по схеме","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Сборщик затягивает крепёж крест-накрест в 2–3 прохода (например, 30 % → 70 % → 100 % момента) ключом с записью момента и ставит метки краской [ПП].\nЗапись: журнал затяжек. Момент видит только ключ, камера его не видит.\nПредусловие — действующая поверка ключа.\nЧто может пойти не так: момент вне нормы → сигнал; у ключа истекла поверка — прежние результаты под сомнением.\nСобытия (наш каталог): Е-53 machine.parameters.","properties":{"operationCode":"070","stepKind":"operation"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Ключ с действующей поверкой; если его признали непригодным, прежние затяжки пересмотрены.","system_action":"Предусловие шага блокирует затяжку ключом с истёкшей поверкой; при непригодности ключа система помечает прежние результаты «под сомнением»."}],"counters":{"step_key":"assembly.torque","queue":0,"in_progress":0,"passed":6,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.zt4_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.zt4_acceptance","element_id":"A9","name":"ЗТ-4 ч.2 Приёмка сборки ОТК","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Контролёр ОТК смотрит камеру сборки, журнал ключа и результат КТ-4d и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК. Записи: карта сборки, журнал предъявления.\nЗакрывающая точка ЗТ-4; после вскрытия здесь же закрывается запись о вскрытии (ЗТ-В).\nЧто может пойти не так: нет одного из результатов — приёмка заблокирована.\nСобытия (наш каталог): Е-55 decision.gate_passed, Е-121 intervention.closed.","properties":{"closingPoint":"ZT-4.2","paperAttester":"site_foreman","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 n)","check":"Есть свидетельства, что все операции и проверки сборки завершены: камера, журнал ключа, КТ-4d.","system_action":"Без любого из этих результатов приёмка сборки заблокирована."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-4 ч.2 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"assembly.zt4_acceptance","queue":0,"in_progress":0,"passed":6,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.leak_test","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.leak_test","element_id":"T1","name":"Испытание на герметичность","kind":"automatedInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель ставит сборку на стенд с течеискателем: подготовка, наддув и выдержка, измерение — около 60 мин плюс 15 мин смена оснастки [ПП].\nЗаписи: журнал стенда (давление, выдержка, фон), программа и методика испытаний.\nПредусловия: поверка стенда и течеискателя, контрольная течь проверена. Узкое место № 2.\nЧто может пойти не так: давление не набрано → «оценка невозможна»; течь → брак, вскрытие и повторное испытание.\nСобытия (наш каталог): Е-60 operation.started, Е-61 machine.parameters, Е-62 inspection.result.","properties":{"operationCode":"080","reworkLimit":"2","reworkLimitScope":"loop","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Стенд и течеискатель с действующей поверкой, контрольная течь проверена.","system_action":"Предусловия шага блокируют испытание на стенде с истёкшей поверкой или без проверки контрольной течи."}],"counters":{"step_key":"testing.leak_test","queue":3,"in_progress":0,"passed":3,"defects":0},"items":[{"entity":"item","id":"ENT01:F-004"},{"entity":"item","id":"ENT01:F-005"},{"entity":"item","id":"ENT01:F-010"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.zt5_protocol","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.zt5_protocol","element_id":"T2","name":"ЗТ-5 Протокол испытаний","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель и контролёр ОТК подписывают протокол; ПЗ или ВП — если изделие в перечне приёмок.\nЗапись: протокол испытаний (подписи исполнителя, ОТК, ПЗ; номер пломбы).\nЗакрывающая точка ЗТ-5.\nЧто может пойти не так: представитель заказчика приходит по извещению, ожидание 1–8 ч [ПП].\nСобытия (наш каталог): Е-63 decision.gate_passed.","properties":{"closingPoint":"ZT-5","paperAttester":"head_of_qc","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-5 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"testing.zt5_protocol","queue":0,"in_progress":0,"passed":3,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"final.kt5_camera","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"final.kt5_camera","element_id":"K2","name":"КТ-5 Камера окончательного контроля (4 ракурса)","kind":"automatedInspection","lane":"ОТК и выпуск","documentation":"Камера снимает изделие с 4 ракурсов на поворотном столе (по желанию): повреждения при перемещении, маркировка, комплектность.\nВыполняет VisionQC. Контрольная точка КТ-5. Запись: снимки в истории изделия.\nЧто может пойти не так: признак дефекта → сигнал; плохой кадр → «оценка невозможна».\nСобытия (наш каталог): Е-70 inspection.result.","properties":{"inspectionPoint":"KT-5","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 c)","check":"Результат контроля на КТ-5 записан: исход, качество наблюдения, уверенность анализатора.","system_action":"Система записывает наблюдение как факт с одним из трёх исходов; «оценка невозможна» не засчитывается как «годно»."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1.1","check":"Камера и анализатор КТ-5 допущены к производству: известны версия анализатора и карта контроля, по которым прошёл допуск.","system_action":"Система хранит в каждом наблюдении версию анализатора и карту контроля; без действующего паспорта допуска результат идёт к человеку."}],"counters":{"step_key":"final.kt5_camera","queue":3,"in_progress":0,"passed":0,"defects":0},"items":[{"entity":"item","id":"ENT01:F-001"},{"entity":"item","id":"ENT01:F-002"},{"entity":"item","id":"ENT01:F-003"}],"nonconformities":[]}
