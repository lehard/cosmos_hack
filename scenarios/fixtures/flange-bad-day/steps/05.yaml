    body: {"process_version_id":"flange-1","step_key":"welding.zt3_acceptance","element_id":"W5","name":"ЗТ-3 Приёмка ОТК","kind":"humanInspection","lane":"Сварочный цех","documentation":"Контролёр ОТК смотрит камеру по всем участкам шва, заключение рентгена и журнал сварки и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК; главный сварщик — при ремонте шва.\nЗаписи: отметка ОТК, журнал предъявления, клеймо сварщика. Закрывающая точка ЗТ-3. Журнал сварки должен быть в норме или разобран.\nЧто может пойти не так: решение принято до прихода опоздавшего журнала — система ставит на нём метку «пересмотрите».\nСобытия (наш каталог): Е-47 decision.gate_passed.","properties":{"closingPoint":"ZT-3","paperAttester":"head_of_workshop","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-3 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"welding.zt3_acceptance","queue":6,"in_progress":0,"passed":4,"defects":0},"items":[{"entity":"item","id":"ENT01:F-011"},{"entity":"item","id":"ENT01:F-012"},{"entity":"item","id":"ENT01:F-013"},{"entity":"item","id":"ENT01:F-014"},{"entity":"item","id":"ENT01:F-015"},{"entity":"item","id":"ENT01:F-221"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"welding.send_to_assembly","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"welding.send_to_assembly","element_id":"W6","name":"Отправка в сборочный цех","kind":"operation","lane":"Сварочный цех","documentation":"Мастер или кладовщик отправляет сварной узел в сборочно-испытательный цех (скан).\nЗапись: маршрутный лист.\nМежцеховая кладовая 0,5–4 ч, 2 рейса в смену [ПП].\nЧто может пойти не так: долгое ожидание → уведомление мастеру; повреждение при перемещении.\nСобытия (наш каталог): Е-30 movement.sent.","properties":{"stepKind":"movement"},"norm_refs":[],"counters":{"step_key":"welding.send_to_assembly","queue":0,"in_progress":0,"passed":5,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.receive","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.receive","element_id":"A0","name":"Приёмка цехом: осмотр, подпись мастера","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Мастер сборочно-испытательного цеха принимает сварной узел и осматривает его.\nПодписывает принимающий мастер; это часть ЗТ-3.\nЗаписи: маршрутный лист, накладная на передачу между цехами.\nНашли повреждение при приёмке → сигнал.\nСобытия (наш каталог): Е-31 movement.received.","properties":{"paperAttester":"head_of_workshop","stepKind":"movement"},"norm_refs":[],"counters":{"step_key":"assembly.receive","queue":5,"in_progress":0,"passed":0,"defects":0},"items":[{"entity":"item","id":"ENT01:F-006"},{"entity":"item","id":"ENT01:F-007"},{"entity":"item","id":"ENT01:F-008"},{"entity":"item","id":"ENT01:F-009"},{"entity":"item","id":"ENT01:F-010"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.seal_install","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.seal_install","element_id":"A1","name":"Установка уплотнения","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Сборщик ставит уплотнение в канавку фланца.\nЗапись: карта сборки. Норма 5–10 мин [ПП].\nПосле вскрытия уплотнение ставят только новое.\nЧто может пойти не так: уплотнение из партии, которую позже признают браком.\nСобытия (наш каталог): Е-51 assembly.component_linked.","properties":{"operationCode":"040","stepKind":"operation"},"norm_refs":[],"counters":{"step_key":"assembly.seal_install","queue":1,"in_progress":4,"passed":4,"defects":0},"items":[{"entity":"item","id":"ENT01:F-217"},{"entity":"item","id":"ENT01:F-218"},{"entity":"item","id":"ENT01:F-219"},{"entity":"item","id":"ENT01:F-220"},{"entity":"item","id":"ENT01:F-005"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.torque","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.torque","element_id":"A6","name":"Затяжка по схеме","kind":"operation","lane":"Сборочно-испытательный цех","documentation":"Сборщик затягивает крепёж крест-накрест в 2–3 прохода (например, 30 % → 70 % → 100 % момента) ключом с записью момента и ставит метки краской [ПП].\nЗапись: журнал затяжек. Момент видит только ключ, камера его не видит.\nПредусловие — действующая поверка ключа.\nЧто может пойти не так: момент вне нормы → сигнал; у ключа истекла поверка — прежние результаты под сомнением.\nСобытия (наш каталог): Е-53 machine.parameters.","properties":{"operationCode":"070","stepKind":"operation"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Ключ с действующей поверкой; если его признали непригодным, прежние затяжки пересмотрены.","system_action":"Предусловие шага блокирует затяжку ключом с истёкшей поверкой; при непригодности ключа система помечает прежние результаты «под сомнением»."}],"counters":{"step_key":"assembly.torque","queue":0,"in_progress":1,"passed":3,"defects":0},"items":[{"entity":"item","id":"ENT01:F-004"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"assembly.zt4_acceptance","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"assembly.zt4_acceptance","element_id":"A9","name":"ЗТ-4 ч.2 Приёмка сборки ОТК","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Контролёр ОТК смотрит камеру сборки, журнал ключа и результат КТ-4d и решает: годно, мало данных, не годно.\nПодписывает контролёр ОТК. Записи: карта сборки, журнал предъявления.\nЗакрывающая точка ЗТ-4; после вскрытия здесь же закрывается запись о вскрытии (ЗТ-В).\nЧто может пойти не так: нет одного из результатов — приёмка заблокирована.\nСобытия (наш каталог): Е-55 decision.gate_passed, Е-121 intervention.closed.","properties":{"closingPoint":"ZT-4.2","paperAttester":"site_foreman","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.1 n)","check":"Есть свидетельства, что все операции и проверки сборки завершены: камера, журнал ключа, КТ-4d.","system_action":"Без любого из этих результатов приёмка сборки заблокирована."},{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-4 ч.2 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"assembly.zt4_acceptance","queue":0,"in_progress":0,"passed":3,"defects":0},"items":[],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.leak_test","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.leak_test","element_id":"T1","name":"Испытание на герметичность","kind":"automatedInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель ставит сборку на стенд с течеискателем: подготовка, наддув и выдержка, измерение — около 60 мин плюс 15 мин смена оснастки [ПП].\nЗаписи: журнал стенда (давление, выдержка, фон), программа и методика испытаний.\nПредусловия: поверка стенда и течеискателя, контрольная течь проверена. Узкое место № 2.\nЧто может пойти не так: давление не набрано → «оценка невозможна»; течь → брак, вскрытие и повторное испытание.\nСобытия (наш каталог): Е-60 operation.started, Е-61 machine.parameters, Е-62 inspection.result.","properties":{"operationCode":"080","reworkLimit":"2","reworkLimitScope":"loop","stepKind":"automated_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"7.1.5.2","check":"Стенд и течеискатель с действующей поверкой, контрольная течь проверена.","system_action":"Предусловия шага блокируют испытание на стенде с истёкшей поверкой или без проверки контрольной течи."}],"counters":{"step_key":"testing.leak_test","queue":2,"in_progress":0,"passed":1,"defects":0},"items":[{"entity":"item","id":"ENT01:F-002"},{"entity":"item","id":"ENT01:F-003"}],"nonconformities":[]}
  - op: process.node.read
    params: {"step_key":"testing.zt5_protocol","version_id":"flange-1"}
    body: {"process_version_id":"flange-1","step_key":"testing.zt5_protocol","element_id":"T2","name":"ЗТ-5 Протокол испытаний","kind":"humanInspection","lane":"Сборочно-испытательный цех","documentation":"Испытатель и контролёр ОТК подписывают протокол; ПЗ или ВП — если изделие в перечне приёмок.\nЗапись: протокол испытаний (подписи исполнителя, ОТК, ПЗ; номер пломбы).\nЗакрывающая точка ЗТ-5.\nЧто может пойти не так: представитель заказчика приходит по извещению, ожидание 1–8 ч [ПП].\nСобытия (наш каталог): Е-63 decision.gate_passed.","properties":{"closingPoint":"ZT-5","paperAttester":"head_of_qc","stepKind":"human_inspection"},"norm_refs":[{"standard":"ГОСТ Р 58876-2020","clause":"8.5.2","check":"Средство приёмки на ЗТ-5 — электронная подпись контролёра — под управлением: видно, кто подписал решение, по какой роли и когда.","system_action":"Точка не пропускает изделие без подписи уполномоченного лица; подпись хранится с автором, ролью и временем."}],"counters":{"step_key":"testing.zt5_protocol","queue":1,"in_progress":0,"passed":0,"defects":0},"items":[{"entity":"item","id":"ENT01:F-001"}],"nonconformities":[]}
