    body: {"process_version_id":"flange-1","step_key":"welding.edge_prep","element_id":"W1","name":"Подготовка кромок","kind":"operation","lane":"Сварочный цех","documentation":"Сварщик или слесарь зачищает и травит кромки под сварку.\nЗапись: журнал сварочных работ (время подготовки кромок).\nКонец шага запускает окно 8 ч до начала сварки [ПП, по аналогии с ПНАЭ Г-7-022-90 п. 5.2.6]. Травить кромки можно не больше 3 раз.\nЧто может пойти не так: кромки подготовили «впрок», и окно истекло в очереди.","properties":{"operationCode":"020","reworkLimit":"3","reworkLimitScope":"loop","stepKind":"operation"},"norm_refs":[],"counters":{"step_key":"welding.edge_prep","queue":19,"in_progress":0,"passed":9,"defects":0},"items":[{"entity":"item","id":"ENT01:F-017"},{"entity":"item","id":"ENT01:F-019"},{"entity":"item","id":"ENT01:F-021"},{"entity":"item","id":"ENT01:F-023"},{"entity":"item","id":"ENT01:F-025"},{"entity":"item","id":"ENT01:F-026"},{"entity":"item","id":"ENT01:F-027"},{"entity":"item","id":"ENT01:F-028"},{"entity":"item","id":"ENT01:F-029"},{"entity":"item","id":"ENT01:F-031"},{"entity":"item","id":"ENT01:F-032"},{"entity":"item","id":"ENT01:F-033"},{"entity":"item","id":"ENT01:F-034"},{"entity":"item","id":"ENT01:F-036"},{"entity":"item","id":"ENT01:F-037"},{"entity":"item","id":"ENT01:F-038"},{"entity":"item","id":"ENT01:F-039"},{"entity":"item","id":"ENT01:F-040"},{"entity":"item","id":"ENT01:F-224"}],"nonconformities":[]}
