# Ожидания S13 — отдельно от входных событий (кейс §5.1, AD-26): утверждения над теми же
# operationId, что показывают столы; check.path — путь в ответе (board.go), значения — ID
# процессной сессии (сверка переводит их сведением имён прогона). mapping: exact — поле
# ответа контракта; draft — по смыслу, путь уточнит модуль-владелец; manual — видно на экране.
scenario: S13
version: 0.3-draft
title: «Специалист заснул» — очередь на ЗТ-3 без решения, эскалация, перераспределение
run: S13
source: 'process/scenarios-flange-expected.yaml процессной сессии, версия 0.3-draft: утверждения процессной сессии — в source без изменений, check — исполняемая форма эпика 32'
checkpoints:
- at: '2026-09-25T10:30:00+03:00'
  label: 'разгар: 9 фланцев ждут'
  assertions:
  - id: S13-01
    what: на ЗТ-3 без подписи стоят 9 фланцев двух заказов
    check:
      operation: nonconformity.queue.list
      path: /items
      op: set_eq
      value: &id001
      - F-030
      - F-031
      - F-032
      - F-033
      - F-034
      - F-035
      - F-036
      - F-223
      - F-224
    mapping: draft
    source:
      subject: gate/ZT-3
      field: queue
      op: set_eq
      value: *id001
    note: ЗТ ZT-3
  - id: S13-02
    what: 'живая карта: узел ЗТ-3 — ограничение линии и аномалия «ожидание выше срока» (FR-5)'
    check:
      operation: process.live_map.read
      path: /
      op: eq
      value: true
    mapping: draft
    source:
      subject: map/node/W5
      field:
        constraint: true
        anomaly: wait_over_due
        anomaly_since: '2026-09-25T09:00:00+03:00'
        queue_color: bad
      op: eq
      value: true
  - id: S13-03
    what: 'эскалация по уровням: напоминание → мастер → начальник ОТК'
    check:
      operation: notifications.alert.list
      path: /items
      op: eq
      value: &id002
      - level: reminder
        to: QC-01
        at: '2026-09-25T08:30:00+03:00'
      - level: master
        to: MST-02
        at: '2026-09-25T09:00:00+03:00'
      - level: qc_head
        to: QC-HEAD-01
        at: '2026-09-25T10:00:00+03:00'
    mapping: draft
    source:
      subject: escalation/ZT-3@2026-09-25
      field: levels
      op: eq
      value: *id002
  - id: S13-04
    what: цена задержки в 10:20 посчитана сама
    check:
      operation: notifications.alert.list
      path: /items
      op: eq
      value: &id003
        overdue_min: 80
        items_waiting: 9
        by_order:
          ORD-0917: 7
          ORD-0911: 2
        wait_over_norm_item_min: 420
        stops_forecast:
        - object: assembly_post
          at: '10:30'
        - object: LT-1
          at: '12:00'
        release_shift_min_gte: 110
    mapping: draft
    source:
      subject: escalation/ZT-3@2026-09-25
      field: delay_cost
      filter:
        at: '2026-09-25T10:20:00+03:00'
      op: eq
      value: *id003
  - id: S13-05
    what: подтверждение мастера записано, но сроки не остановило
    check:
      operation: notifications.alert.list
      path: /items
      op: eq
      value: true
    mapping: draft
    source:
      subject: escalation/ZT-3@2026-09-25
      field:
        ack_by: MST-02
        ack_at: '2026-09-25T09:05:00+03:00'
        next_level_fired_at: '2026-09-25T10:00:00+03:00'
      op: eq
      value: true
  - id: S13-06
    what: 'варианты перераспределения с прогнозом: система предлагает, человек выбирает'
    check:
      operation: notifications.alert.list
      path: /items
      op: contains
      value: &id004
      - option: second_controller
        who: QC-02
        queue_empty_forecast: ≈ 12:15
      - option: next_shift
        earliest: '2026-09-28T08:00:00+03:00'
        reason: в смене Б контролёра ЗТ-3 нет
    mapping: draft
    source:
      subject: escalation/ZT-3@2026-09-25
      field: options
      op: contains
      value: *id004
- at: '2026-09-25T11:00:00+03:00'
  label: перераспределение
  assertions:
  - id: S13-07
    what: 'ОТК-2 на ЗТ-3: запросил мастер, согласовал начальник ОТК; проверены допуск и «не участвовала в изготовлении»; запись в журнале критических действий'
    check:
      operation: access.assignment.list
      path: /items
      op: contains
      value: &id005
      - assignee: QC-02
        from: '2026-09-25T10:45:00+03:00'
        requested_by: MST-02
        approved_by: QC-HEAD-01
        qualification_checked: true
        not_involved_in_manufacture: true
        critical_log: true
    mapping: draft
    source:
      subject: post/ZT-3
      field: assignment_changes
      op: contains
      value: *id005
- at: '2026-09-25T13:00:00+03:00'
  label: очередь разобрана
  assertions:
  - id: S13-08
    what: эскалация закрыта сама в 12:10 — очередь пуста; ЗТ-3 больше не ограничение линии
    check:
      operation: notifications.alert.list
      path: /items
      op: eq
      value: true
    mapping: draft
    source:
      subject: escalation/ZT-3@2026-09-25
      field:
        closed_at: '2026-09-25T12:10:00+03:00'
        reason: queue_cleared
        W5_constraint_after_close: false
      op: eq
      value: true
  - id: S13-09
    what: 10 решений на ЗТ-3 — каждое по одному фланцу и с подписью
    check:
      operation: nonconformity.queue.list
      path: /items
      op: eq
      value: &id006
        QC-01:
        - F-024
        - F-035
        - F-036
        - F-223
        - F-224
        QC-02:
        - F-030
        - F-031
        - F-032
        - F-033
        - F-034
    mapping: draft
    source:
      subject: gate/ZT-3
      field: decisions_by_signer
      filter:
        date: '2026-09-25'
      op: eq
      value: *id006
    note: ЗТ ZT-3
  - id: S13-10
    what: 'Д-1 «ждёт подписи на ЗТ»: 9 из 10 позже срока, максимум 200 мин у F-032, сверх нормы 1010 фланце-минут; ночь не считается'
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: D-1
      path: /total
      op: eq
      value: true
    mapping: draft
    source:
      subject: metric/D-1
      field:
        decisions: 10
        over_due: 9
        median_min: 135
        max_min: 200
        max_item: F-032
        over_norm_sum_min: 1010
        carryover_counted_from: '2026-09-25T08:00:00+03:00'
      filter:
        gate: ZT-3
        kind: waiting_for_gate_signature
        date: '2026-09-25'
      op: eq
      value: true
    note: показатель D-1 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S13-11
    what: 'Д-2: простой стенда и поста сборки, причина «нет детали»'
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: D-2
      path: /idle
      op: contains
      value: &id007
      - object: LT-1
        from: '12:00'
        to: '12:45'
        reason: no_part
      - object: assembly_post
        from: '10:30'
        to: '11:20'
        reason: no_part
    mapping: draft
    source:
      subject: metric/D-2
      field: idle
      filter:
        date: '2026-09-25'
      op: contains
      value: *id007
    note: показатель D-2 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S13-12
    what: 'пропускная способность ЗТ-3: 0 решений за 2 ч 45 мин, затем 9 за 1 ч 10 мин'
    check:
      operation: process.live_map.read
      path: /
      op: eq
      value: &id008
      - from: 08:15
        to: '11:00'
        decisions: 0
      - from: '11:00'
        to: '12:10'
        decisions: 9
    mapping: draft
    source:
      subject: map/node/W5
      field: throughput_windows
      op: eq
      value: *id008
  - id: S13-13
    what: 'ожидание — не возврат: все 10 прошли ЗТ-3 с первого предъявления'
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: D-3
      path: /first_pass_items
      op: eq
      value: 10
    mapping: draft
    source:
      subject: metric/D-3
      field: first_pass_items
      filter:
        gate: ZT-3
        date: '2026-09-25'
      op: eq
      value: 10
    note: показатель D-3 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S13-14
    what: в 1С — 10 «перемещений СЦ → СИЦ», каждое после своей подписи
    check:
      operation: erp.message.list
      path: /items
      op: eq
      value: true
    mapping: draft
    source:
      subject: erp/postings
      field:
        count: 10
        sent_before_gate_signature: 0
      filter:
        type: transfer
        route: WC->AC
        date: '2026-09-25'
      op: eq
      value: true
  - id: S13-15
    what: 'по желанию: правило R-21 заблокировало уплотнение под F-031 (4 ч вне склада) и выдало новое; не списано, фланец не тронут'
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-031}'
      path: /seal_issues
      op: eq
      value: &id009
      - lot: LOT-SL-401
        issued_at: 08:10
        blocked_at: '12:10'
        rule: R-21
        action: block_and_reissue
        scrapped: false
      - lot: LOT-SL-401
        issued_at: '12:15'
    mapping: draft
    source:
      subject: item/F-031
      field: seal_issues
      op: eq
      value: *id009
- at: '2026-09-25T13:00:00+03:00'
  label: чего не должно случиться
  must_not: true
  assertions:
  - id: S13-N1
    what: ни один фланец не прошёл ЗТ-3 без подписи; нет «принято по истечении срока» и подписи пачкой
    check:
      operation: nonconformity.queue.list
      path: /items
      op: eq
      value: true
    mapping: draft
    source:
      subject: gate/ZT-3
      field:
        passed_without_signature: 0
        auto_accept_on_timeout: 0
        batch_signatures: 0
      filter:
        date: '2026-09-25'
      op: eq
      value: true
    note: ЗТ ZT-3
  - id: S13-N2
    what: среди вариантов нет «пропустить без подписи»
    check:
      operation: notifications.alert.list
      path: /items
      op: not_contains
      value: &id010
      - auto_pass
      - pass_without_signature
      - batch_accept
    mapping: draft
    source:
      subject: escalation/ZT-3@2026-09-25
      field: options
      op: not_contains
      value: *id010
  - id: S13-N3
    what: нет рейтинга, «простоя контролёра» и записи «нарушение» на ОТК-1; О-10 не меняется
    check:
      operation: access.person.read
      params:
        person_id: '{person:QC-01}'
      path: /
      op: eq
      value: true
    mapping: draft
    source:
      subject: people/QC-01
      field:
        rating: none
        idle_metric: none
        violation_records: 0
        O-10_changed: false
      op: eq
      value: true
  - id: S13-N4
    what: '«нет решения» ≠ «нет данных»: Е-82 нет, Н-5 не меняется'
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: N-5
      path: /all
      op: unchanged
    mapping: draft
    baseline: '2026-09-25T07:59:00+03:00'
    source:
      subject: metric/N-5
      field: all
      op: unchanged
      baseline: '2026-09-25T07:59:00+03:00'
    note: показатель N-5 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S13-N5
    what: 'это не инцидент качества: нет сигналов, несоответствий и цветов области риска'
    check:
      operation: item.item.list
      path: /items
      op: eq
      value: true
    mapping: draft
    source:
      subject: item/*
      field:
        signals: 0
        nc_count: 0
        incident_color: none
      filter:
        items:
        - F-024
        - F-030
        - F-031
        - F-032
        - F-033
        - F-034
        - F-035
        - F-036
        - F-223
        - F-224
      op: eq
      value: true
    note: 'проверка по списку изделий {"items": ["F-024", "F-030", "F-031", "F-032", "F-033", "F-034", "F-035", "F-036", "F-223", "F-224"]}'
