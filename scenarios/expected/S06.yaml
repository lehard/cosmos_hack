# Ожидания S06 — отдельно от входных событий (кейс §5.1, AD-26): утверждения над теми же
# operationId, что показывают столы; check.path — путь в ответе (board.go), значения — ID
# процессной сессии (сверка переводит их сведением имён прогона). mapping: exact — поле
# ответа контракта; draft — по смыслу, путь уточнит модуль-владелец; manual — видно на экране.
scenario: S06
version: 0.3-draft
title: Повторная доставка — дубли не считаются дважды
run: MS-1
source: 'process/scenarios-flange-expected.yaml процессной сессии, версия 0.3-draft: утверждения процессной сессии — в source без изменений, check — исполняемая форма эпика 32'
checkpoints:
- at: '2026-09-23T12:07:00+03:00'
  label: после пачки ИС-2
  assertions:
  - id: S06-01
    what: у Ф-017 один дефект с двумя наблюдениями (два ракурса)
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-017}'
      path: /status
      op: eq
      value: true
    mapping: draft
    source:
      subject: item/F-017
      field:
        defects_at_U2: 1
        observations_of_defect: 2
      op: eq
      value: true
  - id: S06-02
    what: повтор сообщения камеры — «повтор, состояние не изменилось»
    check:
      operation: ingest.metrics.read
      path: /outcome
      op: eq
      value: duplicate
    mapping: draft
    source:
      subject: ingest
      field: outcome
      filter:
        source: CAM-WS-1
        at: '2026-09-23T11:05:40+03:00'
      op: eq
      value: duplicate
  - id: S06-03
    what: из пачки ИС-2 отсеяно 312 повторов, принято 928
    check:
      operation: ingest.metrics.read
      path: /duplicates
      op: delta
      value: 312
    mapping: exact
    baseline: '2026-09-23T12:04:00+03:00'
    source:
      subject: ingest
      field:
        received: 1240
        duplicates: 312
        accepted: 928
      filter:
        source: GW-2
        batch_received_at: '2026-09-23T12:05:00+03:00'
      op: eq
      value: true
      baseline: '2026-09-23T12:04:00+03:00'
    note: 'из пачки ИС-2: 1 240 доставок, 312 повторов'
  - id: S06-04
    what: 'Н-5: дублей отсеяно +313'
    check:
      operation: ingest.metrics.read
      path: /duplicates
      op: delta
      value: 313
    mapping: exact
    baseline: '2026-09-23T11:04:00+03:00'
    source:
      subject: metric/N-5
      field: duplicates_filtered
      op: delta
      value: 313
      baseline: '2026-09-23T11:04:00+03:00'
    note: 312 повторов пачки + 1 повтор кадра Ф-017
- at: standalone
  label: 'отдельный прогон: повторная отправка той же пачки'
  note: только отдельный прогон (повторная отправка той же пачки — кнопка цифрового стенда, эпик 36)
  assertions:
  - id: S06-05
    what: все показатели, кроме счётчика дублей, не изменились
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: all
      path: /all_except_N-5.duplicates_filtered
      op: unchanged
    mapping: draft
    baseline: до повторной отправки
    source:
      subject: metric/*
      field: all_except_N-5.duplicates_filtered
      op: unchanged
      baseline: до повторной отправки
    note: показатель all каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S06-06
    what: тот же номер, другое содержимое → конфликт в журнал критических действий
    check:
      operation: security.critical_action.list
      path: /items/#
      op: delta
      value: 1
    mapping: draft
    baseline: до повторной отправки
    source:
      subject: audit/critical_actions
      field: count
      filter:
        code: E_ID_CONFLICT
      op: delta
      value: 1
      baseline: до повторной отправки
- at: '2026-09-23T12:07:00+03:00'
  label: чего не должно случиться
  must_not: true
  assertions:
  - id: S06-N1
    what: число уникальных дефектов не растёт от дублей
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: O-3
      path: /unique_defects
      op: delta
      value: 0
    mapping: draft
    baseline: до повторной отправки
    source:
      subject: metric/O-3
      field: unique_defects
      op: delta
      value: 0
      baseline: до повторной отправки
    note: показатель O-3 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S06-N2
    what: дубль события — не повтор операции
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: rework_runs
        period: week
      path: /total/value
      op: delta
      value: 0
    mapping: exact
    baseline: '2026-09-23T12:00:00+03:00'
    note: 'сведение: показатель rework_runs (О-8)'
    source:
      subject: metric/O-8
      field: repeated_runs
      op: delta
      value: 0
      baseline: до повторной отправки
  - id: S06-N3
    what: нет второго сигнала по Ф-017
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-017}'
      path: /signals_at_U2
      op: eq
      value: 1
    mapping: draft
    source:
      subject: item/F-017
      field: signals_at_U2
      op: eq
      value: 1
