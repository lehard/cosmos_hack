# Ожидания прогона сбоя F05 — отдельно от входных событий (кейс §5.1, AD-26).
scenario: F05
version: '1'
title: 'Сбой: Рассинхрон часов'
run: F05
source: эпик 32 по research/data-collection-sources-and-failures.md §6 (ожидаемое поведение системы)
checkpoints:
