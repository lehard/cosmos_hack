# Ожидания S11 — отдельно от входных событий (кейс §5.1, AD-26): утверждения над теми же
# operationId, что показывают столы; check.path — путь в ответе (board.go), значения — ID
# процессной сессии (сверка переводит их сведением имён прогона). mapping: exact — поле
# ответа контракта; draft — по смыслу, путь уточнит модуль-владелец; manual — видно на экране.
scenario: S11
version: 0.3-draft
title: «Забыли прокладку» — шаг остановлен до брака (Ф-003)
run: MS-1
source: 'process/scenarios-flange-expected.yaml процессной сессии, версия 0.3-draft: утверждения процессной сессии — в source без изменений, check — исполняемая форма эпика 32'
checkpoints:
- at: '2026-09-22T12:15:00+03:00'
  label: после установки крышки
  assertions:
  - id: S11-01
    what: замеченное действие записано как гипотеза с уверенностью
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /operator_actions_detected
      op: contains
      value: &id001
      - source: OV-ASM
        deviation: step_skipped
        expected_step: seal_install
        confidence: 0.78
    mapping: draft
    source:
      subject: item/F-003
      field: operator_actions_detected
      op: contains
      value: *id001
  - id: S11-02
    what: шаг «установка крышки» остановлен до брака
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /step_blocks
      op: contains
      value: &id002
      - step: cover_install
        reason: нет подтверждения установки уплотнения и предъявления зоны
        at: '2026-09-22T11:50:06+03:00'
    mapping: draft
    source:
      subject: item/F-003
      field: step_blocks
      op: contains
      value: *id002
  - id: S11-03
    what: 'дальше по порядку: уплотнение → зона чистая → ЗТ-СР (скрытые работы) → крышка'
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /step_order
      op: eq
      value: &id003
      - seal_install
      - zone_check_uv
      - zt_sr
      - cover_install
    mapping: draft
    source:
      subject: item/F-003
      field: step_order
      op: eq
      value: *id003
  - id: S11-04
    what: сборщик определён по учётной записи терминала
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /operator_identification
      op: eq
      value: terminal_login
    mapping: draft
    source:
      subject: item/F-003
      field: operator_identification
      op: eq
      value: terminal_login
  - id: S11-05
    what: без OperatorVision шаг блокируется по порядку маршрута
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /block_without_vision
      op: eq
      value: true
    mapping: draft
    source:
      subject: item/F-003
      field: block_without_vision
      op: eq
      value: true
- at: '2026-09-22T12:15:00+03:00'
  label: чего не должно случиться
  must_not: true
  assertions:
  - id: S11-N1
    what: нет сигнала о дефекте и несоответствия; изделие не изолировано
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /status
      op: eq
      value:
        containment: none
        disposition: none
        summary: in_process
    mapping: exact
    note: 'сведение: нет сдерживания, решения и итога «не годно»'
    source:
      subject: item/F-003
      field:
        signals: 0
        nc_count: 0
        status_isolated: false
      op: eq
      value: true
  - id: S11-N2
    what: событие не идёт в показатели по людям
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: O-10
      path: /all
      op: unchanged
    mapping: draft
    baseline: '2026-09-22T11:44:00+03:00'
    source:
      subject: metric/O-10
      field: all
      op: unchanged
      baseline: '2026-09-22T11:44:00+03:00'
    note: показатель O-10 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S11-N3
    what: видео наружу не передаётся, лица не распознаются
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-003}'
      path: /status
      op: eq
      value: true
    mapping: draft
    source:
      subject: item/F-003
      field:
        video_transferred: false
        face_recognition: false
      op: eq
      value: true
