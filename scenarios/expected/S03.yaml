# Ожидания S03 — отдельно от входных событий (кейс §5.1, AD-26): утверждения над теми же
# operationId, что показывают столы; check.path — путь в ответе (board.go), значения — ID
# процессной сессии (сверка переводит их сведением имён прогона). mapping: exact — поле
# ответа контракта; draft — по смыслу, путь уточнит модуль-владелец; manual — видно на экране.
scenario: S03
version: 0.3-draft
title: Новый дефект после сварки — прожог на Ф-017
run: MS-1
source: 'process/scenarios-flange-expected.yaml процессной сессии, версия 0.3-draft: утверждения процессной сессии — в source без изменений, check — исполняемая форма эпика 32'
checkpoints:
- at: '2026-09-23T11:25:00+03:00'
  label: после изоляции Ф-017
  assertions:
  - id: S03-01
    what: сигнал, затем НС-01 подтверждено ОТК-1
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /human_decisions/*/event_type
      op: contains
      value:
      - decision.nonconformity.confirmed
      - decision.item.isolated
    mapping: exact
    note: 'сведение: подтверждение и изоляция — решения людей'
    source:
      subject: nc/NC-01
      field: status_path
      op: contains
      value:
      - signal
      - confirmed
      - isolated
  - id: S03-02
    what: подтверждение — отдельная запись с автором и причиной
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /human_decisions[event_type=decision.nonconformity.confirmed]/0/author
      op: eq
      value: QC-01
    mapping: exact
    note: 'сведение: подтверждение — отдельная запись решения с автором ОТК-1 (причина — в тексте записи)'
    source:
      subject: nc/NC-01
      field: decisions[0]
      op: eq
      value:
        type: signal_confirmed
        author: QC-01
        at: '2026-09-23T11:08:00+03:00'
        reason_present: true
  - id: S03-03
    what: Ф-017 изолирован, физически перемещён
    check:
      operation: item.passport.read
      params:
        item_id: '{item:F-017}'
      path: /status/position
      op: eq
      value: isolated
    mapping: exact
    note: 'сведение: положение «в изоляции» — изделие физически в изоляторе (AD-30)'
    source:
      subject: item/F-017
      field:
        status: isolated
        physically_moved: true
      op: eq
      value: true
  - id: S03-04
    what: срок решения — 3 рабочих дня
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /isolation/decision_due_at
      op: eq
      value: '2026-09-28T16:30:00+03:00'
    mapping: exact
    note: 'сведение: срок решения по изделию'
    source:
      subject: nc/NC-01
      field: disposition_due
      op: eq
      value: '2026-09-28'
  - id: S03-05
    what: последняя чистая проверка зоны — КТ-2 до сварки
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /last_clean_observation
      op: eq
      value: &id001
        checkpoint: CP-MO
        zone: EDGE
        quality: 0.93
    mapping: draft
    source:
      subject: nc/NC-01
      field: last_clean_observation
      op: eq
      value: *id001
  - id: S03-06
    what: 'окно возникновения: сварка SV-017-1 и перемещение'
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /origin_window_candidates
      op: set_eq
      value: &id002
      - run:SV-017-1
      - move:MC->WC
    mapping: draft
    source:
      subject: nc/NC-01
      field: origin_window_candidates
      op: set_eq
      value: *id002
  - id: S03-07
    what: 'гипотезы v1: причина не установлена, оборудование не оценить'
    check:
      operation: analysis.hypothesis.list
      params:
        nc_id: '{ref:NC-01}'
      path: /hypotheses[status=confirmed]/#
      op: eq
      value: 0
    mapping: exact
    note: 'сведение: причина не установлена: подтверждённых гипотез нет'
    source:
      subject: hypothesis/NC-01
      field:
        overall: undetermined
        equipment: not_assessable
        operator_procedure: possible
      filter:
        version: 1
      op: eq
      value: true
  - id: S03-08
    what: перечислено, чего не хватает
    check:
      operation: analysis.hypothesis.list
      params:
        nc_id: '{ref:NC-01}'
      path: /missing_information
      op: contains
      value:
      - equipment_log_missing
    mapping: exact
    note: 'сведение: нет журнала ИС-2 (рентгена ещё нет — пункт «после операции» не обязателен)'
    source:
      subject: hypothesis/NC-01
      field: missing_info
      filter:
        version: 1
      op: contains
      value:
      - журнал параметров WS-2 10:40–11:00
      - рентген F-017
  - id: S03-09
    what: ручное действие С-02 — в обстоятельствах с пометкой «не вина»
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /circumstances
      op: contains
      value: &id003
      - type: manual_override
        operator: WLD-02
        label: обстоятельство, не вина
    mapping: draft
    source:
      subject: nc/NC-01
      field: circumstances
      op: contains
      value: *id003
  - id: S03-10
    what: сравнение с эталоном Ф-001 доступно
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /reference_item
      op: eq
      value: F-001
    mapping: draft
    source:
      subject: nc/NC-01
      field: reference_item
      op: eq
      value: F-001
  - id: S03-11
    what: задержка обнаружения 5 мин после операции
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: D-4
      path: /detection_delay_min
      op: eq
      value: 5
    mapping: draft
    source:
      subject: metric/D-4
      field: detection_delay_min
      filter:
        nc: NC-01
      op: eq
      value: 5
    note: показатель D-4 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S03-12
    what: О-2 +1
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: items_with_confirmed_nc
        period: week
      path: /total/value
      op: delta
      value: 1
    mapping: exact
    baseline: '2026-09-23T11:00:00+03:00'
    note: 'сведение: показатель items_with_confirmed_nc (О-2) за неделю'
    source:
      subject: metric/O-2
      field: items
      op: delta
      value: 1
      baseline: '2026-09-23T11:04:00+03:00'
  - id: S03-13
    what: 'лесенка О-3: наблюдения +2, уникальные +1, подтверждённые +1'
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: O-3
      path: /ladder
      op: delta
      value: &id004
        observations: 2
        unique_defects: 1
        confirmed_defects: 1
        items: 1
    mapping: draft
    baseline: '2026-09-23T11:04:00+03:00'
    source:
      subject: metric/O-3
      field: ladder
      op: delta
      value: *id004
      baseline: '2026-09-23T11:04:00+03:00'
    note: показатель O-3 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S03-14
    what: нет фото — честная надпись или иллюстрация с пометкой
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /evidence_display
      op: in
      value: &id005
      - illustration_labeled
      - material_not_provided
    mapping: draft
    source:
      subject: nc/NC-01
      field: evidence_display
      op: in
      value: *id005
- at: '2026-09-23T11:25:00+03:00'
  label: чего не должно случиться
  must_not: true
  assertions:
  - id: S03-N1
    what: нет «ошибки исполнителя»
    check:
      operation: analysis.hypothesis.list
      params:
        nc_id: '{ref:NC-01}'
      path: /hypotheses[category=performer,status=confirmed]/#
      op: eq
      value: 0
    mapping: exact
    note: 'сведение: подтверждённой гипотезы об исполнителе нет'
    source:
      subject: nc/NC-01
      field: cause
      op: ne
      value:
        category: operator_procedure
        status: confirmed
  - id: S03-N2
    what: О-10 не меняется
    check:
      operation: analytics.metric.drilldown
      params:
        metric_id: O-10
      path: /all
      op: unchanged
    mapping: draft
    baseline: '2026-09-23T11:04:00+03:00'
    source:
      subject: metric/O-10
      field: all
      op: unchanged
      baseline: '2026-09-23T11:04:00+03:00'
    note: показатель O-10 каталога процессной сессии (analytics-catalog.md); сопоставление — эпик 25
  - id: S03-N3
    what: в 1С ничего не ушло
    check:
      operation: erp.message.list
      params:
        item_id: '{item:F-017}'
      path: /items/#
      op: delta
      value: 0
    baseline: '2026-09-23T11:00:00+03:00'
    mapping: exact
    note: 'сведение: «ничего не ушло» — между 11:00 и 11:25 (число сообщений по Ф-017 не изменилось); прежние учётные сообщения маршрута в счёт не идут'
    source:
      subject: erp/postings
      field: count
      filter:
        item: F-017
        between:
        - '2026-09-23T11:00:00+03:00'
        - '2026-09-23T11:25:00+03:00'
      op: eq
      value: 0
  - id: S03-N4
    what: нет автоматического решения по изделию
    check:
      operation: nonconformity.card.read
      params:
        nc_id: '{ref:NC-01}'
      path: /axes/disposition
      op: eq
      value: none
    mapping: exact
    note: 'сведение: решения по изделию нет'
    source:
      subject: nc/NC-01
      field: dispositions_by_system
      op: eq
      value: 0
