# Ожидания прогона сбоя F07 — отдельно от входных событий (кейс §5.1, AD-26).
scenario: F07
version: '1'
title: 'Сбой: Разрыв в номерах источника'
run: F07
source: эпик 32 по research/data-collection-sources-and-failures.md §6 (ожидаемое поведение системы)
checkpoints:
