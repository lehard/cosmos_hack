# =============================================================================
# Срез файла process/scenarios-flange-expected.yaml — БЕЗ изменений (наши имена, как есть).
# Источник истины — исходный файл; этот файл пересобирается tools/split_expected.py.
# Общие словари и ID — expected/_common.yaml; главная история — expected/main-story.yaml.
# Времена здесь — МСК (+03:00), как в исходнике; в потоках и определениях — UTC.
# =============================================================================

# =============================================================================
# ЧЕРНОВИК ожиданий для табло проверки «ожидалось → получилось»
# Сценарии на фланце люка гермокорпуса. Человеческое описание — scenarios-flange.md.
#
# ВАЖНО:
#  1. Имена событий, полей, статусов, кодов ошибок и видов сообщений 1С взяты
#     из НАШЕГО каталога (process-events-catalog.md) и docs/plan.md §4–6.
#     ОКОНЧАТЕЛЬНЫЕ имена задаёт контракт соседей (их FR-27, FR-28, FR-90, FR-91).
#     Здесь — смысл проверок, а не контракт.
#  2. Ожидания хранятся ОТДЕЛЬНО от входных событий (кейс §5.1). События
#     генерирует имитатор соседей по таблицам scenarios-flange.md.
#  3. Все числа, ID, даты, режимы — условные ([П] допущение, [ПП] проектное
#     предположение). Это не данные «Энергии».
# =============================================================================

meta:
  id: flange-scenarios-expected
  version: "0.3.2-draft"          # 0.3.2 + S04 «следующее лучшее наблюдение» 26.09: +10 утверждений S04-11…S04-17, S04-N5…N7 (профили съёмки карты RCP-CP-WELD@3, предложение ≠ решение, лимит пересъёмок, «класс камере не виден → рентген»); 0.3.2 + сверка аналитики 26.09 (deliverables/metrics-audit.md): +28 утверждений О-1…О-11 (А-1…А-20), корзина О-9 «приостановлено по качеству», S05-16 перенесено в точку 12:30; 0.3.2 — нестандартные случаи S18–S22 (решение пользователя 26.09; схема v0.3.2): допуск и поверка на дату операции, смена ревизии КД посреди партии, нечитаемая маркировка и перепутанные детали, смешение партий, попытка вернуть списанное; 0.3.1 — решения пользователя 26.09: MES-удержание сразу и снятие человеком, плоскость после сварки, выборочный рентген колец на входе, фон по классам автора; 0.2 — волна 1 правок по ред-тиму (1С в S10, линии, результат контроля [П]); 0.2.1 — доводка под схему процесса v0.2; 0.3 — волна 2: S14–S17, три атаки в S09, установка оборудования и перемаркировка в S01; сверено со схемой v0.3 (ЗТ-СР, КТ-СР, сигнал, разбор причин, сбой оборудования)
  created: "2026-09-25"
  status: "черновик, пользователь не утвердил"
  human_doc: "process/scenarios-flange.md"
  process_doc: "process/flange-process-bpmn.md (схема v0.3.2), process/bpmn-v032-changes.md, process/bpmn-v031-changes.md, process/bpmn-v03-changes.md"
  timezone: "+03:00"
  event_contract_version: "1.0"        # версия контракта сообщений
  analyzer_version: "vqc-weld 2.3.1"    # версия анализатора камер — отдельное поле, не смешивать
  terms:
    concession: "разрешение на отклонение (ГОСТ Р ИСО 9000 п. 3.12.5) — для «ремонт» и «как есть» по изготовленному изделию"
    rework: "переделка по ТП — возврат к требованиям КД; переделка участка шва — не больше 3 раз, вторая и третья — с согласия главного сварщика [ПП]"
    repair: "ремонт — только по разрешению на отклонение (все подписи, включая ПЗ); после ремонта изделие годно по разрешению, а не «годно»"

# -----------------------------------------------------------------------------
# Формат одного утверждения (предложение; соседи вправе заменить)
#   id:       уникальный код проверки
#   what:     что проверяем, по-русски (выводится на табло)
#   subject:  объект: item/<id>, nc/<id>, risk_scope/<id>, run/<id>, event/<id>,
#             hypothesis/<nc>, erp/postings, ingest, quarantine, integrity,
#             audit/critical_actions, metric/<код>, source/<id>, gate/<ЗТ>/<item>,
#             gate/<ЗТ> (вся точка), map/node/<узел BPMN>, map/lines (состояние линий),
#             escalation/<ЗТ>@<дата>, post/<ЗТ>, people/<id>, document/<вид>@<основание>,
#             erp/control_results (ПРЕДЛОЖЕНИЕ [П] «результат контроля», ждёт решения соседей),
#             S18–S22: order/<заказ>, lot/<партия>, genealogy/<партия>, checkpoint/<КТ>, post/<рабочее место>, mes/postings
#   field:    поле или вычисляемое свойство
#   op:       eq | ne | gte | lte | in | set_eq | contains | not_contains |
#             exists | not_exists | delta | unchanged | before
#   value:    ожидаемое значение
#   filter:   (необязательно) условия выборки
#   baseline: (для delta/unchanged) момент или контрольная точка «до»
# Раздел must_not — то, чего НЕ должно случиться; формат тот же.
#   proposal: (необязательно) утверждение по нашему ПРЕДЛОЖЕНИЮ, которое ждёт решения соседей;
#             на табло показывать «ждёт решения соседей», а не «не выполнено».
# -----------------------------------------------------------------------------

dictionaries:
  item_status:        # статус изделия (из docs/plan.md §6)
    in_progress: "в работе"
    on_hold: "придержано: сигнал на рассмотрении или блок области риска"
    isolated: "изолировано, ждёт решения"
    rework: "в переделке"
    accepted: "годно"
    accepted_with_deviation: "годно по разрешению на отклонение (≠ годно)"
    scrapped: "списано"
    returned_to_supplier: "возвращено поставщику"
  nc_status: [signal, under_review, rejected, recheck_requested, confirmed, isolated, disposition_set, disposition_verified, closed]
  inspection_result: {defect_found: "признаки обнаружены", no_defect_found: "признаков нет", unable_to_assess: "оценка невозможна"}
  risk_group: {confirmed: "подтверждено (красный)", suspected: "под подозрением, не брак (жёлтый)", excluded: "исключено из инцидента (зелёный)", unknown: "нет данных (серый)"}
  cause_category: {incoming: "входной брак", equipment: "оборудование", operator_procedure: "отклонение от процедуры (техники выполнения)", handling: "перемещение и хранение", undetermined: "не установлено"}
  hypothesis_strength: [not_assessable, weak, possible, strong]
  disposition: {rework: "переделка по ТП", repair: "ремонт (нужно разрешение на отклонение)", use_as_is: "как есть (нужно разрешение на отклонение)", scrap: "списать", return_to_supplier: "вернуть поставщику", component_replacement: "замена компонента (схема v0.2, итог NCR) [П]"}
  gate_decision:      # итог на ЗТ (схема v0.2)
    accepted: "годно"
    accepted_incomplete_data: "годно при неполных данных [П]: только ЗТ-3 (узел WZ2); чего не хватает — записано; пришли данные — метка «пересмотрите» (decision.review_flagged); после переделки не ставится"
    accepted_with_deviation: "годно по разрешению на отклонение (≠ годно)"
    nonconforming: "не годно → решение по несоответствию (Н)"
  review_outcome:     # пересмотр подписанной приёмки (схема v0.2, процесс «Пересмотр приёмки» R0…RZ2) [П]
    confirmed: "прежнее решение подтверждено, метка снята"
    revoked: "приёмка отозвана: блок изделия, изделие — в инцидент; исходная подпись остаётся"
  erp_posting_type:   # виды учётных сообщений в 1С [П — окончательные у соседей]
    issue_to_production: "принято в работу"
    transfer: "перемещение между цехами (складами)"
    scrap_transfer_rework: "перевод в брак (переделка)"
    scrap_transfer_writeoff: "перевод в брак (списание)"
    return_to_supplier: "возврат поставщику"
    rework_return_to_production: "возврат из брака в производство [П]: переделка выполнена и проверена на повторной ЗТ (схема v0.2: ЗТ-2, ЗТ-3, ЗТ-4, ЗТ-6 — узлы MRE, WRE, ARE, KRE); документ 1С — с соседями (ERP: выпуск по «Производству без заказа» на исправление брака и разблокировка серии; 1С:MES: закрытие «Этапа производства» на исправление брака)"
    release_good: "выпуск годного — только после подписанной ЗТ-6 (признак after_rework: true — после переделки)"
    # блокировка («заблокирован»), сигнал, новый дефект до решения ЗТ-Р в 1С не уходят — не учётные движения.
    # Изделие в «переводе в брак (переделка)» выходит из брака только «возвратом из брака в производство».
  erp_ack: {acked: "подтверждено", error_retryable: "временная ошибка, повтор", error_final: "ошибка данных, без автоповтора", dead: "не доставлено"}
  erp_control_result:   # ПРЕДЛОЖЕНИЕ [П], ждёт решения соседей: «отправка результата контроля» (кейс §3.3)
    when: "после каждой подписанной ЗТ (ЗТ-1 по партии, ЗТ-2…ЗТ-6 по изделию) и после решения ЗТ-Р; одно сообщение на одно решение"
    result: {accepted: "годно", accepted_with_deviation: "годно по разрешению на отклонение", nonconforming: "не годно: несоответствие, с решением по изделию"}
    fields: [message_id, contract_version, gate, presentation_no, item_or_lot, order, nomenclature, line_id, result, nc_refs, defects_summary, disposition, concession_no, decided_at, signers, basis_refs]
    not_included: [signal, hypothesis, inspection_frame, machine_log, risk_scope]
    note: "не держит изделие и не заменяет учётное движение; ответ 1С — как у учётных сообщений (подтверждение / ошибка / повтор)"
  lines:              # справочник линий [П]: emulator-data/definitions/reference/sites.yaml → lines
    L-FL-1: "Линия ФЛ-100 № 1 — свой сварочный пост 1 (ИС-1); остальные участки общие"
    L-FL-2: "Линия ФЛ-100 № 2 — свой сварочный пост 2 (ИС-2); остальные участки общие"
    # line_id события: пост — линия поста; фланец с запуска — линия поста его последней сварки
    # (до первой — по плану запуска); 1С, партии на складе, общее оборудование без изделия — без линии.
  mes_message:            # сообщения в MES (схема v0.3.1, процесс «Удержание») [П — окончательные у соседей]
    hold: "не выдавать в работу — сразу, как только изделие или партия придержаны (правило при сигнале, круг инцидента, отзыв приёмки, поиск инструмента, изоляция); один раз на объект"
    release: "можно выдавать — только по решению человека (отклонение сигнала, исключение из круга, решение на ЗТ, решение по несоответствию) и только когда оснований не осталось; списанным и возвращённым не уходит"
    not_included: [hypothesis, cause, inspection_frame, operator_assessment]
  author_defect_class:    # пять классов автора кейса (сессия 25.09) — разрез аналитики «дефекты по классам»; справочник defect-classes.yaml → author_class
    weld: "сварочные швы (прожог, поры, подрез …)"
    chip: "сколы"
    dent: "вмятины"
    scratch: "царапины"
    geometry: "геометрия после обработки на станке (размер вне допуска)"
  quarantine_code: {E_MISSING_FIELD: "нет обязательного поля", E_UNSUPPORTED_VERSION: "неизвестная версия", E_UNKNOWN_ENUM: "неизвестное значение перечисления"}
  critical_action_code:   # не карантин: запись в журнал критических действий (S06)
    E_ID_CONFLICT: "тот же номер, другое содержимое: первая версия записи остаётся, вторая — в журнал критических действий, администратору уведомление"
  refusal_code:           # отказы API на шагах людей (S08, S09, S10B, S14) [П — окончательные у соседей]
    E_REWORK_LIMIT: "лимит переделок исчерпан"
    E_PERMIT_REQUIRED: "нужно разрешение на отклонение"
    E_EXPLANATION_REQUIRED: "«ошибку исполнителя» нельзя записать без письменного объяснения работника (S14)"
    E_INSTRUMENT_NOT_VERIFIED: "в основании ЗТ — запись средства без поверки на дату (S18)"
    E_ITEM_SCRAPPED: "изделие списано: статус конечный, в маршрут не вернуть (S22)"
