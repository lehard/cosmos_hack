  precondition_code:      # условие шага не выполнено: Е-13 и запись в журнал критических действий
    E_QUALIFICATION_EXPIRED: "допуск исполнителя истёк на дату операции — система предлагает исполнителя с допуском (S18)"
    E_INSTRUMENT_NOT_VERIFIED: "средство измерения не поверено на дату записи — результат «недостоверно» (Е-128), в основание ЗТ не идёт (S18)"
    E_ITEM_MISMATCH: "на посту не то изделие: ожидалось по заданию одно, прочитано другое — стоп и выяснение (S20)"
    E_ITEM_NOT_IDENTIFIED: "код не читается — ручной ввод с подтверждением второго человека или перемаркировка по процедуре (S20)"
    E_LOT_BLOCKED: "компонент из заблокированной партии — выдача не проходит (S21)"
    E_ITEM_SCRAPPED: "изделие списано — работу начать нельзя (S22)"
  wip_decision:           # решение по заделу при смене ревизии КД (S19, узел OC3)
    rework_to_new_revision: "доработать до новой ревизии по ТП новой ревизии"
    keep_old_with_concession: "оставить по старой ревизии — только по разрешению на отклонение (подпись ПЗ)"
    scrap: "списать — в 1С «перевод в брак (списание)»"
  scan_result: {ok: "код прочитан, совпал", unreadable: "код не читается", mismatch: "прочитан не тот номер, что ожидался"}   # Е-126 item.scanned
  # ---- волна 2 ----
  binding_level:          # уровень привязки события к выполнению операции (кейс §4.6) [П] — S16
    exact: "номер выполнения есть в самом событии"
    by_interval: "по интервалу выполнения на этом оборудовании — один кандидат"
    ambiguous: "несколько кандидатов; выводы, которые от привязки зависят, — «не установлено»"
    none: "кандидатов нет"
  time_correction:        # сдвиг часов источника (кейс §4.6) [П] — S15
    rule: "occurred_at позже received_at больше чем на 30 с → часы источника спешат; сдвиг = медиана (occurred_at − received_at) по записям источника + обычная задержка доставки; исправленное время = occurred_at − сдвиг"
    keeps: "исходное occurred_at не меняется; исправленное время — производная запись с правилом и сдвигом (event.time_corrected [П])"
    boundary: "часы, которые отстают, выглядят как задержка доставки; их ловит сверка времени edge-агентом [ПП]"
  integrity_attack:       # три атаки подмены (S09) [П]
