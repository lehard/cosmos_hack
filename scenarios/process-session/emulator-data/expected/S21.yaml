# =============================================================================
# Срез файла process/scenarios-flange-expected.yaml — БЕЗ изменений (наши имена, как есть).
# Источник истины — исходный файл; этот файл пересобирается tools/split_expected.py.
# Общие словари и ID — expected/_common.yaml; главная история — expected/main-story.yaml.
# Времена здесь — МСК (+03:00), как в исходнике; в потоках и определениях — UTC.
# =============================================================================

scenarios:
  S21:
    title: "Смешение партий: кольца П-116 и П-117 (после претензии)"
    case: {other: ["§4.6 сборка ↔ компоненты (генеалогия)", "§4.2 входной дефект: круг по партии", "§3.2 журнал критических действий", "критерий О1: прослеживаемость партий"]}
    run: S21   # отдельный прогон, мир S21: Чт 17.09 – Чт 24.09; кольца К-107, К-108 (П-117) — в таре П-116
    checkpoints:
      - at: "2026-09-22T16:02:00+03:00"
        label: "К-107 выдано под Ф-034"
        expect:
          - {id: S21-01, what: "кольцо под Ф-034 взяли из тары П-116, но скан кольца показал К-107 партии П-117; партия тогда годна — выдано; генеалогия: Ф-034 ← К-107 (П-117) — по коду кольца, а не по бирке тары", subject: item/F-034, field: {ring: R-107, ring_lot: LOT-R-117, lot_by: component_scan}, op: eq, value: true}
      - at: "2026-09-23T16:10:00+03:00"
        label: "претензия и круг по партии"
        expect:
          - {id: S21-02, what: "после претензии (Ср 15:45, Т-01 и НОТК-01) партия П-117 заблокирована: в MES «не выдавать» по партии; в 1С — «возврат поставщику» 9 колец (К-107 уже в изделии)", subject: lot/LOT-R-117, field: {status: blocked, erp_return_qty: 9, mes_hold: true}, op: eq, value: true}
          - {id: S21-03, what: "по генеалогии Ф-034 попал в круг по партии RS-21 и придержан (в MES «не выдавать» в 15:46; узлы VRG → VI → I0 схемы v0.3.2)", subject: risk_scope/RS-21, field: {basis: LOT-R-117, items: [F-034], item_hold_at: "2026-09-23T15:46:00+03:00"}, op: eq, value: true}
          - {id: S21-04, what: "Т-01 исключил Ф-034 в 16:00: рентген шва и тела кольца в зоне снимка RK-0923-21 — чисто; в MES «можно выдавать»; круг закрыт", subject: risk_scope/RS-21, field: {excluded: [F-034], basis: ["xr/F-034/RK-0923-21"], closed: true}, op: eq, value: true}
      - at: "2026-09-24T08:30:00+03:00"
        label: "К-108 при выдаче отклонено"
        expect:
          - {id: S21-05, what: "Чт 08:10 скан кольца при выдаче под Ф-036: К-108, партия П-117 — «партия заблокирована», выдача не прошла (Е-13); запись в журнале критических действий; задача ОТК-2", subject: event/S21/scan-R-108-blocked, field: {precondition_failed: E_LOT_BLOCKED, issued: false, task_to: QC-02}, op: eq, value: true}
          - {id: S21-06, what: "ОТК-2 проверил тару П-116 сканом: К-031, К-033 — П-116; К-108 — в изолятор к остатку партии до отгрузки; под Ф-036 выдано К-033", subject: lot/LOT-R-116, field: {tare_scanned: [R-031, R-033], foreign_found: [R-108], issued_to_F-036: R-033}, op: eq, value: true}
          - {id: S21-07, what: "по запросу генеалогии система показывает, куда уже ушли кольца П-117 из этой тары: К-107 → Ф-034 (проверен и исключён в RS-21)", subject: genealogy/LOT-R-117, field: in_items, op: eq, value: {F-034: R-107}}
    must_not:
      - {id: S21-N1, what: "К-108 не выдано и не привязано к Ф-036", subject: item/F-036, field: {ring: R-033, R-108_linked: false}, op: eq, value: true}
      - {id: S21-N2, what: "Ф-034 не исключён из круга без основания и не пропущен дальше без решения", subject: risk_scope/RS-21, field: {excluded_without_basis: 0, unassessed_at_close: 0}, op: eq, value: true}
      - {id: S21-N3, what: "в 1С по отклонённой выдаче ничего; одно «возврат поставщику»", subject: erp/postings, filter: {run: S21}, field: {return_to_supplier: 1, issue_to_production_R-108: 0}, op: eq, value: true}
