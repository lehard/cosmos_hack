# =============================================================================
# Срез файла process/scenarios-flange-expected.yaml — БЕЗ изменений (наши имена, как есть).
# Источник истины — исходный файл; этот файл пересобирается tools/split_expected.py.
# Общие словари и ID — expected/_common.yaml; главная история — expected/main-story.yaml.
# Времена здесь — МСК (+03:00), как в исходнике; в потоках и определениях — UTC.
# =============================================================================

scenarios:
  S04:
    title: "Недостаток сведений — блик на Ф-025 и потерянные данные Ф-019"
    case: {s4_2: ["недостаток сведений для вывода"], s5_1: ["Неопределённость"], other: ["§4.5 плохое наблюдение ≠ годность", "§4.6 явное «неизвестно»"]}
    run: main_story
    checkpoints:
      - at: "2026-09-23T12:41:00+03:00"
        label: "Ф-025: кадр с бликом"
        expect:
          - {id: S04-01, what: "исходный результат сохранён как есть", subject: event/CAM-WS-1@2026-09-23T12:40, field: {inspection_result: no_defect_found, confidence: 0.91, observation_quality: 0.34}, op: eq, value: true}
          - {id: S04-02, what: "производный результат — оценка невозможна (качество ниже порога 0,6)", subject: item/F-025, field: derived_result_cp_weld, op: eq, value: {result: unable_to_assess, zones: [U6, U7], reason: "качество 0,34 < 0,6: блик, зона закрыта прижимом"}}
          - {id: S04-03, what: "Ф-025 не годен и не брак — ждёт", subject: item/F-025, field: status, op: eq, value: on_hold}
          # «Следующее лучшее наблюдение» (камера) [П]: профиль — только из допущенных в карте RCP-CP-WELD@3
          # (emulator-data/definitions/reference/inspection-recipes.yaml → capture_profiles); предложение ≠ решение
          - {id: S04-11, what: "система предложила следующее наблюдение — это предложение, не решение", subject: item/F-025, field: proposals, op: contains, value: [{proposal_ref: PR-F025-01, event: analysis.check_suggested, type: additional_check, kind: next_observation, voice: "инженерная справка", zones: [U6, U7], uncertainty_reasons: [glare, zone_occluded_by_clamp], capture_profile: KT3-SIDE, profile_reason: "отделить блик от геометрии", person_actions: ["снять прижим"], decides: QC, status: open}]}
      - at: "2026-09-23T12:51:00+03:00"
        label: "Ф-021: корень шва камере не виден"
        expect:
          - {id: S04-16, what: "прожог в корне Ф-021 нашёл рентген; чистый кадр камеры 12:35 для корня — «этим методом не проверяется», а не «признаков нет»", subject: item/F-021, field: {root_burn_through: {found_by: event/XR-1@2026-09-23T12:50, conclusion_no: RK-0923-08, zone: U5, side: root}, camera_frame: {event: event/CAM-WS-1@2026-09-23T12:35, for_root: not_applicable_to_method}}, op: eq, value: true}
          - {id: S04-17, what: "класс камере не виден — следующее наблюдение рентген, пересъёмка не предлагается", subject: item/F-021, field: next_observation_rule, op: eq, value: {defect_class: "burn_through (корень шва)", camera_blind: true, basis: "RCP-CP-WELD@3 → blind_classes", proposed_method: xray, camera_reshoot_proposed: false}}
      - at: "2026-09-23T13:00:00+03:00"
        label: "Ф-025: повторный кадр"
        expect:
          - {id: S04-04, what: "назначена повторная съёмка", subject: item/F-025, field: decisions, op: contains, value: [{type: recheck_requested, author: QC-01, method: camera_reshoot}]}
          - {id: S04-05, what: "повторный кадр хорошего качества, признаков нет → проверка камерой пройдена", subject: item/F-025, field: cp_weld_final, op: eq, value: {result: no_defect_found, observation_quality: 0.88}}
          - {id: S04-06, what: "отметка «с первого раза, но с доп. проверкой»", subject: metric/D-3, filter: {item: F-025, checkpoint: CP-WELD}, field: bucket, op: eq, value: first_pass_with_recheck}
          - {id: S04-07, what: "корзина «оценка невозможна» +1", subject: metric/O-1, field: unable_to_assess, op: delta, value: 1, baseline: "2026-09-23T12:39:00+03:00"}
          - {id: S04-12, what: "у события «назначена повторная съёмка» — причина неопределённости, профиль, почему он, чьё предложение, кто назначил, лимит", subject: item/F-025, field: decisions, op: contains, value: [{type: recheck_requested, author: QC-01, method: camera_reshoot, uncertainty_reasons: [glare, zone_occluded_by_clamp], capture_profile: KT3-SIDE, profile_reason: "отделить блик от геометрии", proposal_ref: PR-F025-01, proposal_status: accepted, assigned_by: {kind: person, persona: QC-01}, reshoot_no: 1, reshoot_limit: 2}]}
          - {id: S04-13, what: "профиль пересъёмки — только из допущенных профилей карты RCP-CP-WELD@3: штатный, боковой свет, второй ракурс, увеличенная зона", subject: item/F-025, filter: {decision: recheck_requested, method: camera_reshoot}, field: capture_profile, op: in, value: [KT3-STD, KT3-SIDE, KT3-VIEW2, KT3-ZOOM]}
          - {id: S04-14, what: "второй кадр ссылается на первый", subject: event/CAM-WS-1@2026-09-23T12:55, field: {trigger: reshoot, capture_profile: KT3-SIDE, reshoot_no: 1, zones_inspected: [U6, U7], prior_observation: event/CAM-WS-1@2026-09-23T12:40}, op: eq, value: true}
          - {id: S04-15, what: "вывод «признаков нет» по КТ-3 сделан на основании двух наблюдений", subject: item/F-025, field: cp_weld_final/basis, op: eq, value: {observations: 2, by_zone: [{zones: [U1, U2, U3, U4, U5, U8], observation: event/CAM-WS-1@2026-09-23T12:40, capture_profile: KT3-STD}, {zones: [U6, U7], observation: event/CAM-WS-1@2026-09-23T12:55, capture_profile: KT3-SIDE}], text: "признаков нет — вывод по двум наблюдениям: кадр 12:40 (штатный) и пересъёмка 12:55 (боковой свет)"}}
      - at: "2026-09-23T12:16:00+03:00"
        label: "Ф-019: серая"
        expect:
          - {id: S04-08, what: "в круге RS-01 версии 3 Ф-019 — «нет данных»", subject: risk_scope/RS-01, filter: {version: 3}, field: group_of/F-019, op: eq, value: unknown}
          - {id: S04-09, what: "явно сказано, чего не хватает", subject: run/SV-019-1, field: missing_info, op: contains, value: ["параметры WS-2 2026-09-22 16:40–17:15"]}
          - {id: S04-10, what: "потеря у источника учтена", subject: metric/N-5, field: lost_at_source, op: eq, value: {records: 35, window: ["2026-09-22T16:40:00+03:00", "2026-09-22T17:15:00+03:00"], source: GW-2}}
    must_not:
      - {id: S04-N1, what: "кадр с качеством 0,34 не даёт «годно»", subject: item/F-025, field: accepted_by_frame_quality_below_threshold, op: eq, value: false}
      - {id: S04-N2, what: "серая не становится зелёной сама", subject: risk_scope/RS-01, filter: {item: F-019}, field: excluded_without_basis, op: eq, value: false}
      - {id: S04-N3, what: "ток для Ф-019 не «дорисован»", subject: run/SV-019-1, field: interpolated_parameters, op: eq, value: false}
      - {id: S04-N4, what: "«оценка невозможна» не в годных и не в браке", subject: metric/O-1, field: unable_counted_as_good_or_defect, op: eq, value: false}
      - {id: S04-N5, what: "предложение системы само пересъёмку не назначает: кадр 12:55 — только по решению ОТК-1", subject: item/F-025, field: proposal_executed_without_decision, op: eq, value: false}
      - {id: S04-N6, what: "пересъёмка не выходит за карту и лимит: профиля вне RCP-CP-WELD@3 и третьей пересъёмки участка нет", subject: checkpoint/CP-WELD, field: reshoot_outside_recipe_or_over_limit, op: eq, value: false}
      - {id: S04-N7, what: "для корня шва и внутренних пор пересъёмка не предлагается (Ф-021, Ф-023)", subject: item/F-021, filter: {items: [F-021, F-023]}, field: proposals, op: not_contains, value: [{kind: next_observation, method: camera_reshoot}]}
