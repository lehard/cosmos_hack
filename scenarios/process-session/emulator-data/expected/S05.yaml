          - {id: S05-38, what: "состояние линий: у линии 2 сварочный пост стоит (остановка ИС-2 по качеству), линия 1 работает; общие участки — у обеих", subject: map/lines, field: {L-FL-1: {welding_post: ST-WC-P1, state: running}, L-FL-2: {welding_post: ST-WC-P2, state: stopped, reason: quality_hold, since: "2026-09-23T11:12:00+03:00"}}, op: eq, value: true}
