id: S14
title: 'Общий фактор — один сварщик: система не ставит «ошибку исполнителя» сама'
goal: 'Три подреза у одного сварщика на обоих постах при исправных источниках. Путь схемы v0.3: сигнал → инцидент по общему фактору «сварщик» (круг 6 → 3) → групповое решение «переделка»
  через Н → разбор причин: версия «отклонение от техники выполнения» сильная, но «ошибку исполнителя» записывает только комиссия после письменного объяснения работника → мера «проверка
  навыка и инструктаж» → окно наблюдения (8 швов) → закрыт.'
case:
  other:
  - §2.3 обоснованность выводов
  - §5.2 подтверждённые ошибки отдельно от гипотез
  - §5.2 сравнение сопоставимых работ
  - вопрос жюри «а если виноват человек?» (матрица приёмки, В1)
