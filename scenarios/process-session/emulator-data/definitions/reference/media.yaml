# =============================================================================
# Справочник: материалы к записям (evidence_refs[].media_id).
# Правило (кейс §5.4): никаких фиктивных снимков изделия. Снимков изделий в наборе НЕТ.
# У каждой записи, где материалы бывают, ссылка есть всегда — пустых полей нет:
#   кадр камеры (КТ-1…КТ-5)  → «материал не предоставлен»; если класс дефекта есть в открытом
#                              наборе — ещё и ИЛЛЮСТРАЦИЯ класса (источник, лицензия, пометка);
#   рентген (РК)             → заключение как документ; снимок в центр не передаётся;
#   OperatorVision           → «видео не передаётся», только событие.
# Источник иллюстраций: research/open-defect-datasets.md (TIG Aluminium 5083, п. 3.1; шаблон подписи).
# Файлы иллюстраций и учёт (путь в наборе, изменения, лицензия): repo-pack/docs/images/vision-demo/ATTRIBUTION.md.
# Проверка: tools/check.py, пункт 28.
# =============================================================================

meta:
  kind: reference.media
  version: "0.1-draft"
  valid_from: "2026-09-01"
  allowed_kinds: [not_provided, illustration, document, event_only]   # вида «снимок изделия» (photo, captured) нет
  rule: "никаких фиктивных снимков изделия (кейс §5.4); иллюстрация — только с источником, лицензией и пометкой «не относится к изделию»"

