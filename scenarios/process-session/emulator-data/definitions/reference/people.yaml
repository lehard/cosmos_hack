# =============================================================================
# Справочник: люди (условные псевдонимы) и роли.
# Источник: scenarios-flange.md §2.5; scenarios-flange-expected.yaml (ids.people).
# id — машинный ASCII-ID (как в файле ожиданий); display — как на экране (кириллица).
# Это псевдонимы, не реальные люди. Соответствие человеку — вне прогонов.
# Смены и назначения — calendar.yaml; допуски, аттестации, клейма — qualifications.yaml.
# =============================================================================

