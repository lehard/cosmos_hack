      - {world: S14, dates: ["2026-09-29", "2026-09-30", "2026-10-01"], person: WLD-03, shift: A,
         note: "отдельный прогон S14: С-03 подменяет в смене А; во вторник оба сварщика в одной смене — смена не общий фактор"}

