# =============================================================================
# Справочник: производственный календарь, смены, назначения на смены и посты.
# Источник: scenarios-flange.md §2.5, S13; flange-process-bpmn.md §5.
# Сроки (3 рабочих дня на решение по несоответствию), эскалации и «ожидание
# только в рабочие часы смены» считаются по этому календарю.
# Смены и назначения — условные [П]. Праздников в окне сентябрь–октябрь 2026 нет [П].
# Время смен — МСК (+03:00); в потоках всё в UTC.
# =============================================================================

meta:
  kind: reference.calendar
  version: "0.1-draft"
  valid_from: "2026-09-01"
  timezone: "Europe/Moscow"

shifts:
  - {id: A, display: "Смена А", start: "08:00", end: "16:30"}           # [П]
  - {id: B, display: "Смена Б", start: "16:30", end: "01:00", crosses_midnight: true}   # [П]
  - {id: LUNCH-A, display: "Обед смены А", start: "12:30", end: "13:00", kind: break}  # [П]

production_calendar:
  period: {from: "2026-09-01", to: "2026-10-31"}
  working_weekdays: [Mon, Tue, Wed, Thu, Fri]
  non_working_days:                           # выходные (сб, вс); праздников в окне нет [П]
