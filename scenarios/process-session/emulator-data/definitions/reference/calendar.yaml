  # а решения людей post.assignment_requested / post.assignment_changed [П] в definitions/scenarios/S13.yaml.

waiting_rules:                                # для S13 и живой карты [П]
  count_waiting_only_in_shift_with_controller: true
  carryover_counted_from_shift_start: true     # перенесённые с четверга — отсчёт с 08:00 пятницы
  night_not_counted: true
