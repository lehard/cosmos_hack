# =============================================================================
# Справочник и разметка: карта дефицита данных (показатель Н-6 [П]).
# Какие отсутствующие или ненадёжные данные мешали разбору, сужению круга и приёмке —
# и какая ступень цифровизации закрыла бы пробел. Для руководителя: куда вкладываться.
#
# Здесь — только разметка случаев: какой пробел, какому выводу помешал, на какие записи
# опирается цена и как её считать. САМИ ЧИСЛА цены считает скрипт tools/gaps.py по потокам
# и шагам людей (изделие-часы, лишние проверки, насколько позже вывод). Рейтинг сверяется
# с ожиданиями S07-13, S14-31, S13-17 (tools/check.py, пункт 29).
#
# Где искали: главная история (S02, S03, S04, S05, S07, S15, S16, S17), S13, S14.
# Все ступени и «что закрывает» — наши допущения [П]; оборудование — [ПП].
# =============================================================================

meta:
  kind: reference.data_gaps
  version: "0.1-draft"
  valid_from: "2026-09-01"
  metric: "Н-6 [П] карта дефицита данных: пробел → сколько раз мешал → цена → что закрывает"
  cost_fields:
    item_hours: "изделие-часы: сколько изделий и сколько часов дольше были под подозрением, серыми или ждали решения"
    extra_checks: "лишние проверки и решения, которых не было бы при полных данных"
    conclusion_delay_h: "на сколько часов позже стал возможен вывод (причина, оценка)"
  ranking: "по числу случаев, где пробел помешал выводу; при равенстве — по изделие-часам, потом по лишним проверкам"
  scenarios_checked: [main_story, S02, S03, S04, S05, S07, S13, S14, S15, S16, S17]
  no_gaps:
    S13: "пробелов данных нет: предъявления и заключения пришли, решения не было — «нет решения» ≠ «нет данных» (S13-N4); это задержка, а не дефицит данных"

ladder:                                  # ступени цифровизации [П]: одна история изделия, меняется способ получить факт
  - {step: 1, name: "Терминал вместо бумаги", what: "отметки шагов, чек-листы и учёт инструмента на терминале поста, с подписью"}
  - {step: 2, name: "Метки, сканеры, время", what: "DataMatrix, сканер номера выполнения и места на посту, синхронизация часов источников"}
  - {step: 3, name: "Оборудование онлайн", what: "журналы аппаратов и станков через edge-агента в реальном времени; буфер шлюза без потерь; кадры на краю с выдачей по запросу"}
  - {step: 4, name: "Измерение каждой штуки и техники", what: "100 % контроль критичной характеристики, датчики техники выполнения, управляемый свет на КТ"}

gaps:
  - id: GAP-WELD-LOG
    display: "Журнал режима сварочного аппарата не доходит онлайн: обрыв связи шлюза ШЛ-2 (журнал пришёл через 26 ч), 35 записей потеряны у источника"
    closes: {ladder_step: 3, what: "журнал аппарата онлайн: шлюз с буфером без потерь и контролем полноты, резервный канал"}
  - id: GAP-TORCH
    display: "Положение горелки (техника сварки) не измеряется"
    closes: {ladder_step: 4, what: "датчик положения горелки или видеоконтроль техники на посту сварки [ПП]"}
  - id: GAP-RING-SAMPLE
    display: "Внутренние поры каждого кольца на входе не проверены: рентген выборки 1 из 10"
    closes: {ladder_step: 4, what: "рентген каждого кольца на входе для поставщика с историей (мера S02)"}
  - id: GAP-FRAME-QUALITY
    display: "Кадр КТ-3 плохого качества: блик, прижим закрывает зону"
    closes: {ladder_step: 4, what: "управляемый свет и контроль прижима на посту КТ-3 [ПП]"}
  - id: GAP-TOOL
    display: "Инструмента для обязательной проверки нет на посту (щуп 0,05 мм) — проверка пропущена"
    closes: {ladder_step: 1, what: "учёт инструмента на посту до начала шага (узел A7) и чек-лист с блокировкой шага"}
  - id: GAP-CLOCK
    display: "Время источника неточное: часы КИМ-1 спешат на 7 мин"
    closes: {ladder_step: 2, what: "синхронизация часов источников и сверка времени edge-агентом"}
  - id: GAP-RUN-ID
    display: "В записи пульта ЧПУ нет номера выполнения операции"
    closes: {ladder_step: 2, what: "номер выполнения в записи станка: сканер номера на посту или задание на пульте"}
  - id: GAP-PHOTO
    display: "Снимок изделия в центр не передаётся — «материал не предоставлен»"
    closes: {ladder_step: 3, what: "кадры хранятся на краю, по подтверждённому сигналу — в центр (ссылка и хеш)"}

# Случаи. cost — рецепт расчёта по данным (считает tools/gaps.py):
#   gate_wait    — ожидание на ЗТ по нормам (process/step-norms.yaml): шаг, изделие, номер предъявления;
#   held_until   — удержание «не выдавать» (MES) до снятия этим шагом человека, по каждому изделию;
#   between      — от записи до записи (метка строки потока или шага), × число изделий; to_received — по времени приёма;
#   extra        — метки лишних проверок и решений (каждая должна быть в данных).
cases:
  - id: DG-01
    gap: GAP-WELD-LOG
    scenario: S07
    run: main_story
    hindered: acceptance
    what: "ЗТ-3 по Ф-015 во вторник ждала журнал ИС-2 и приняла «годно при неполных данных»; в среду приёмку пришлось пересмотреть и отозвать"
    refs: [ZT-3/F-015, S07/review-ZT3-F015]
    expect_refs: [S07-06, S07-09, S07-12]
    cost:
      item_hours: {gate_wait: {step: W5, object: F-015, presentation_no: 1}}
      extra: [S07/review-ZT3-F015]
  - id: DG-02
    gap: GAP-WELD-LOG
    scenario: S05
    run: main_story
    hindered: risk_scope_narrowing
    what: "7 сварок ИС-2 до Вт 10:20 были под подозрением, пока не пришёл журнал: круг сузился 13 → 6 только в 12:15"
    refs: [S05/v3, EV-WS2-0412]
    expect_refs: [S05-11, S05-14, S05-15]
    cost:
      item_hours: {held_until: {step: S05/v3, basis: "risk_scope:RS-01"}}
  - id: DG-03
    gap: GAP-WELD-LOG
    scenario: S04
    run: main_story
    hindered: risk_scope_narrowing
    what: "у Ф-019 35 записей журнала потеряны: «нет данных» (серый) до решения комиссии; соответствие режиму так и не доказано"
    refs: [S05/v3, S05/assess/F-019]
    expect_refs: [S04-08, S04-09, S04-10, S04-N2]
    cost:
      item_hours: {between: {from: S05/v3, to: S05/assess/F-019, items: 1}}
  - id: DG-04
    gap: GAP-WELD-LOG
    scenario: S03
    run: main_story
    hindered: cause
    what: "по НС-01 версию «оборудование» нельзя было оценить, пока не пришёл журнал ИС-2 (гипотезы v1: «не оценить»)"
    refs: [S03/confirm-NC-01, EV-WS2-0412]
    expect_refs: [S03-07, S03-08, S05-21]
    cost:
      conclusion_delay_h: {between: {from: S03/confirm-NC-01, to: EV-WS2-0412, to_received: true}}
  - id: DG-05
    gap: GAP-TORCH
    scenario: S14
    run: S14
    hindered: risk_scope_narrowing
    what: "чистые швы С-03 (Ф-302, Ф-308, Ф-312) стояли в круге RS-14, пока их не осмотрели с шаблоном: по данным технику шва не проверить"
    refs: [S14/exclude-F-302, S14/exclude-F-308, S14/exclude-F-312]
    expect_refs: [S14-07, S14-31]
    cost:
      item_hours: {held_until: {step: [S14/exclude-F-302, S14/exclude-F-308, S14/exclude-F-312], basis: "risk_scope:RS-14"}}
      extra: [vt/F-302, vt/F-308, vt/F-312]
  - id: DG-06
    gap: GAP-TORCH
    scenario: S14
    run: S14
    hindered: cause
    what: "версию «техника выполнения» по данным не проверить — понадобились два контрольных образца под наблюдением главного сварщика"
    refs: [S14/cause]
    expect_refs: [S14-17, S14-20]
    cost:
      extra: [CS-141/visual, CS-142/visual]
  - id: DG-07
    gap: GAP-RING-SAMPLE
    scenario: S02
    run: main_story
    hindered: risk_scope_narrowing
    what: "поры колец П-117 на входе не видно по выборке: Ф-027 и Ф-029 стояли в круге RS-02 до рентгена шва, ещё два кольца просветили на складе"
    refs: [S02/exclude-F-027, S02/exclude-F-029, S02/recheck-rings]
    expect_refs: [S02-05, S02-06, S02-15]
    cost:
      item_hours: {held_until: {step: [S02/exclude-F-027, S02/exclude-F-029], basis: "risk_scope:RS-02"}}
      extra: [xr/F-027/RK-0923-12, xr/F-029/RK-0923-13, xr/R-105/RK-0923-11, xr/R-106/RK-0923-14]
  - id: DG-08
    gap: GAP-FRAME-QUALITY
    scenario: S04
    run: main_story
    hindered: acceptance
    what: "кадр Ф-025 с бликом (качество 0,34): «оценка невозможна», повторная съёмка"
    refs: [kt3/F-025/recheck-glare, kt3/F-025/reshoot]
    expect_refs: [S04-02, S04-04, S04-05]
    cost:
      item_hours: {between: {from: kt3/F-025/recheck-glare, to: kt3/F-025/reshoot, items: 1}}
      extra: [kt3/F-025/reshoot]
  - id: DG-09
    gap: GAP-TOOL
    scenario: S17
    run: main_story
    hindered: acceptance
    what: "проверка посадки уплотнения Ф-006 пропущена — щупа нет на месте; ЗТ-СР ждала, пока мастер принесёт щуп"
    refs: [S17/check-skipped, S17/check-done]
    expect_refs: [S17-01, S17-04, S17-05]
    cost:
      item_hours: {between: {from: S17/check-skipped, to: S17/check-done, items: 1}}
  - id: DG-10
    gap: GAP-CLOCK
    scenario: S15
    run: main_story
    hindered: acceptance
    what: "5 записей КИМ-1 «из будущего»: без правила исправления порядок «замер до подписи ЗТ-2» у Ф-007…Ф-011 был бы нарушен"
    refs: [S15/clock-synced]
    expect_refs: [S15-03, S15-05, S15-N1]
    cost: {}
    note: "цены в часах нет: правило исправило время сразу; без него — 5 ложных «пересмотрите»"
  - id: DG-11
    gap: GAP-RUN-ID
    scenario: S16
    run: main_story
    hindered: binding
    what: "запись пульта ЧПУ-1 без номера выполнения: вывод «было ли ручное изменение режима» у Ф-004 и Ф-005 — «не установлено»"
    refs: [S16/cnc-feed-override]
    expect_refs: [S16-01, S16-03]
    cost: {}
    note: "цены в часах нет: независимые выводы не задеты; зависимый вывод остался «не установлено»"
  - id: DG-12
    gap: GAP-PHOTO
    scenario: S03
    run: main_story
    hindered: none
    what: "у НС-01 нет снимка изделия: «материал не предоставлен» и иллюстрация класса; решение принято по двум ракурсам анализатора — выводу не помешало"
    refs: [kt3/SV-017-1/CAM-WS-1]
    expect_refs: [S03-14, S03-16]
    cost: {}
    note: "в наших данных снимок ни одному выводу не помешал; учитываем, чтобы руководитель видел: сюда вкладываться не первым"
