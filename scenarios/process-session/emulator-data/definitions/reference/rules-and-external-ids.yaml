# =============================================================================
# Справочник: правила реакции (карта реакций) и таблица соответствия внешних ID (1С).
# Источник: scenarios-flange.md §2.7, §6.1; process-events-catalog.md §1 (режимы [1]…[5]).
# Номера правил, ревизии, владельцы, ID 1С — условные [П]. Не данные «Энергии».
# Правила исполняет движок соседей; здесь — только смысл и параметры.
# =============================================================================

meta:
  kind: reference.rules_and_external_ids
  version: "0.1-draft"
  valid_from: "2026-09-01"

automation_modes:                             # режимы автоматизации (PRD)
  "1": "система делает сама"
  "2": "сама по утверждённому правилу"
  "3": "предлагает — человек утверждает"
  "4": "несколько одобрений"
  "5": "внешние полномочия"

reaction_rules:
  - id: R-07
    revision: 1
    owner: TECH-01
    mode: 2
    display: "Прожог или подрез на шве → карантин, черновик карточки несоответствия"
    trigger: {event: inspection.result, checkpoint_id: CP-WELD, defect_type_in: [burn_through, undercut]}
    actions: ["containment.hold_applied (карантин)", "nc.draft_created"]
  - id: R-12
    revision: 1
    owner: TECH-01
    mode: 2
    display: "Параметр спецпроцесса (сварки) вне уставки → сигнал и область риска по оборудованию"
    trigger: {event: machine.state, state: warning, equipment_type: welding_source}
    actions: ["quality.signal_raised", "risk_scope.created / risk_scope.expanded (по оборудованию)"]
    note: "область риска считается от последней подтверждённо годной сварки на участке; сужает — только человек (технолог)"
  - id: R-15
    revision: 1
    owner: TECH-01
    mode: 2
    display: "Критичный признак сборки (нет крепежа) → изоляция"
    trigger: {event: inspection.result, checkpoint_id: CP-ASM, defect_type_in: [missing_fastener]}
    actions: ["containment.hold_applied (изоляция)"]
  - id: R-16                                  # волна 2 [П]: S08
    revision: 1
    owner: QC-HEAD-01
    mode: 2
    display: "Некритичный признак сборки (нет метки затяжки) → удержание «доп. проверка» до решения ОТК на ЗТ-4"
    trigger: {event: inspection.result, checkpoint_id: CP-ASM, defect_type_in: [missing_torque_mark]}
    actions: ["containment.hold_applied (доп. проверка)"]
    note: "отклонение сигнала контролёром снимает удержание тем же решением (containment.hold_released, Е-116)"
  - id: R-21
    revision: 1
    owner: TECH-01
    mode: 2
    optional: true                            # «по желанию» (S13)
    display: "Уплотнение, выданное на рабочее место, не установлено за 4 ч → блок к установке, выдать новое; прежнее — на склад для оценки, не списывать"
    trigger: {since_event: batch.issued, item_type_id: FL-100-SEAL, not_followed_by: "установка уплотнения", within_h: 4}
    actions: ["containment.hold_applied (блок к установке)", "задача кладовщику: выдать новое"]
  - id: R-QUALITY-THRESHOLD
    revision: 1
    owner: QC-HEAD-01
    mode: 1
    display: "«Признаков нет» при качестве ниже порога карты контроля → производное «оценка невозможна»"
    trigger: {event: inspection.result, inspection_result: no_defect_found, observation_quality_lt: "порог карты"}
    actions: ["производный результат unable_to_assess (исходный не меняется)"]

