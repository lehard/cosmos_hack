# Сценарий показа «Партия фланцев: сбой ИС-2» (решение пользователя Д-85,
# ~/ant/_bmad-output/implementation-artifacts/demo-show-scenario.md): короткий прогон
# профиля demo, который люди проводят руками.
#
# ПРОШЛОЕ (до live.from) — готовая история: прошлая партия Ф-201, Ф-202 проведена
# целиком (история короткая: интерактивный прогон проигрывает её до первой
# остановки за 1–2 минуты реального времени на живом движке) (приёмка партий, мехобработка, сварка, ЗТ-2…ЗТ-6, выпуск), живая партия
# Ф-001…Ф-003 — через мехобработку и ЗТ-2 до передачи в сварочный цех. Эти решения
# подписывает demo-signer; интерактивный прогон проигрывает историю сразу, без часов.
# ЖИВАЯ ПАРТИЯ (с live.from, Пн 21.09 08:00) — только руками: каждое решение человека —
# остановка прогона до нажатия на столе роли (карточка SHOW-IS2); demo-signer по ней
# не подписывает ничего. Сварка — «Начать» и «Выполнено» сварщика W21 (две остановки
# на каждую сварку), ток поста идёт по минутам между ними; предъявления на ЗТ-3 мастером
# нет — изделие встаёт на точку ЗТ-3 по результатам КТ-3 и рентгена. Машины и внешние
# системы (ток ИС-1/ИС-2, камера КТ-3, лаборатория НК, 1С) идут сами — по часам
# прогона, которые стоят, пока прогон ждёт человека: время машин привязано к действиям
# людей. Авария запланирована: на 2-й сварке партии (Ф-002) ИС-2 уходит в 176–182 А.
#
# Даты — как у всех прогонов: при старте сдвигаются на целое число недель к доменному
# «сейчас» (AD-37, AD-38: доменное время журнала не убывает), день недели и часы те же.
