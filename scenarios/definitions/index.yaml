# Каталог тестовых сценариев (AD-26, FR-105, FR-129): что можно запустить с пульта и
# какое место кейса закрывает каждый сценарий — 8 ситуаций §4.2, 9 проверок §5.1,
# демо-сценарии PRD, сбои каталога.
#
# Раскладка scenarios/:
#   definitions/worlds/‹мир›.yaml    — справочники мира (YAML)
#   definitions/runs/‹прогон›.yaml   — прогон: seed, часы, задания, партии, изделия, ссылки
#   definitions/scenarios/‹id›.yaml  — карточка «один к одному» с таблицей процессной сессии
#   definitions/streams/‹прогон›.*   — потоки прогона по умолчанию (JSONL), строит генератор
#   expected/‹id›.yaml               — ожидания отдельно от входа: утверждения над operationId
