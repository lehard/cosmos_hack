# Карточка сценария показа «Партия фланцев: сбой ИС-2» (Д-85, demo-show-scenario.md).
# Шаги с stop: true — действия людей живой партии: прогон ждёт нажатия на столе роли
# (метка SHOW/… — строка таблицы показа). Остальное — машины и внешние системы
# (weld — ток поста по минутам, fact — камера и лаборатория) и вспомогательные шаги.
# Собрана скриптом из таблицы показа; править можно руками.
id: SHOW-IS2
version: '0.1'
title: 'Показ: партия фланцев, сбой ИС-2'
kind: demo
goal: 'Показ руками: каждое действие человека по живой партии — только нажатием на его столе; машины и 1С идут сами, авария ИС-2 — на второй сварке партии.'
case:
  demo:
  - §1.5 сквозной сценарий
  - станок сломался
run: SHOW-IS2
where: Сварочный участок, посты ИС-1 и ИС-2, Пн 21.09 с 08:00; история — прошлая партия Ф-201, Ф-202 и мехобработка живой партии
source: ~/ant/_bmad-output/implementation-artifacts/demo-show-scenario.md (Д-85)
steps:
