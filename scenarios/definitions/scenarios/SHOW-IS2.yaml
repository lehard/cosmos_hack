# Стол технолога не пуст: область 3 → 2 → 1 с основаниями, гипотезы обеих веток
# с доводами и проверкой, причина по обеим веткам, меры (одна внедрена — идёт
# проверка эффективности), НС закрыто. Подписывает demo-signer до «сейчас».
