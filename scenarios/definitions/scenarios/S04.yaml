outcome:
  - "Ф-025: исходное «признаков нет, 0,91» сохранено; рядом производное «оценка невозможна» с причиной; после повторного кадра — «пройдено, с первого раза, но с доп. проверкой»."
  - "Показатель «оценка невозможна» +1 — отдельная корзина; доля «оценка невозможна» у КТ-3 растёт."
  - "Ф-019 в круге — серая; в карточке написано, чего не хватает; вывод по режиму — «сведений недостаточно»."
  - "Качество потока (Н-5): «потеряно у источника — 35 записей, окно Вт 16:40–17:15»."
must_not:
  - "Нет «годно» по кадру с качеством 0,34; серая не становится зелёной; ток не «дорисован»."
  - "«Оценка невозможна» не считается ни дефектом, ни годностью."
