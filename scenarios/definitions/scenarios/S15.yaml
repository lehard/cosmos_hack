# S15 — process/scenarios-flange.md §4 S15 «один к одному».
id: S15
version: "0.3"
title: "Сдвиг часов источника: часы КИМ-1 спешат на 7 минут"
kind: extra
goal: >-
  «Соврали часы» ≠ «нарушили порядок»: записи источника идут строго по номерам, система
  замечает сдвиг, исправляет время по правилу и помечает запись; исходное время не меняется;
  ЗТ-2, подписанная раньше «неисправленного» времени протокола, не получает ложного «пересмотрите».
case:
  other: ["§4.6 расхождения времени источников", "§5.2 — откуда взято время", "ред-тим, строка 26 (а)"]
