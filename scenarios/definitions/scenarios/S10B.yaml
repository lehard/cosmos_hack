outcome:
- Запуск пятой сварки участка (четвёртой переделки) заблокирован; доступны только «ремонт по разрешению на отклонение» и «списать».
- В 1С по Ф-090 «перевод в брак (переделка)» уходит один раз — при первом решении; итог — «перевод в брак (списание)».
must_not:
- Вторая переделка того же участка не назначается без главного сварщика; четвёртой переделки нет вообще.
