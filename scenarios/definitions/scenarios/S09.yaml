# S09 — process/scenarios-flange.md §4 S09 «один к одному». Подделки делает только
# демо-инструмент cmd/tamper с отдельным подключением суперпользователя БД (AD-26, AD-28):
# шаг tamper исполняет прогон через порт демо-инструмента; в профиле prod его нет.
id: S09
version: "0.3"
title: "Подмена записи — обнаружена (три атаки)"
kind: check
goal: >-
  Запись нельзя тихо переписать: изменение в обход системы находится проверкой целостности —
  правка записи, правка с пересчётом цепочки («администратор БД») и правка представления.
case:
  s4_2: ["контрольное изменение записи"]
  s5_1: ["Изменение данных"]
  other: ["§3.4 исходные события отдельно от изменяемых представлений; проверка целостности; обнаружение вмешательства"]
run: MS-1
where: "Главный поток, Ср 16:30 – 17:01, разбор — Чт 07:45. Кадр защиты 3:45–4:00 — атака 1."
source: "process/scenarios-flange.md §4 S09"
steps:
  - at: "2026-09-23T16:30:00+03:00"
    label: S09/attack-1
    note: "Атака 1: изменение прямо в базе, в обход программы — запись EV-WS2-0412: ток 176 А → 166 А (как будто в уставке)"
    tamper: {kind: update_in_place, target: EV-WS2-0412, change: {data/value/value: 166}}
  - {at: "2026-09-23T16:31:00+03:00", ref: "Е-102", system: "Проверка целостности (плановая или кнопкой): разрыв цепочки на записи EV-WS2-0412; запись в журнале критических действий; уведомления А-01, НОТК-01"}
  - {at: "2026-09-23T16:35:00+03:00", ref: Е-100, system: "Попытка «исправить» ту же запись через программу — отказ: операции правки записи в API нет (AD-2); исправление — только новой записью с corrects (автор и причина)"}
  - {at: "2026-09-23T16:45:00+03:00", system: "Контрольная отметка цепочки (подписанная голова) ушла хранителю вне базы по расписанию (AD-8)"}
  - at: "2026-09-23T16:50:00+03:00"
    label: S09/attack-2
    note: "Атака 2: «администратор БД» правит заключение РК-0923-07 по Ф-019 (пора в теле кольца → «дефектов нет») и пересчитывает цепочку до конца"
    tamper: {kind: update_and_rechain, target: F-019/xray, change: {data/outcome: no_defect_indicated, data/defects: []}}
  - {at: "2026-09-23T16:51:00+03:00", ref: Е-102, system: "Не сходится подпись источника (edge-агент лаборатории НК) и голова цепочки ≠ контрольной отметке 16:45 → нарушение найдено; журнал критических действий; уведомления"}
  - at: "2026-09-23T17:00:00+03:00"
    label: S09/attack-3
    note: "Атака 3: правка представления «статус Ф-023»: «в переделке» → «годно»; журнал событий не тронут"
    tamper: {kind: projection_update, target: "item:F-023", change: {status/summary: accepted}}
  - {at: "2026-09-23T17:01:00+03:00", ref: "Е-102, Е-104", system: "Сверка представлений с журналом: Ф-023 снова «в переделке», представление пересобрано из журнала; никуда не двинулся"}
  - {at: "2026-09-24T07:45:00+03:00", ref: Е-103, system: "Разбор подмен (НОТК-01 + А-01): подлинная версия — та, с которой сходится подпись источника; метки «основание под вопросом» сняты. Операции «разбор нарушения целостности» в контракте нет — предложение эпика 32 (отчёт)"}
outcome:
  - "Красная полоса на всех экранах: «Нарушение целостности: запись EV-WS2-0412 изменена в обход системы» — место: запись, источник, время, номер в журнале."
  - "Выводы, опирающиеся на изменённую запись, помечены «основание под вопросом»; изделия с затронутой записью не проходят ЗТ до разбора."
  - "Атака 2 найдена, хотя звенья сходятся: подписью источника и контрольной отметкой вне базы."
  - "Атака 3 найдена сверкой представления с журналом; представление пересобрано, журнал не тронут."
  - "В журнале критических действий три нарушения целостности; разбор — новой записью."
must_not:
  - "Изменение не принимается молча; круг не пересчитывается сам по подменённому значению (не 7 вместо 6)."
  - "Решения людей и подтверждённые сообщения 1С автоматически не отменяются."
  - "Ф-023 не двигается по подменённому статусу; до разбора ни одна ЗТ по Ф-015, Ф-019 не подписывается."
