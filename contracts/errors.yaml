# Коды ошибок ant v1 (FR-28, «Соглашения/Ошибки API», AD-39).
# Ответ API при ошибке — RFC 9457 `application/problem+json` по схеме contracts/problem.schema.json:
#   type = "urn:ant:problem:‹код›", title, status, detail, instance, code = ‹код› (+ params, violations, …).
# Код — строка с префиксом семейства: ‹семейство›.‹причина› (латиница, snake_case).
# Поля:
#   status   — HTTP-статус (для кодов, которые не уходят в HTTP, — статус «как если бы»);
#   title    — русский заголовок; detail — шаблон пояснения с параметрами {name};
#   ui_key   — ключ текста интерфейса (ui-texts/ru.json процессной сессии; ключи переименуются под коды при передаче текстов);
#   quarantine — сообщение приёма уходит в карантин (FR-29, FR-30);
#   severity — error | warning (warning — принято с пометкой, не отказ);
#   guard    — код отказа доменного гарда модуля-владельца (AD-39);
#   aliases  — рабочие коды процессной сессии (E_*), сведённые к нашему коду;
#   proposal — предложение эпика 00, ждёт утверждения пользователем.
version: 1
problem_type_prefix: "urn:ant:problem:"

codes:
  # ── api: общие ответы операций ──
  api.not_implemented:
    status: 501
    title: "Операция ещё не реализована"
    detail: "Операция {operation_id} объявлена в контракте, реализация — в работе"
    ui_key: errors.generic
    refs: [эпик 02]
  api.validation_failed:
    status: 400
    title: "Запрос не соответствует контракту"
    detail: "Поле {field}: {reason}"
    ui_key: errors.generic
    refs: [FR-28, AD-20]
  api.not_found:
    status: 404
    title: "Объект не найден"
    detail: "{object} «{id}» не найден"
    ui_key: empty.notFound
    refs: []
  api.replay_read_only:
    status: 403
    title: "В режиме воспроизведения действия недоступны"
    detail: "Запрос на момент {as_of} только для чтения"
    ui_key: errors.decision.replayReadOnly
    refs: [FR-4, AD-21, AD-22]
  api.rate_limited:
    status: 429
    title: "Слишком много запросов"
    detail: "Повторите через {retry_after} с"
    ui_key: errors.generic
    refs: [AD-15]

  # ── ingest: приём и пять случаев изменения контракта (FR-29, AD-20) ──
