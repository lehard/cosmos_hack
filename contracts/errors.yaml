    refs: [FR-31, AD-7]
  ingest.batch_too_large:
    status: 413
    title: "Слишком большая пачка"
    detail: "В пачке {count} сообщений, допустимо {limit}"
    ui_key: errors.generic
    refs: [FR-39]

  # ── journal: запись и конкурентность (AD-39, AD-44) ──
