    status: 422
    title: "Неизвестная версия контракта"
    detail: "Тип {event_type}: версия {version} неизвестна — сообщение в карантине до появления повышателя"
    ui_key: errors.ingest.unknownSchemaVersion
    quarantine: true
    aliases: [E_UNSUPPORTED_VERSION]
    refs: [FR-29, кейс §4.7, AD-20]
  ingest.missing_required_field:
    status: 422
    title: "Нет обязательного поля"
    detail: "Нет обязательного поля «{field}» — сообщение в карантине"
    ui_key: errors.ingest.missingRequiredField
    quarantine: true
    aliases: [E_MISSING_FIELD]
    refs: [FR-29, кейс §4.7, AD-20]
  ingest.unknown_enum_value:
    status: 202
    severity: warning
    title: "Неизвестное значение перечисления — принято с пометкой"
    detail: "Поле «{field}»: значение «{value}» сохранено как UNKNOWN({value}) с флагом"
    ui_key: errors.ingest.unknownEnumValueAccepted
    aliases: [E_UNKNOWN_ENUM]
    refs: [FR-29, кейс §4.7, AD-20]
  ingest.unknown_enum_value_critical:
    status: 422
    title: "Неизвестное значение в поле, важном для безопасности"
