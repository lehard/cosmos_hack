    ui_key: errors.generic
    refs: [FR-71, AD-2]
  journal.fenced:
    status: 503
    title: "Запись отвергнута: аренда партиции утрачена"
    detail: "Эпоха аренды партиции {partition} устарела — копия больше не пишет"
    ui_key: errors.generic
    refs: [AD-6, AD-44]
  journal.time_regression:
