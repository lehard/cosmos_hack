    ui_key: errors.ingest.unknownEnumValueQuarantined
    quarantine: true
    refs: [FR-29, AD-20]
  ingest.schema_violation:
    status: 422
    title: "Сообщение не соответствует схеме"
    detail: "{event_type} v{version}: {reason} — несовместимое изменение возможно только новой мажорной версией"
    ui_key: errors.ingest.incompatibleChange
    quarantine: true
    refs: [FR-29, FR-30, AD-20]
  ingest.unknown_event_type:
    status: 422
    title: "Неизвестный тип события"
    detail: "Тип «{event_type}» не объявлен в каталоге — сообщение в карантине"
    ui_key: errors.ingest.incompatibleChange
    quarantine: true
    refs: [FR-28, AD-40]
  ingest.canonical_form_violation:
    status: 422
    title: "Подписанные байты не в каноническом виде"
    detail: "{reason}: повторяющиеся ключи, целые вне ±(2^53−1), строки не в NFC или идентификатор не ASCII"
    ui_key: errors.ingest.signatureInvalid
    quarantine: true
    refs: [AD-10]
  ingest.signature_invalid:
    status: 422
    title: "Подпись сообщения недействительна"
    detail: "Ключ {key_ref}: {reason} — сообщение отклонено, событие безопасности записано"
    ui_key: errors.ingest.signatureInvalid
    quarantine: true
    refs: [FR-26, AD-2, AD-10]
  ingest.unknown_source:
    status: 403
    title: "Источник не зарегистрирован"
    detail: "Источник «{source_id}» не зарегистрирован — сообщение отклонено"
    ui_key: errors.ingest.unknownSource
    quarantine: true
    refs: [FR-26]
  ingest.revoked_key:
    status: 403
    title: "Ключ источника отозван"
    detail: "Ключ {key_ref} отозван — сообщение отклонено и попало на шину безопасности"
    ui_key: errors.ingest.revokedKey
    quarantine: true
    refs: [FR-26, FR-70]
  ingest.duplicate_conflict:
    status: 409
    title: "Тот же номер события, другое содержимое"
    detail: "{source_id}/{event_id}: содержимое отличается — конфликт целостности записан в журнал критических действий"
    ui_key: errors.ingest.duplicateConflict
