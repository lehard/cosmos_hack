components:
  messages:
    item.item.registered.v1:
      name: item.item.registered.v1
      title: Изделие зарегистрировано и запущено в работу
      summary: Изделие зарегистрировано и запущено в работу — у изделия появляется внутренний ID и паспорт; закрепляются версия процесса и нормативного слоя (AD-16, AD-17). ID из метки не выводится.
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.item.registered
              schema_version:
                const: 1
              data:
                $ref: ./item/item.item.registered.v1.json
      x-ant-kind: decision
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    item.carrier.applied.v1:
      name: item.carrier.applied.v1
      title: Носитель идентификатора нанесён
      summary: Носитель идентификатора нанесён — на изделие нанесён носитель (DPM DataMatrix, бирка с QR, тара и ячейка); связь «носитель → изделие» (AD-16).
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.carrier.applied
              schema_version:
                const: 1
              data:
                $ref: ./item/item.carrier.applied.v1.json
      x-ant-kind: fact
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    item.carrier.verified.v1:
      name: item.carrier.verified.v1
      title: Носитель проверен считыванием
      summary: "Носитель проверен считыванием — результат считывания носителя: прочитан / нечитаем / не совпал; нечитаемый носитель — задача перемаркировки (AD-16)."
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.carrier.verified
              schema_version:
                const: 1
              data:
                $ref: ./item/item.carrier.verified.v1.json
      x-ant-kind: fact
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    item.carrier.removed.v1:
      name: item.carrier.removed.v1
      title: Носитель снят
      summary: Носитель снят — носитель снят с изделия (временная бирка снята, код снят мехобработкой); разрешение носителя учитывает «снят» на `occurred_at` (AD-41).
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.carrier.removed
              schema_version:
                const: 1
              data:
                $ref: ./item/item.carrier.removed.v1.json
      x-ant-kind: fact
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    item.assembly.recorded.v1:
      name: item.assembly.recorded.v1
      title: Компонент включён в сборку
      summary: Компонент включён в сборку — компонент (экземпляр или партия) установлен в сборку или соединён сваркой; история сборки включает историю компонентов (FR-45). Сканируется до установки.
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.assembly.recorded
              schema_version:
                const: 1
              data:
                $ref: ./item/item.assembly.recorded.v1.json
      x-ant-kind: fact
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    item.presentation.recorded.v1:
      name: item.presentation.recorded.v1
      title: Изделие предъявлено
      summary: Изделие предъявлено — мастер предъявляет изделие ОТК или представителю заказчика на точке предъявления; номер предъявления растёт, повторное требует подписи выше (FR-19).
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.presentation.recorded
              schema_version:
                const: 1
              data:
                $ref: ./item/item.presentation.recorded.v1.json
      x-ant-kind: fact
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    item.intervention.opened.v1:
      name: item.intervention.opened.v1
      title: Вмешательство в собранное изделие открыто
      summary: "Вмешательство в собранное изделие открыто — разборка собранного или принятого изделия: что, зона, кто, зачем; пока открыто — приёмка и отгрузка запрещены, прежние результаты зоны «устарели» (FR-21)."
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.intervention.opened
              schema_version:
                const: 1
              data:
                $ref: ./item/item.intervention.opened.v1.json
      x-ant-kind: decision
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: protective
      x-ant-critical: false
      x-ant-current: true
    item.intervention.closed.v1:
      name: item.intervention.closed.v1
      title: Вмешательство закрыто
      summary: Вмешательство закрыто — установлено обратно, зона проверена повторно, подпись контролёра; приёмка снова возможна (FR-21, ЗТ-В).
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.intervention.closed
              schema_version:
                const: 1
              data:
                $ref: ./item/item.intervention.closed.v1.json
      x-ant-kind: decision
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: permissive
      x-ant-critical: true
      x-ant-current: true
    item.identification.questioned.v1:
      name: item.identification.questioned.v1
      title: Идентификация изделия под сомнением
      summary: "Идентификация изделия под сомнением — потеря или неоднозначность идентификации: изделие изолируется до повторной идентификации человеком с подписью (AD-16)."
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.identification.questioned
              schema_version:
                const: 1
              data:
                $ref: ./item/item.identification.questioned.v1.json
      x-ant-kind: reaction
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: protective
      x-ant-critical: false
      x-ant-current: true
    item.identification.confirmed.v1:
      name: item.identification.confirmed.v1
      title: Идентификация подтверждена человеком
      summary: Идентификация подтверждена человеком — повторная идентификация уполномоченным с подписью снимает «идентификацию под сомнением» (AD-16).
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.identification.confirmed
              schema_version:
                const: 1
              data:
                $ref: ./item/item.identification.confirmed.v1.json
      x-ant-kind: decision
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: permissive
      x-ant-critical: true
      x-ant-current: true
    item.release.recorded.v1:
      name: item.release.recorded.v1
      title: Изделие сдано на склад готовой продукции
      summary: Изделие сдано на склад готовой продукции — кладовщик принял годное изделие на склад; это исполнение закрывающей точки выпуска, следом — «выпуск годного» в 1С (FR-44).
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: item.release.recorded
              schema_version:
                const: 1
              data:
                $ref: ./item/item.release.recorded.v1.json
      x-ant-kind: fact
      x-ant-emitter: item
      x-ant-stream: item
      x-ant-axis: none
      x-ant-action-class: record
      x-ant-critical: false
      x-ant-current: true
    operation.run.started.v1:
      name: operation.run.started.v1
      title: Операция начата
      summary: Операция начата — начато выполнение операции над изделием; до начала проверяются предусловия (FR-17). Источник — терминал, MES или станок.
      contentType: application/json
      payload:
        allOf:
          - $ref: ./common/envelope.v1.json
          - type: object
            properties:
              event_type:
                const: operation.run.started
              schema_version:
