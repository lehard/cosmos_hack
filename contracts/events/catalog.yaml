# Каталог типов записей журнала v1 (AD-40, FR-27, FR-28, кейс §4.3–4.4).
# Все эпики берут имена событий только отсюда. Модуль расширяет своё семейство совместимо сам
# (новый тип, новое необязательное поле); ломающие изменения и чужие семейства — через дирижёра.
# Схема этого файла — catalog.schema.json; проверки — contracts/scripts/check.sh:
#   у каждого типа есть схема data и ровно один эмитент; эмитент = владелец семейства
#   (кроме emitter_exceptions); ось статуса меняет только её модуль-владелец (AD-30);
#   у критического действия есть группа CA (AD-28); у каждого типа есть класс действия (AD-27).
catalog_version: 1

modules:
  journal: "запись (Append), цепочки, контрольные точки, генезис, время"
  engine: "композиция свёртки изделия и сценарий воркера — своих типов записей не эмитит"
  crossitem: "межизделийная стадия: генеалогия, партии, привязка, адресованные записи"
  ingest: "приём, подпись, схема, дедупликация, карантин, импорт"
  reference: "справочники с версиями, календарь и смены, соответствия внешних ID"
  process: "нормативный слой, версии процесса, исполнитель BPMN, операции и перемещения"
  item: "паспорт, носители идентификатора, сборка, вмешательства"
  quality: "результаты контроля, сигналы, дефекты, полнота контроля"
  nonconformity: "несоответствия, решения, сдерживание, разрешения на отклонение"
  analysis: "инциденты, область риска, гипотезы, причины, корректирующие меры"
  machinelogs: "события оборудования, сводки выполнения, окна нарушений"
  vision: "паспорта допуска анализаторов, проверки, откат"
  documents: "документы, подписи, маршруты"
  signing: "криптопрофили, ключи, акты регистрации и отзыва"
  access: "люди, роли, полномочия, клейма, допуск к рабочему месту, действия исполнителя"
  security: "события безопасности, журнал критических действий"
  materials: "хранилище материалов по адресу содержимого"
  notifications: "сроки, задачи, уведомления, эскалации"
  analytics: "показатели — только проекции, своих типов записей не эмитит"
  erp: "1С и Галактика: вход и исходящие учётные сообщения"
  mes: "MES: задания, блокировки"
  cad: "КОМПАС-3D: импорт условной сборки"
  federation: "межзаводской обмен, партнёры, выписки"
  simulation: "прогоны сценариев, виртуальные часы, инъекции стенда"
  ops: "эксплуатация: сбои обработки, источники, интеграции"

roles:
  api: "команды и приём фактов (операции Huma, ingest)"
  worker: "свёртка изделия и его реакции (AD-5)"
  crossitem: "межизделийная стадия, одна копия-лидер (AD-42)"
  projector: "глобальные потребители журнала, одна копия-лидер (AD-45)"
  scheduler: "сроки, «наступил срок», окна ожидания"
  outbox: "отправка исходящих сообщений и их квитанции"
  stands: "stand-ы внешних систем и прогоны сценариев"
  init: "ant init: генезис"

streams:
  item: "поток изделия `item:‹item_id›` — триггер свёртки (AD-5)"
  lot: "партия, садка, плавка `lot:‹id›`"
  group: "временная группа изделий (садка, групповая операция) `group:‹id›`"
  concession: "разрешение на отклонение `concession:‹id›` — расход лимита атомарно (AD-39)"
  incident: "инцидент и область риска `incident:‹id›`"
  document: "документ вне изделия `document:‹id›`"
  policy: "политика доступа `policy:‹область›`"
  workplace: "рабочее место и его сеансы `workplace:‹id›`"
  equipment: "оборудование и точка процесса `equipment:‹id›`"
  process_version: "версия нормативного слоя `process_version:‹id›`"
  analyzer_passport: "паспорт допуска карты контроля `analyzer_passport:‹id›`"
  partner: "предприятие-партнёр `partner:‹код›`"
  key: "ключ и его акты `key:‹key_id›`"
  source: "источник событий `source:‹source_id›`"
  person: "сотрудник `person:‹псевдоним›`"
  reference: "справочник `reference:‹вид›:‹id›`"
  order: "производственное задание `order:‹id›`"
  erp_message: "исходящее учётное сообщение `erp_message:‹бизнес-ключ›`"
  run: "прогон сценария `run:‹run_id›`"
  global: "служебный глобальный поток"

families:
  item: {owner: item, title: "Изделие: регистрация, носители идентификатора, сборка, предъявление, вмешательства, выпуск"}
  operation: {owner: process, title: "Операции и перемещения: начало, пауза, завершение, переходы, предусловия, точки процесса"}
  inspection: {owner: quality, title: "Контроль: результат любого метода (три исхода), режим точки контроля"}
  quality: {owner: quality, title: "Качество: сигналы, дефекты, повторные наблюдения, полнота, пропуск брака"}
  equipment: {owner: machinelogs, title: "Оборудование: состояние, программа, инструмент, сводки, отклонения, окна нарушений"}
  operator: {owner: access, title: "Исполнитель: действия у рабочего места, пропуски проверок, ручные вмешательства, наблюдения OperatorVision"}
  decision: {owner: nonconformity, title: "Решения по изделию и несоответствию, сдерживание, разрешения на отклонение"}
  erp: {owner: erp, title: "Учётные системы (1С, Галактика): входящие задания и справочники, исходящие учётные сообщения и квитанции"}
  mes: {owner: mes, title: "MES: задания, блокировки изделий и партий"}
  cad: {owner: cad, title: "КОМПАС-3D: импорт условной сборки"}
  security: {owner: security, title: "Безопасность: шина событий безопасности и журнал критических действий"}
  document: {owner: documents, title: "Документы: версии, подписи, маршруты, бумажные экземпляры"}
  policy: {owner: access, title: "Политика доступа: роли, полномочия, цифровые клейма, разделение обязанностей, параметры аудита"}
  access: {owner: access, title: "Доступ: сотрудники, учётные записи, СКУД, токены, допуск к рабочему месту, назначения, квалификации"}
  key: {owner: signing, title: "Ключи и криптопрофили: регистрация, отзыв"}
  time: {owner: journal, title: "Время: режим часов, тики виртуальных часов сценария"}
  journal: {owner: journal, title: "Журнал: генезис, якорь, контрольные точки, сегменты, сборки, восстановление"}
  ingest: {owner: ingest, title: "Приём: карантин, переобработка, импорт, флаги аномалий, потеря данных источника"}
  material: {owner: materials, title: "Материалы: помещение в хранилище по адресу содержимого"}
  binding: {owner: crossitem, title: "Привязка событий к изделию"}
  genealogy: {owner: crossitem, title: "Генеалогия: партии, выдача партий, связи сборки, временные группы"}
  normative: {owner: process, title: "Нормативный слой: версии процесса и их жизненный цикл"}
  reference: {owner: reference, title: "Справочники: номенклатура, места, оборудование и поверка, календарь, смены, соответствия внешних ID"}
  obligation: {owner: notifications, title: "Сроки: установка, снятие, наступление, эскалация"}
  task: {owner: notifications, title: "Задачи и уведомления"}
  incident: {owner: analysis, title: "Инциденты и причины: область риска, гипотезы, причины, корректирующие меры, предложения"}
  analyzer: {owner: vision, title: "Анализаторы: проверки, паспорта допуска, приостановка и возврат"}
  federation: {owner: federation, title: "Федерация: партнёры, выписки паспорта, межзаводские сообщения"}
  simulation: {owner: simulation, title: "Симуляция: прогоны, пауза, инъекции цифрового стенда"}
