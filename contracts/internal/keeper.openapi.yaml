openapi: 3.1.0
info:
  title: ant keeper — хранитель контрольных точек
  version: 1.0.0
  description: |
    Контракт собственного процесса `cmd/keeper` (AD-8, AD-46). Транспорт — mTLS (сертификаты от `ant init`);
    в промышленной эксплуатации хранитель — хост службы ИБ или ВП в другом административном домене.
    Хранитель принимает новую голову, только если звенья от прежней головы сходятся (цепочка продолжена,
    а не переписана); отвергает точку с seq не больше последней или с тем же seq и другим звеном.
    Контрольная точка — пакет DSSE класса `checkpoint` профиля `hybrid` (contracts/crypto/checkpoint.schema.json).
    Хранитель сам поднимает тревогу, если головы не приходили дольше 2N секунд (N — из policy.audit.*).
servers:
  - url: https://keeper:8444
    description: Контейнер keeper в демо (mTLS)
paths:
  /v1/heads:
    post:
      operationId: keeper.heads.submit
      summary: Передать головы цепочек и звенья от прежней головы
      description: ant раз в N секунд передаёт головы обеих цепочек (main, ca) и все звенья после прежней принятой головы.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HeadsSubmission'}
      responses:
        '200':
          description: Головы приняты — выдана новая контрольная точка
          content:
            application/json:
              schema: {$ref: '../crypto/dsse-envelope.schema.json'}
        '409':
          description: Звенья не сходятся (переписывание, вилка) или seq не больше последней — тревога записана
          content:
            application/problem+json:
              schema: {$ref: '../problem.schema.json'}
  /v1/checkpoints/latest:
    get:
      operationId: keeper.checkpoints.latest
      summary: Последняя контрольная точка
      responses:
        '200':
          description: Пакет DSSE контрольной точки
          content:
            application/json:
              schema: {$ref: '../crypto/dsse-envelope.schema.json'}
        '404':
          description: Точек ещё нет
          content:
            application/problem+json:
              schema: {$ref: '../problem.schema.json'}
  /v1/checkpoints:
    get:
      operationId: keeper.checkpoints.list
      summary: Контрольные точки после номера
      description: Для верификатора — все точки после after_no.
      parameters:
        - {name: after_no, in: query, required: false, schema: {type: integer, minimum: 0}, description: "Номер, после которого выдать"}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000}, description: Сколько выдать}
      responses:
        '200':
          description: Пакеты DSSE по возрастанию номера
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '../crypto/dsse-envelope.schema.json'}
  /v1/verifier-reports:
    post:
      operationId: keeper.reports.submit
      summary: Сдать подписанный отчёт верификатора
      description: Первичный канал вердикта — отчёт у хранителя; Аудитор ИБ и ВП получают его без ant (AD-46).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../crypto/dsse-envelope.schema.json'}
      responses:
        '201':
          description: Отчёт принят
        '422':
          description: Подпись верификатора не проверяется по trust-anchors
          content:
            application/problem+json:
              schema: {$ref: '../problem.schema.json'}
  /v1/verifier-reports/latest:
    get:
      operationId: keeper.reports.latest
      summary: Последний отчёт верификатора
      description: ant забирает его и журналирует security.integrity.checked; индикатор на столах — «по данным сервера».
      responses:
        '200':
          description: Пакет DSSE класса verifier-report (contracts/internal/verifier/report.v1.json)
          content:
            application/json:
              schema: {$ref: '../crypto/dsse-envelope.schema.json'}
        '404':
          description: Отчётов ещё нет
          content:
            application/problem+json:
              schema: {$ref: '../problem.schema.json'}
  /v1/verifier-reports/{digest}:
    get:
      operationId: keeper.reports.read
      summary: Отчёт верификатора по отпечатку
      description: Отчёт целиком для стола Аудитора ИБ (ant показывает его «по данным сервера», AD-46). Отпечаток — streebog256 канонического payload.
      parameters:
        - {name: digest, in: path, required: true, schema: {type: string, pattern: '^streebog256:[0-9a-f]{64}$'}, description: Отпечаток отчёта}
      responses:
        '200':
          description: Пакет DSSE класса verifier-report
          content:
            application/json:
              schema: {$ref: '../crypto/dsse-envelope.schema.json'}
        '404':
          description: Такого отчёта нет
          content:
            application/problem+json:
              schema: {$ref: '../problem.schema.json'}
  /v1/verifier-reports:
    get:
      operationId: keeper.reports.list
      summary: Отчёты верификатора, новые сверху
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000}, description: Сколько выдать}
      responses:
        '200':
          description: Пакеты DSSE отчётов
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '../crypto/dsse-envelope.schema.json'}
  /v1/links:
    get:
      operationId: keeper.links.list
      summary: Звенья, принятые хранителем
      description: |
        Верификатор сравнивает звенья журнала с принятыми хранителем и находит точное место переписанной
        записи (правка с пересчётом цепочки, AD-8, AD-9), а не только диапазон между контрольными точками.
      parameters:
        - {name: chain, in: query, required: true, schema: {type: string, enum: [main, ca]}, description: Цепочка}
        - {name: after_seq, in: query, required: false, schema: {type: integer, minimum: 0}, description: После номера}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10000}, description: Сколько выдать}
      responses:
        '200':
          description: Звенья по возрастанию seq
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Link'}
  /v1/status:
    get:
      operationId: keeper.status
      summary: Состояние хранителя и тревоги
      description: Тревоги хранителя (молчание сервера дольше 2N, вилка, откат); ant журналирует их как security.keeper.alert.
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeeperStatus'}
  /healthz:
    get:
      operationId: keeper.health
      summary: Живость
      responses:
        '200':
          description: Работает
components:
  schemas:
    HeadsSubmission:
      type: object
      additionalProperties: false
      required: [heads, links, committed_at_from, committed_at_to]
      description: Головы цепочек и звенья от прежней головы.
      properties:
        heads:
          type: array
          minItems: 1
          maxItems: 2
          description: Головы main и ca.
          items:
            type: object
            additionalProperties: false
            required: [chain, seq, link]
            properties:
              chain: {type: string, enum: [main, ca], description: Цепочка}
              seq: {type: integer, minimum: 0, description: Номер головы}
              link: {type: string, pattern: '^streebog256:[0-9a-f]{64}$', description: Звено головы}
        links:
          type: array
          description: Звенья после прежней принятой головы по порядку seq — чтобы хранитель проверил продолжение цепочки.
          items: {$ref: '#/components/schemas/Link'}
        committed_at_from: {type: string, format: date-time, description: Наименьший committed_at}
        committed_at_to: {type: string, format: date-time, description: Наибольший committed_at}
    Link:
      type: object
      additionalProperties: false
      required: [chain, seq, commit, open_fields_hash, link]
      description: Звено записи — хранитель проверяет продолжение цепочки, не видя содержимого.
      properties:
        chain: {type: string, enum: [main, ca], description: Цепочка}
        seq: {type: integer, minimum: 1, description: Номер}
        commit: {type: string, pattern: '^streebog256:[0-9a-f]{64}$', description: Обязательство}
        open_fields_hash: {type: string, pattern: '^streebog256:[0-9a-f]{64}$', description: H(JCS(открытые поля без link))}
        link: {type: string, pattern: '^streebog256:[0-9a-f]{64}$', description: Звено}
    KeeperStatus:
      type: object
      additionalProperties: false
      required: [interval_seconds, checkpoints, alarms]
      description: Состояние хранителя.
      properties:
        last_submission_at: {type: string, format: date-time, description: Последняя передача голов}
        interval_seconds: {type: integer, minimum: 1, description: N — интервал голов (policy.audit.*)}
        checkpoints: {type: integer, minimum: 0, description: Сколько контрольных точек}
        alarms:
          type: array
          description: Тревоги хранителя по порядку
          items:
            type: object
            additionalProperties: false
            required: [no, alert, chain, last_seq, detail, at]
            properties:
              no: {type: integer, minimum: 1, description: Номер тревоги}
              alert: {type: string, enum: [heads_silent, fork_attempt, rollback_attempt, checkpoint_gap], description: Вид}
              chain: {type: string, description: Цепочка}
              last_seq: {type: integer, minimum: 0, description: Последний принятый номер}
              detail: {type: string, description: Подробности}
              at: {type: string, format: date-time, description: Время хранителя}
