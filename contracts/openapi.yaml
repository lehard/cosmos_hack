info:
  description: "HTTP API системы ant — доверенная система контроля качества. Сгенерировано из операций Huma (backend/internal/infrastructure/transport); руками не править (AD-20). Каждая операция несёт x-ant-action: id (он же operationId, ключ прав Casbin и @casl), класс (AD-27), критичность (AD-28), модуль-владелец (AD-40), гарды (AD-39), эмитируемые типы записей журнала. Чтение принимает axis и as_of (AD-21, AD-22); команды — command_id, basis_seq, policy_seq (AD-7, AD-39); режим fixtures | live — в заголовке ответа Ant-Backend (AD-36); ошибки — RFC 9457 problem+json с кодом из contracts/errors.yaml."
  title: ant API
  version: "1"
openapi: 3.1.0
paths:
  /api/v1/alerts:
    get:
      description: "FR-8: просроченные изоляции, точки предъявления сверх срока, «не перемещено в изолятор», аномалии узлов, эскалации, нарушения целостности."
      operationId: notifications.alert.list
      parameters:
        - description: "Ось момента: occurred — «как было» (по умолчанию), recorded — «что мы знали» (AD-37)."
          explode: false
          in: query
          name: axis
          schema:
            $ref: "#/components/schemas/Axis"
            description: "Ось момента: occurred — «как было» (по умолчанию), recorded — «что мы знали» (AD-37)."
        - description: "Момент (RFC 3339 UTC); пусто — «сейчас». Задан — воспроизведение: команды выключены (AD-21)."
          explode: false
          in: query
          name: as_of
          schema:
            description: "Момент (RFC 3339 UTC); пусто — «сейчас». Задан — воспроизведение: команды выключены (AD-21)."
            format: date-time
            type: string
        - description: "Прогон сценария: данные в его пространстве имён (AD-38)."
          explode: false
          in: query
          name: run_id
          schema:
            description: "Прогон сценария: данные в его пространстве имён (AD-38)."
            maxLength: 128
            type: string
        - description: Курсор следующей страницы из ответа; пусто — первая страница.
          explode: false
          in: query
          name: cursor
          schema:
            description: Курсор следующей страницы из ответа; пусто — первая страница.
            maxLength: 512
            type: string
        - description: Размер страницы (по умолчанию 50).
          explode: false
          in: query
          name: limit
          schema:
            description: Размер страницы (по умолчанию 50).
            format: int64
            maximum: 500
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
          description: OK
          headers:
            Ant-Backend:
              schema:
                $ref: "#/components/schemas/BackendMode"
                description: "Режим ведущих портов, отдавших ответ: метка fixtures | live на виджете (AD-36, FR-150)."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Лента тревог
      tags:
        - notifications
      x-ant-action:
        class: read
        critical: false
        id: notifications.alert.list
        owner: notifications
        subject: notification
