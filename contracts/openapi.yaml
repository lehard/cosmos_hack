# СГЕНЕРИРОВАНО из операций Huma (backend/internal/infrastructure/transport) командой
# `ant -openapi` в make generate — руками не править (AD-20). Контракт фронтенда: клиент orval + Vue Query.
components:
  schemas:
    AccessAssignment:
      additionalProperties: false
      properties:
        admitted:
          description: Допуск к рабочему месту действует (барьер 2).
          type: boolean
        approval_document_id:
          description: Документ согласования начальника ОТК — для контролёра обязателен.
          type: string
        assignee_role:
          enum:
            - performer
            - quality_inspector
          type: string
        person_id:
          type: string
        qualification_ok:
          description: Квалификация действует на дату смены (FR-80).
          type: boolean
        shift_id:
          type: string
        workplace_id:
          type: string
      required:
        - workplace_id
        - shift_id
        - person_id
        - assignee_role
        - admitted
        - qualification_ok
      type: object
    AccessAssignmentList:
      additionalProperties: false
      properties:
        basis_seq:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/AccessAssignment"
          type: array
      required:
        - items
        - basis_seq
      type: object
    AccessAuditParameters:
      additionalProperties: false
      properties:
        checkpoint_interval_s:
          description: Интервал контрольных точек, с.
          format: int64
          minimum: 1
          type: integer
        checkpoint_max_gap_s:
          description: Предельный разрыв контрольных точек, с.
          format: int64
          minimum: 1
          type: integer
        critical_types:
          description: Перечень критических типов записей.
          items:
            type: string
          type: array
        keeper_key_fingerprint:
          description: Отпечаток ключа хранителя (streebog256:…).
          type: string
        policy_seq:
          format: int64
          type: integer
        security_bus_subscribers:
          description: Подписчики шины безопасности (AD-24).
          items:
            type: string
          type: array
        set_at:
          format: date-time
          type: string
        set_by:
          type: string
      required:
        - critical_types
        - checkpoint_interval_s
        - checkpoint_max_gap_s
        - keeper_key_fingerprint
        - security_bus_subscribers
        - policy_seq
      type: object
    AccessAuthority:
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
      required:
        - id
        - title
      type: object
    AccessGrantEntry:
      additionalProperties: false
      properties:
        action:
          description: Выдано, отозвано, установлено.
          enum:
            - granted
            - revoked
            - set
          type: string
        at:
          format: date-time
          type: string
        by:
          description: Кто выдал (псевдоним).
          type: string
        ca_ref:
          description: Критическое действие CA-‹n› (AD-28).
          type: string
        document_id:
          description: Документ выдачи с маршрутом подписей.
          type: string
        event_id:
          type: string
        kind:
          description: Что выдано или отозвано.
          enum:
            - role
            - authority
            - stamp
            - qualification
            - account
            - audit
            - sod_rule
          type: string
        person_id:
          type: string
        scope:
          type: string
        second_signature_by:
          description: Вторая подпись независимой стороны (AD-11).
          type: string
        seq:
          format: int64
          type: integer
        subject_id:
          description: Роль, полномочие, клеймо, квалификация.
          type: string
      required:
        - event_id
        - seq
        - kind
        - action
        - subject_id
        - at
        - by
      type: object
    AccessGrantHistory:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AccessGrantEntry"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AccessPerson:
      additionalProperties: false
      properties:
        account_status:
          description: "Учётная запись: нет, ждёт активации, действует, заблокирована (FR-128)."
          enum:
            - none
            - pending
            - active
            - blocked
          type: string
        display_name:
          type: string
        login:
          type: string
        org_unit:
          type: string
        person_id:
          description: Псевдоним сотрудника.
          type: string
        policy_seq:
          description: Версия политики, на которой построен ответ (AD-39).
          format: int64
          type: integer
        roles:
          items:
            $ref: "#/components/schemas/AccessRoleGrant"
          type: array
      required:
        - person_id
        - display_name
        - account_status
        - roles
        - policy_seq
      type: object
    AccessPersonList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AccessPerson"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AccessQualification:
      additionalProperties: false
      properties:
        certificate_ref:
          type: string
        person_id:
          type: string
        qualification_id:
          type: string
        scope:
          type: string
        status:
          enum:
            - valid
            - expiring
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      required:
        - person_id
        - qualification_id
        - valid_from
        - status
      type: object
    AccessQualificationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AccessQualification"
          type: array
      required:
        - items
      type: object
    AccessReason:
      additionalProperties: false
      properties:
        code:
          description: Машинный код основания.
          maxLength: 64
          type: string
        text:
          description: Основание по-русски.
          maxLength: 2000
          type: string
      required:
        - text
      type: object
    AccessRole:
      additionalProperties: false
      properties:
        actions:
          description: Действия ‹модуль›.‹объект›.‹действие›; * — любой сегмент.
          items:
            type: string
          type: array
        case_role:
          description: Одна из пяти ролей кейса.
          type: boolean
        id:
          type: string
        inherits:
          items:
            type: string
          type: array
        title:
          type: string
      required:
        - id
        - title
        - case_role
        - inherits
        - actions
      type: object
    AccessRoleGrant:
      additionalProperties: false
      properties:
        role_id:
          type: string
        scope:
          description: "Область: здание → цех → участок → рабочее место."
          type: string
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      required:
        - role_id
        - scope
        - valid_from
      type: object
    AccessRoleList:
      additionalProperties: false
      properties:
        authorities:
          items:
            $ref: "#/components/schemas/AccessAuthority"
          type: array
        items:
          items:
            $ref: "#/components/schemas/AccessRole"
          type: array
        policy_seq:
          format: int64
          type: integer
        stamp_kinds:
          description: Виды контроля для цифровых клейм (FR-145).
          items:
            type: string
          type: array
      required:
        - items
        - authorities
        - stamp_kinds
        - policy_seq
      type: object
    AccessStamp:
      additionalProperties: false
      properties:
        inspection_kind:
          description: Вид контроля (stamp_kinds политики).
          type: string
        order_ref:
          description: Приказ.
          type: string
        person_id:
          type: string
        scope:
          type: string
        stamp_id:
          type: string
        status:
          enum:
            - active
            - expired
            - revoked
          type: string
        valid_from:
          format: date-time
          type: string
        valid_until:
          format: date-time
          type: string
      required:
        - stamp_id
        - person_id
        - inspection_kind
        - scope
        - order_ref
        - valid_from
        - status
      type: object
    AccessStampList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AccessStamp"
          type: array
      required:
        - items
      type: object
    AccountRequest:
      additionalProperties: false
      properties:
        display_name:
          description: Отображаемое имя (условное).
          maxLength: 128
          minLength: 1
          type: string
        login:
          description: "Логин: латиница в нижнем регистре, цифры, «.», «_», «-»."
          pattern: ^[a-z0-9._-]{3,64}$
          type: string
        password:
          description: Пароль (на сервере — только хеш argon2id).
          maxLength: 256
          minLength: 8
          type: string
      required:
        - login
        - password
        - display_name
      type: object
    AccountRequestResult:
      additionalProperties: false
      properties:
        login:
          type: string
        person_id:
          description: Псевдоним, под которым администратор активирует учётную запись.
          type: string
        status:
          description: Ждёт активации администратором.
          enum:
            - pending
          type: string
      required:
        - login
        - person_id
        - status
      type: object
    AcknowledgeTask:
      additionalProperties: false
      properties:
        basis_seq:
          description: "seq, на котором клиент видел объект (basis_seq из ответа чтения): после него в потоках гарда не должно быть новых записей guard_relevant, иначе 409 journal.stale_state (AD-39)."
          format: int64
          minimum: 0
          type: integer
        command_id:
          description: UUIDv7 клиента; повтор с тем же id возвращает прежний ответ (AD-7). У подписанной команды — event_id пакета.
          format: uuid
          type: string
        note:
          maxLength: 2000
          type: string
        outcome:
          enum:
            - done
            - accepted
            - declined
          type: string
        policy_seq:
          description: Версия политики, по которой показаны права (policy_seq сеанса); изменилась — 409 journal.stale_policy (AD-39).
          format: int64
          minimum: 0
          type: integer
        signature:
          $ref: "#/components/schemas/DsseEnvelope"
          description: "Подписанный пакет DSSE для операций с уровнем подписи ≥ 1 (AD-10, AD-13, AD-14): подписывает агент токена, сервер сверяет отпечаток."
        workplace_id:
          description: Рабочее место сеанса (барьер 2, AD-15).
          maxLength: 128
          type: string
      required:
        - outcome
        - command_id
        - basis_seq
        - policy_seq
      type: object
    ActionClass:
      description: "Класс операции из x-ant-action (AD-27, AD-40): read — чтение, record — запись без последствий на осях, protective — защитное, permissive — разрешающее, irreversible — необратимое."
      enum:
        - read
        - record
        - protective
        - permissive
        - irreversible
      type: string
    ActionHistory:
      additionalProperties: false
      properties:
        actor:
          type: string
        at:
          format: date-time
          type: string
        cycle:
          format: int64
          type: integer
        event_id:
          type: string
        evidence:
          type: string
        result:
          enum:
            - effective
            - failed
          type: string
        text:
          type: string
        type:
          enum:
            - assigned
            - implemented
            - evaluated
          type: string
      required:
        - type
        - at
        - cycle
        - event_id
      type: object
    ActivateAccount:
      additionalProperties: false
      properties:
        basis_seq:
          description: "seq, на котором клиент видел объект (basis_seq из ответа чтения): после него в потоках гарда не должно быть новых записей guard_relevant, иначе 409 journal.stale_state (AD-39)."
          format: int64
          minimum: 0
          type: integer
        command_id:
          description: UUIDv7 клиента; повтор с тем же id возвращает прежний ответ (AD-7). У подписанной команды — event_id пакета.
          format: uuid
          type: string
        initial_role_id:
          maxLength: 64
          type: string
        login:
          maxLength: 128
          minLength: 1
          type: string
        password:
          description: Начальный пароль, если учётную запись заводит администратор без заявки (хранится только хеш argon2id).
          maxLength: 256
          type: string
        policy_seq:
          description: Версия политики, по которой показаны права (policy_seq сеанса); изменилась — 409 journal.stale_policy (AD-39).
          format: int64
          minimum: 0
          type: integer
        scope:
          description: Область начальной роли (здание → цех → участок → рабочее место); пусто — всё предприятие.
          maxLength: 256
          type: string
        signature:
          $ref: "#/components/schemas/DsseEnvelope"
          description: "Подписанный пакет DSSE для операций с уровнем подписи ≥ 1 (AD-10, AD-13, AD-14): подписывает агент токена, сервер сверяет отпечаток."
        workplace_id:
          description: Рабочее место сеанса (барьер 2, AD-15).
          maxLength: 128
          type: string
      required:
        - login
        - command_id
        - basis_seq
        - policy_seq
      type: object
    ActivateVersion:
      additionalProperties: false
      properties:
        basis_seq:
          description: "seq, на котором клиент видел объект (basis_seq из ответа чтения): после него в потоках гарда не должно быть новых записей guard_relevant, иначе 409 journal.stale_state (AD-39)."
          format: int64
          minimum: 0
          type: integer
        command_id:
          description: UUIDv7 клиента; повтор с тем же id возвращает прежний ответ (AD-7). У подписанной команды — event_id пакета.
          format: uuid
          type: string
        policy_seq:
          description: Версия политики, по которой показаны права (policy_seq сеанса); изменилась — 409 journal.stale_policy (AD-39).
          format: int64
          minimum: 0
          type: integer
        route_closed_event_id:
          description: document.route.closed листа утверждения.
          format: uuid
          type: string
        signature:
          $ref: "#/components/schemas/DsseEnvelope"
          description: "Подписанный пакет DSSE для операций с уровнем подписи ≥ 1 (AD-10, AD-13, AD-14): подписывает агент токена, сервер сверяет отпечаток."
        workplace_id:
          description: Рабочее место сеанса (барьер 2, AD-15).
          maxLength: 128
          type: string
      required:
        - route_closed_event_id
        - command_id
        - basis_seq
        - policy_seq
      type: object
    AdaptationEscape:
      additionalProperties: false
      properties:
        analyzer_version:
          type: string
        defect_id:
          type: string
        event_id:
          type: string
        item_id:
          type: string
        method_covers_defect:
          description: Метод способен выявить вид — иначе это не ошибка модели.
          type: boolean
        missed:
          items:
            $ref: "#/components/schemas/MissedObservation"
          type: array
        recheck:
          items:
            $ref: "#/components/schemas/RecheckItem"
          type: array
        recorded_at:
          format: date-time
          type: string
      required:
        - event_id
        - defect_id
        - item_id
        - method_covers_defect
        - recorded_at
        - missed
        - recheck
      type: object
    AdaptationEscapeList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdaptationEscape"
          type: array
      required:
        - items
      type: object
    AdmitPassport:
      additionalProperties: false
      properties:
        analyzer_id:
          maxLength: 128
          type: string
        analyzer_kind:
          description: Визуальный контроль или контроль действий оператора; по умолчанию visionqc.
          enum:
            - visionqc
            - operatorvision
          type: string
        basis_seq:
          description: "seq, на котором клиент видел объект (basis_seq из ответа чтения): после него в потоках гарда не должно быть новых записей guard_relevant, иначе 409 journal.stale_state (AD-39)."
          format: int64
          minimum: 0
          type: integer
        command_id:
          description: UUIDv7 клиента; повтор с тем же id возвращает прежний ответ (AD-7). У подписанной команды — event_id пакета.
          format: uuid
          type: string
        document_id:
          description: Протокол допуска с закрытым маршрутом.
          type: string
        passport_id:
          maxLength: 128
          type: string
        policy_seq:
          description: Версия политики, по которой показаны права (policy_seq сеанса); изменилась — 409 journal.stale_policy (AD-39).
          format: int64
          minimum: 0
          type: integer
        previous_passport_id:
          type: string
        recipe_ref:
          type: string
        signature:
          $ref: "#/components/schemas/DsseEnvelope"
          description: "Подписанный пакет DSSE для операций с уровнем подписи ≥ 1 (AD-10, AD-13, AD-14): подписывает агент токена, сервер сверяет отпечаток."
        stage:
          enum:
            - shadow
            - pilot
            - active
          type: string
        title:
          description: Название анализатора.
          maxLength: 256
          type: string
        trust_level:
          format: int64
          maximum: 4
          minimum: 0
          type: integer
        versions:
          additionalProperties:
            type: string
          type: object
        workplace_id:
          description: Рабочее место сеанса (барьер 2, AD-15).
          maxLength: 128
          type: string
      required:
        - passport_id
        - analyzer_id
        - stage
        - trust_level
        - recipe_ref
        - versions
        - document_id
        - command_id
        - basis_seq
        - policy_seq
      type: object
    AdmitWorkplace:
      additionalProperties: false
      properties:
        basis_seq:
          description: "seq, на котором клиент видел объект (basis_seq из ответа чтения): после него в потоках гарда не должно быть новых записей guard_relevant, иначе 409 journal.stale_state (AD-39)."
          format: int64
          minimum: 0
          type: integer
        checks_event_ids:
          description: Записи проверок допуска (проход СКУД, токен).
          items:
            type: string
          type: array
        command_id:
          description: UUIDv7 клиента; повтор с тем же id возвращает прежний ответ (AD-7). У подписанной команды — event_id пакета.
          format: uuid
          type: string
        key_ref:
          description: Ключ сотрудника (‹псевдоним›@‹версия›), вставленный на рабочем месте; эпик 37.
          maxLength: 128
          type: string
        pin_verified:
          description: PIN введён и ключ им открыт (порт подписи); эпик 37.
          type: boolean
        policy_seq:
          description: Версия политики, по которой показаны права (policy_seq сеанса); изменилась — 409 journal.stale_policy (AD-39).
          format: int64
          minimum: 0
          type: integer
        shift_id:
          maxLength: 128
          type: string
        signature:
          $ref: "#/components/schemas/DsseEnvelope"
          description: "Подписанный пакет DSSE для операций с уровнем подписи ≥ 1 (AD-10, AD-13, AD-14): подписывает агент токена, сервер сверяет отпечаток."
        workplace_id:
          description: Рабочее место сеанса (барьер 2, AD-15).
          maxLength: 128
          type: string
      required:
        - command_id
        - basis_seq
        - policy_seq
      type: object
    AlertEntry:
      additionalProperties: false
      properties:
        alert_id:
          type: string
        anomaly:
          description: Вид аномалии узла (queue_above_norm, wait_above_norm, downtime_over_threshold, output_spike, defect_rate_out_of_control).
          type: string
        at:
          format: date-time
          type: string
        gate:
          description: Точка предъявления.
          type: string
        item:
          description: Изделие (просроченная изоляция, не перемещено в изолятор).
          type: string
        items:
          format: int64
          minimum: 0
          type: integer
        kind:
          enum:
            - overdue_isolation
            - gate_overdue
            - not_moved_to_isolator
            - anomaly
            - escalation
            - integrity_violation
          type: string
        node:
          description: Узел (step_key) аномалии.
          type: string
        node_name:
          description: Имя узла — name элемента BPMN действующей версии процесса (для подписи вместо step_key); нет — показывать node.
          type: string
        operations:
          format: int64
          minimum: 0
          type: integer
        overdue_minutes:
          format: int64
          minimum: 0
          type: integer
        ref:
          $ref: "#/components/schemas/DrillRef"
          description: Объект тревоги (FR-7).
        target:
          description: "Эскалация: цель."
          type: string
      required:
        - alert_id
        - at
        - kind
      type: object
    AlertList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AlertEntry"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    AnalyticsOverview:
      additionalProperties: false
      properties:
        basis_seq:
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/MetricRow"
          type: array
        period:
          $ref: "#/components/schemas/Period"
      required:
        - period
        - items
        - basis_seq
      type: object
    AnalyzerCheck:
      additionalProperties: false
      properties:
        check_kind:
          enum:
            - exam
            - reference_set
            - shadow_comparison
            - drift_monitor
          type: string
        disagreement_rate_bp:
          format: int64
          maximum: 10000
          minimum: 0
          type: integer
        escape_rate_bp:
          format: int64
          maximum: 10000
          minimum: 0
          type: integer
        event_id:
          type: string
        false_alarm_rate_bp:
          format: int64
          maximum: 10000
          minimum: 0
          type: integer
        occurred_at:
          format: date-time
          type: string
        passed:
          type: boolean
        passport_id:
          type: string
      required:
        - event_id
        - passport_id
        - check_kind
