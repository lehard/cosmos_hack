# =============================================================================
# Пример: паспорт допуска конфигурации контроля (ai_admission_passport)
# Точка КТ-3 «шов фланца после сварки», изделие ФЛ-100 ред. «Б».
#
# Продукт: «Главный» — платформа управления космическим производством.
# Человеческое описание — docs/industry/AI_ADMISSION_EXAMPLE.md,
# паспорт самой точки — docs/industry/CONTROL_POINT_KT3.md,
# правила допуска — docs/industry/AI_ADMISSION.md.
#
# Паспорт допускает не «модель вообще», а КОНТУР КОНТРОЛЯ:
# изделие + ревизия КД + операция + точка + камеры + свет + калибровка
# + карта контроля + сценарий съёмки + версия анализатора + пороги + классы.
# Та же модель при другом свете или на другой ревизии — другой контур.
#
# Все числа, даты, версии и пороги — ПРОЕКТНЫЕ ПРЕДПОЛОЖЕНИЯ [ПП] / наши
# предложения [П]. Это не данные предприятия. ID — как в данных эмулятора
# (emulator-data/definitions/reference/*.yaml), подписи на экране — кириллицей.
# Время — МСК.
# Проверка синтаксиса:
#   python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" ai-admission-passport-kt3.yaml
# =============================================================================

meta:
  kind: example.ai_admission_passport
  version: "0.1-draft"
  created: "2026-09-26"
  markers:
    "[ПП]": "проектное предположение, на производстве не проверено"
    "[П]": "наше предложение"
  dates_note: "даты после 26.09.2026 — условные даты примера, а не план"

# -----------------------------------------------------------------------------
# Статусы паспорта и правила перехода
# -----------------------------------------------------------------------------
status_model:
  statuses:
    - {id: registered,       display: "зарегистрирован (версия пришла от поставщика)"}
    - {id: shadow,           display: "теневой режим (пишет ответы, ни на что не влияет)"}
    - {id: exam,             display: "экзамен у ОТК"}
    - {id: admitted,         display: "допущен (подписи есть)"}
    - {id: in_service,       display: "в работе (основная версия на точке)"}
    - {id: reserve,          display: "заменён, резерв для отката (допуск не отозван)"}
    - {id: suspended,        display: "приостановлен"}
    - {id: revoked,          display: "отозван"}
    - {id: expired,          display: "срок истёк"}
  rules:
    - "Строже — автоматически: перевод паспорта в «приостановлен», откат на резерв, «только ручной контроль»."
    - "Мягче — только человек с подписью: допуск, возврат в работу, снятие ручного контроля."
    - "Откат меняет будущее, но не историю: старые сигналы остаются «проанализировано версией такой-то»."
    - "Каждый переход — отдельная запись журнала: кто, роль, причина, основание."

# -----------------------------------------------------------------------------
# Уровни доверия (AI_ADMISSION.md, раздел 5)
# -----------------------------------------------------------------------------
trust_levels:
  levels:
  - {level: 0, display: "только запись (теневой режим)"}
  - {level: 1, display: "подсказка контролёру"}
  - {level: 2, display: "сам ставит «под подозрением» и назначает доп. контроль"}
  - {level: 3, display: "сам блокирует изделие (по утверждённому правилу)"}
  - {level: 4, display: "сам подтверждает оговорённые безопасные результаты"}
  never_allowed: "выпуск, переделка, списание, «использовать как есть» — ни на каком уровне"

# -----------------------------------------------------------------------------
# Паспорта
# -----------------------------------------------------------------------------
passports:

  # ===== Паспорт 004: vqc-weld 2.3.1 — полная запись =====
  - id: PD-KT3-FL100-004
    display_id: "ПД-КТ3-FL100-004"
    status: in_service                 # итог примера: снова в работе после отката 20.10
    previous: PD-KT3-FL100-003         # прежний паспорт, заменён 01.09 (подробности вне примера)

    scope:                             # что именно допущено — контур контроля
      product:
        item_type_id: FL-100-ASSY
        designation: "ФЛ-100.00.000 СБ"
        display: "Фланец люка гермокорпуса в сборе"
        kd_revision: B
        kd_revision_display: "Б"
        other_revisions: "не покрываются; для ред. «В» — ручной контроль (см. no_passport)"
      operation:
        display: "Сварка фланца с кольцом (патрубком)"
        weld_id: W-1
        route_id: "ROUTE-FL-100@3"
        segments: [U1, U2, U3, U4, U5, U6, U7, U8]
        seam_diameter_mm: 250            # шов по отверстию фланца D2 = 250 мм (setpoints.yaml)
        segment_length_mm: 98.2          # π × 250 / 8 ≈ 98,2 мм; как в products.yaml
      checkpoint:
        id: CP-WELD
        display: "КТ-3 «шов фланца после сварки»"
        phase: after_operation
        phase_display: "POST — после операции"
        station: ST-WC-ZT3
        passport_of_point: "docs/industry/CONTROL_POINT_KT3.md"
      recipe:
        id: "RCP-CP-WELD@3"
      cameras:
        - {id: CAM-WS-1, display: "Камера КТ-3, ракурс 1 (со стороны фланца)", sensor: "5 Мп, 2448 × 2048", tilt_deg: 25}
        - {id: CAM-WS-2, display: "Камера КТ-3, ракурс 2 (со стороны кольца)", sensor: "5 Мп, 2448 × 2048", tilt_deg: -25}
      positioner: {display: "поворотный стол", stops: 24, step_deg: 15, zero_mark: "код DataMatrix на фланце"}
      lighting_profile:
        id: "LP-KT3@2"
        modes: ["купол", "косой свет ×4", "лазерная линия", "купол с поляризацией — только при пересъёмке 2"]
        checksum_ref: "реестр профилей света: контрольная сумма фиксируется при допуске"
        external_light: "закрыт (бокс со шторкой) — условие допуска"
      calibration:
        procedure: "МК-КТ3-01 [П]: мира (масштаб 0,020 мм/пикс ±1 %), ступенчатая мера (лазер ±0,02 мм), эталонный фланец №1 каждую смену"
        requirement: "действующая запись калибровки на момент съёмки; номер записи — в каждом сигнале"
        records_in_example:
          - {id: CAL-CAM-WS-2026-09, valid_from: "2026-09-01", valid_until: "2026-09-30"}
          - {id: CAL-CAM-WS-2026-10, valid_from: "2026-10-01", valid_until: "2026-10-31"}
        etalon: {id: EF-1, display: "эталонный фланец №1", defects: ["прожог 0,5 мм на У2", "подрез 0,1 мм на У5", "пора 0,3 мм на У7"]}
      capture_scenario:
        id: "SC-KT3-24x2x5@1"
        display: "лазерный проход за 1 оборот, затем 24 остановки × 2 ракурса × 5 режимов света"
        window_mm: 40
        step_mm: 32.7                   # 785 мм / 24 окна; перекрытие ≈ 7 мм
        windows_per_segment: 3
        mm_per_px: {along_weld: 0.020, across_weld: 0.022}
        time_per_flange_s: 114

    analyzer:
      name: vqc-weld
      version: "2.3.1"
      supplier: "внешний поставщик анализатора (по кейсу модели обучаем не мы)"
      package_checksum_ref: "реестр версий: контрольная сумма пакета фиксируется при регистрации"
      pipeline:                        # как в примере сигнала VISION_QC.md
        - {stage: quality_gate, model_version: "1.2.0"}
        - {stage: anomaly,      model_version: "0.9.1"}
        - {stage: localizer,    model_version: "1.4.0"}
        - {stage: classifier,   model_version: "1.1.0"}
      frozen: true                     # в работе не доучивается; любое изменение — новая версия

    thresholds:
      id: th-7
      quality_min: 0.6                 # ниже — «признаков нет» превращается в «оценка невозможна»
      retake_max: 2
      confidence_min: {burn_through: 0.50, undercut: 0.50, porosity: 0.60, crater: 0.60, spatter: 0.60}   # [ПП]
      no_result_timeout_min: 10        # нет результата — «нет данных»
      note: "уверенность сравнима только внутри одной версии анализатора и порогов"

    classes:
      checked:
        - {id: burn_through, display: "прожог с лицевой стороны", proven: "от 0,5 мм, 29 из 29", trust_level: 3, reaction_rule: R-07}
        - {id: undercut,     display: "подрез",                   proven: "глубина от 0,1 мм (лазер), 29 из 29", trust_level: 3, reaction_rule: R-07}
        - {id: porosity,     display: "поры, выходящие на поверхность", proven: "от 0,3 мм, 22 из 27 — мало для блока", trust_level: 1}
        - {id: crater,       display: "кратер",                   proven: "не доказано", trust_level: 1}
        - {id: spatter,      display: "брызги металла",           proven: "не доказано", trust_level: 1}
      not_checked:                     # «этим методом не проверяется» — не «признаков нет»
        - {what: "прожог в корне шва",           closed_by: "рентген каждому фланцу (RCP-CP-WELD-XR@1)"}
        - {what: "внутренние поры, несплавление", closed_by: "рентген"}
        - {what: "закрытые трещины",              closed_by: "капиллярный контроль при подозрении"}
        - {what: "дефекты меньше ~0,1 мм",        closed_by: "не закрываются на этой точке"}

    known_limits:
      - "Блик на выпуклом валике и прижим позиционера у У6–У7 (случай №25: уверенность 0,91 при качестве кадра 0,34)"
      - "Размер без действующей калибровки — только оценка (measurable = false)"
      - "Изделие другой ревизии КД — «оценка невозможна», код unknown_part_revision"

    allowed_actions:
      summary: "сигнал и блок, не выпуск"
      list:
        - "сигнал в «Главный» с классом, участком, уверенностью и качеством кадра"
        - "местная лампа «в изолятор» / «на осмотр» на посту"
        - "карантин фланца по правилу R-07 — только для прожога и подреза"
        - "запрос пересъёмки (не больше 2 раз)"
        - "подсказка контролёру по порам, кратеру, брызгам"
    forbidden_actions:
      - "выпуск фланца и закрытие ЗТ-3"
      - "решения «переделка», «списание», «использовать как есть»"
      - "снятие карантина"
      - "«годно» при качестве кадра ниже 0,6 или при неснятых участках"
      - "смена порогов, профиля света или версии без нового допуска"
    trust_level: 3                     # сам блокирует изделие по утверждённому правилу R-07

    evidence:
      golden_set: {id: "ZN-KT3", display: "золотой набор ЗН-КТ3", version: 5, owner: QC-HEAD-01, windows: 225}
      exam_protocol: "ПИ-КТ3-2.3.1 [П]"
      exam_summary: {burn_through: "29/29", undercut: "29/29", porosity: "22/27", false_alarms: "5 из 120 годных (4,2 %)", unable_on_hard_good: "8 из 30 (27 %)"}
      shadow: "проведён перед допуском 01.09 (подробности вне примера)"

    approvals:
      signed_by:
        - {person: QC-HEAD-01, display: "НОТК-01", role: "начальник ОТК", authority: "допуск средств контроля", at: "2026-09-01T09:00+03:00"}
        - {person: MGR-01, display: "Руководитель производства", role: "руководитель производства", at: "2026-09-01T09:10+03:00"}
      agreed_by:
        - {person: TECH-01, display: "Т-01", role: "технолог", what: "назначение точки и классы"}
        - {person: null, display: "метрологическая служба", what: "методика калибровки лазерного профиля", note: "внешний подписант по положению, в справочнике людей нет"}
      customer_rep: "не требуется: техпроцесс не меняется, рентген остаётся обязательным"

    validity:
      valid_from: "2026-09-01"
      valid_until: "2026-11-30"        # плановый прогон золотого набора — раз в квартал
      stays_valid_while:
        - "калибровка действует"
        - "профиль света LP-KT3@2 с той же контрольной суммой, внешний свет закрыт"
        - "эталонный фланец №1 проходит в начале смены"
        - "изделие ФЛ-100 ред. «Б»"
      auto_suspend_triggers:           # строже — автоматически
        - "доля «оценка невозможна» за скользящие 50 окон выше 10 %"
        - "эталонный фланец №1 не прошёл"
        - "пропуск прожога или подреза, найденный ниже по маршруту"
        - "расхождения с контролёром выше 5 % окон за смену"
        - "смена профиля света или калибровка просрочена"

  # ===== Паспорт 005: vqc-weld 2.4.0 — отличается только тем, что указано =====
  - id: PD-KT3-FL100-005
    display_id: "ПД-КТ3-FL100-005"
    status: suspended                  # итог примера: приостановлен автоматикой 20.10
    inherits_from: PD-KT3-FL100-004    # контур тот же: изделие, точка, камеры, свет, калибровка, сценарий
    rollback_to: PD-KT3-FL100-004
    overrides:
      analyzer:
        name: vqc-weld
        version: "2.4.0"
        change_note: "новая предобработка (выравнивание яркости); модель пор дообучена на 140 новых снимках"
        pipeline:
          - {stage: quality_gate, model_version: "1.3.0"}
          - {stage: anomaly,      model_version: "0.9.1"}
          - {stage: localizer,    model_version: "1.4.0"}
          - {stage: classifier,   model_version: "1.2.0"}
      thresholds: {id: th-8, quality_min: 0.6, retake_max: 2}
      classes_trust:
        burn_through: 3
        undercut: 3
        porosity: 1                    # 25 из 27 — лучше, но для уровня 3 нужно 29 из 29
        crater: 1
        spatter: 1
      evidence:
        golden_set: {id: "ZN-KT3", version: 5, windows: 225}
        exam_protocol: "ПИ-КТ3-2.4.0 [П]"
        exam_summary:
          burn_through: {v2_3_1: "29/29", v2_4_0: "29/29"}
          undercut:     {v2_3_1: "29/29", v2_4_0: "29/29"}
          porosity:     {v2_3_1: "22/27", v2_4_0: "25/27"}
          crater:       {v2_3_1: "9/10",  v2_4_0: "9/10"}
          spatter:      {v2_3_1: "10/10", v2_4_0: "10/10"}
          false_alarms: {v2_3_1: "5 из 120 (4,2 %)", v2_4_0: "3 из 120 (2,5 %)"}
          unable_on_hard_good: {v2_3_1: "8 из 30 (27 %)", v2_4_0: "5 из 30 (17 %)"}
          verdict: "не хуже 2.3.1 ни по одному критичному классу; пропусков прожога и подреза нет (0 из 58); ложные тревоги ниже 5 %"
        shadow:
          period: {from: "2026-09-29", to: "2026-10-12"}
          flanges: 84
          windows: 2016                 # 84 фланца × 24 окна
          discrepancies: 9
          discrepancies_resolved: "6 — 2.4.0 нашла пору, контролёр подтвердил; 3 — 2.4.0 приняла следы зачистки щёткой за брызги, контролёр отклонил"
          critical_in_flow: "2 прожога и 1 подрез — обе версии нашли все"
          unable_share: {v2_3_1: "3,1 %", v2_4_0: "2,4 %"}
          criteria: "не меньше 80 фланцев и 10 рабочих дней; ни одного пропуска прожога или подреза"
      approvals:
        signed_by:
          - {person: QC-HEAD-01, display: "НОТК-01", role: "начальник ОТК", authority: "допуск средств контроля", at: "2026-10-14T10:00+03:00"}
          - {person: MGR-01, display: "Руководитель производства", role: "руководитель производства", at: "2026-10-14T10:20+03:00"}
        agreed_by:
          - {person: TECH-01, display: "Т-01", role: "технолог", what: "итоги теневого режима"}
      validity: {valid_from: "2026-10-14", valid_until: "2027-01-13"}

# -----------------------------------------------------------------------------
# Правило отката: на что можно откатиться автоматически
# -----------------------------------------------------------------------------
rollback_policy:
  target_allowed_if:
    - "у резервного паспорта допуск не отозван и срок не истёк"
    - "резервный паспорт покрывает текущие условия: та же ревизия КД, та же карта, тот же профиль света (контрольная сумма), действующая калибровка"
    - "резервная версия в обратной тени на тех же кадрах укладывается в пределы (доля «оценка невозможна» не выше 10 %)"
  otherwise: "точка переходит в «только ручной контроль»"
  reverse_shadow: "после допуска новой версии прежняя 30 суток работает в тени — чтобы откат был проверенным, а не вслепую"
  examples:
    - {case: "посторонний свет, свой профиль LP-KT3@2 не менялся, 2.3.1 в пределах", result: "откат на ПД-КТ3-FL100-004 (vqc-weld 2.3.1)"}
    - {case: "заменили лампы бокса — новый профиль LP-KT3@3", result: "ни один паспорт не покрывает LP-KT3@3 → «только ручной контроль», код lighting_profile_unapproved"}

# -----------------------------------------------------------------------------
# Где паспорта нет — ручной контроль
# -----------------------------------------------------------------------------
no_passport:
  - scope:
      item_type_id: FL-100-ASSY
      kd_revision: V
      kd_revision_display: "В"
      checkpoint: CP-WELD
    source: "сценарий S19: извещение ИИ-ФЛ-100-07 (CN-FL-100-07), D2 250,00 → 252,00"
    recipe: {id: "RCP-CP-WELD-V@1 [П]", method: "визуальный, человек"}
    system_message: "Для этой карты контроля нет допущенного анализатора — контроль ручной"
    camera_may: "снимать в теневом режиме (уровень 0) для будущего набора; на изделие не влияет"
    items_in_s19:
      - {item: F-039, display: "Ф-039", revision: "В", note: "доработан до «В»; на КТ-3 — ручной контроль"}
      - {item: F-040, display: "Ф-040", revision: "В", note: "запущен по «В»; на КТ-3 — ручной контроль"}
      - {item: F-037, display: "Ф-037", revision: "Б", note: "оставлен по «Б» по разрешению РО-0928-01; сварен и проверен на КТ-3 под действующим паспортом"}
      - {item: F-038, display: "Ф-038", revision: "Б", note: "списан; паспорт не нужен"}
    path_to_admission: "технолог оценивает влияние изменения на шов W-1 → прогон эталонного фланца ред. «В» → теневой режим на первых фланцах «В» → экзамен у ОТК → подписи → новый паспорт"

# -----------------------------------------------------------------------------
# Журнал паспортов КТ-3 (пример жизненного цикла). Записи только добавляются.
# -----------------------------------------------------------------------------
journal:
  - id: JR-KT3-001
    at: "2026-09-01T09:10+03:00"
    passport: PD-KT3-FL100-004
    from: exam
    to: in_service
    actor: {person: QC-HEAD-01, role: "начальник ОТК"}
    co_signers: [MGR-01]
    reason: "экзамен пройден, подписи собраны"
    basis: "ПИ-КТ3-2.3.1"
  - id: JR-KT3-002
    at: "2026-09-28T10:00+03:00"
    passport: PD-KT3-FL100-005
    from: null
    to: registered
    actor: {system: true}
    reason: "поставщик прислал vqc-weld 2.4.0; контрольная сумма пакета совпала"
    basis: "пакет поставщика и описание изменений"
  - id: JR-KT3-003
    at: "2026-09-28T10:25+03:00"
    passport: PD-KT3-FL100-005
    from: registered
    to: registered
    actor: {system: true}
    reason: "технический прогон на ЗН-КТ3 v5 (без подписи): не хуже 2.3.1 по прожогу и подрезу — можно в тень"
    basis: "отчёт прогона"
  - id: JR-KT3-004
    at: "2026-09-29T07:30+03:00"
    passport: PD-KT3-FL100-005
    from: registered
    to: shadow
