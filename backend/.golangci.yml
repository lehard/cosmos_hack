          pkg: "^time$"
          msg: "AD-4: домен не читает часы — время приходит аргументом из записей журнала (DomainClock — в application)"
        - pattern: "^rand\\..*$"
          pkg: "^(math/rand(/v2)?|crypto/rand)$"
          msg: "AD-4: в домене нет случайности; идентификаторы реакций — UUIDv5 от NS_ANT"
