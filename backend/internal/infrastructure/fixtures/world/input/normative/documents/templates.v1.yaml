# Шаблоны документов шагов процесса (AD-12, FR-65) — нормативный слой. Шаги ссылаются на них (ant:document/@template).
# Класс: record — генерируется из журнала; decision — черновик + маршрут подписей; input — внешняя запись.
# Полностью описаны: позвоночник эпика 28 (сопроводительная карта, заявление о несоответствии, решение по
# несоответствующей продукции, лист утверждения версии процесса, «Запросить решение») и каталог эпика 44 — акт
# входного контроля, ярлыки, журнал предъявления ОТК, извещение и заключение ВП, разрешение на отклонение, акт о
# браке, журнал изолятора, маршрутный лист, запись вмешательства, паспорт и свидетельство о приёмке, выписка
# паспорта, служебные акты. Остальные — только объявлены (не в MVP или внешний вход).
#
# Документ по событию-триггеру (эпик 44): doc_type event_record + trigger {events, per, when} — свёртка изделия
# оформляет документ сама по записи журнала изделия (per: event — документ на запись, per: item — журнал изделия,
# запись — строка и новая версия; when — отбор по полю data). Содержимое: item.* (шапка изделия), event.* (at,
# step, actor, source, type), data.* (data записи целиком), rows (все записи-триггеры). Документы вне изделия
# (партия, пост, служебные) — generic по запросу (documents.version.request): subject, decision, comment,
# requested_by, requested_at, sources.
#
# Поля полного шаблона (схема — contracts/normative/templates.schema.json):
#   version   — версия шаблона: template_ref = ‹id›@‹версия›; новая версия шаблона — новый файл templates.v‹N›.yaml;
#   doc_type  — построитель содержимого в domain/documents (traveler, nc_statement, nc_disposition, generic);
#   summary   — поля сводки уровня 2 (3–7), входят в отпечаток;
#   route     — маршрут подписей (AD-13): этапы по порядку; обязательные подписи вычисляет access.RequiredApprovals
#               при черновике и замораживает в каноническом JSON документа (AD-43);
#   layout    — каноническая отрисовка HTML: разделы fields / table / route / text; печатная рамка (QR, дата печати,
#               колонтитул «получено из системы») в отрисовку не входит.
# Полномочия и роли — из normative/policy/policy.v1.yaml. Все составы маршрутов — проектные допущения [ПП].
version: 1
templates:
  - {id: incoming-register,            title: "Журнал регистрации продукции, поступившей на входной контроль", class: record}
  - {id: incoming-inspection-protocol, title: "Протокол входного контроля (снимки — приложение)",            class: record}
  # Эпик 44: партия — поток вне изделия; акт оформляет контролёр ВК запросом (documents.version.request) по приёмке партии.
  - id: incoming-inspection-act
    title: "Акт входного контроля"
    class: record
    version: 1
    doc_type: generic
    subject: lot
    summary:
      - {key: subject, label: "Партия"}
      - {key: decision, label: "Заключение"}
      - {key: requested_by, label: "Контролёр ВК"}
    route:
      - {stage: 1, title: "Контролёр входного контроля", role: quality_inspector, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, stamp_kind: incoming}
      - {stage: 2, title: "Мастер склада — приёмка на хранение", role: site_foreman, authority_id: site_foreman, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Акт входного контроля"
        fields:
          - {key: subject, label: "Партия"}
          - {key: decision, label: "Заключение"}
          - {key: comment, label: "Результаты контроля"}
          - {key: sources, label: "Сертификат, протоколы"}
          - {key: requested_by, label: "Контролёр ВК"}
          - {key: requested_at, label: "Дата"}
      - {kind: route, title: "Подписи"}
  - {id: incoming-results-register,    title: "Журнал результатов входного контроля",                         class: record}
  - id: lot-conformity-label
    title: "Ярлык соответствия / несоответствия партии (QR)"
    class: record
    version: 1
    doc_type: generic
    subject: lot
    summary:
      - {key: subject, label: "Партия"}
      - {key: decision, label: "Ярлык"}
      - {key: comment, label: "Основание"}
    route:
      - {stage: 1, title: "Контролёр качества", role: quality_inspector, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Ярлык партии"
        fields:
          - {key: subject, label: "Партия"}
          - {key: decision, label: "Ярлык"}
          - {key: comment, label: "Основание"}
          - {key: requested_by, label: "Контролёр"}
          - {key: requested_at, label: "Дата"}
      - {kind: route, title: "Подпись"}
  - id: item-tag
    title: "Бирка изделия с QR"
    class: record
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [item.carrier.applied], per: event}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: data.carrier_type, label: "Носитель"}
      - {key: data.value, label: "Значение"}
    route:
      - {stage: 1, title: "Мастер или контролёр — нанесение носителя", authority_id: source_record, quorum: one, signature_level: 1, paper_allowed: false, by_source: true}
    layout:
      - kind: fields
        title: "Бирка"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: data.carrier_type, label: "Носитель"}
          - {key: data.value, label: "Значение"}
          - {key: event.at, label: "Нанесено"}
          - {key: event.actor, label: "Кто"}
      - {kind: route, title: "Подпись"}
  - id: traveler
    title: "Сопроводительная карта изделия"
    class: record
    version: 1
    doc_type: traveler
    subject: item
    summary:
      - {key: item.item_id,   label: "Изделие"}
      - {key: rows_count,     label: "Операций"}
      - {key: otk_count,      label: "Отметок ОТК"}
      - {key: nc_count,       label: "Несоответствий"}
      - {key: final.status,   label: "Итоговая годность"}
    route:
      - {stage: 1, title: "Контролёр ОТК — итоговая годность", role: quality_inspector, authority_id: qc_acceptance, stamp_kind: final,
         quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers, not_item_participant]}
      - {stage: 2, title: "Мастер участка — итоговая годность", role: site_foreman, authority_id: site_foreman,
         quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers]}
    layout:
      - kind: fields
        title: "Изделие"
        fields:
          - {key: item.item_id,              label: "Изделие"}
          - {key: item.item_type_id,         label: "Обозначение ДСЕ"}
          - {key: item.item_revision,        label: "Изменение КД"}
          - {key: item.order_id,             label: "Задание"}
          - {key: item.lots,                 label: "Партии"}
          - {key: item.process_version_hash, label: "Версия техпроцесса"}
      - kind: table
        title: "Операции"
        rows: rows
        columns:
          - {key: no,        label: "№"}
          - {key: operation, label: "Операция"}
          - {key: executor,  label: "Исполнитель"}
          - {key: date,      label: "Дата"}
          - {key: signature, label: "Подпись"}
          - {key: params,    label: "Фактические параметры"}
          - {key: otk,       label: "Отметка ОТК"}
          - {key: remarks,   label: "Отметки"}
      - kind: table
        title: "Несоответствия и разрешения"
        rows: nonconformities
        columns:
          - {key: number,      label: "№ заявления"}
          - {key: status,      label: "Состояние"}
          - {key: disposition, label: "Решение"}
          - {key: concession,  label: "Разрешение на отклонение"}
      - kind: fields
        title: "Итог"
        fields:
          - {key: final.status, label: "Итоговая годность"}
          - {key: final.at,     label: "Дата"}
      - {kind: route, title: "Итоговая годность — подписи"}
      - {kind: text, title: "Происхождение", key: origin}
  - {id: requisition,                  title: "Требование-накладная",                                         class: record}
  - id: first-article-act
    title: "Акт первой детали"
    class: record
    version: 1
    doc_type: generic
    subject: item
    summary:
      - {key: subject, label: "Изделие"}
      - {key: decision, label: "Заключение"}
      - {key: comment, label: "Причина первой детали"}
    route:
      - {stage: 1, title: "Контролёр с полномочием «первая деталь»", role: quality_inspector, authority_id: first_article, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Акт первой детали"
        fields:
          - {key: subject, label: "Изделие"}
          - {key: decision, label: "Заключение"}
          - {key: comment, label: "Смена программы, оснастки, КД"}
          - {key: sources, label: "Протоколы измерений"}
          - {key: requested_by, label: "Контролёр"}
          - {key: requested_at, label: "Дата"}
      - {kind: route, title: "Подпись"}
  - {id: cmm-protocol,                 title: "Протокол КИМ, карта измерений",                                class: input}
  # Эпик 44: журнал изделия — каждая запись item.presentation.recorded — строка и новая версия; повторное предъявление подписывает начальник ОТК (qc_acceptance_repeat) — через «Запросить решение».
  - id: presentation-log
    title: "Журнал предъявления ОТК"
    class: record
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [item.presentation.recorded], per: item}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: data.step_key, label: "Точка предъявления"}
      - {key: data.presentation_no, label: "Предъявление №"}
      - {key: data.presented_by, label: "Предъявил"}
    route:
      - {stage: 1, title: "Предъявивший (исполнитель или мастер)", authority_id: source_record, quorum: one, signature_level: 1, paper_allowed: false, by_source: true}
      - {stage: 2, title: "Контролёр ОТК — приёмка", role: quality_inspector, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Последнее предъявление"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: data.step_key, label: "Точка предъявления"}
          - {key: data.presentation_no, label: "Предъявление №"}
          - {key: data.presented_to, label: "Кому"}
          - {key: data.presented_by, label: "Предъявил"}
          - {key: event.at, label: "Дата"}
      - kind: table
        title: "Предъявления изделия"
        rows: rows
        columns:
          - {key: no, label: "№"}
          - {key: at, label: "Дата"}
          - {key: event, label: "Запись журнала"}
          - {key: step, label: "Операция"}
          - {key: actor, label: "Кто"}
          - {key: summary, label: "Данные"}
      - {kind: route, title: "Подписи"}
  - id: route-sheet
    title: "Маршрутный лист межцеховой передачи"
    class: record
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [operation.movement.sent, operation.movement.received], per: item}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: data.from_location_id, label: "Откуда"}
      - {key: data.to_location_id, label: "Куда"}
    route:
      - {stage: 1, title: "Мастер-отправитель", authority_id: source_record, quorum: one, signature_level: 1, paper_allowed: false, by_source: true}
      - {stage: 2, title: "Мастер-получатель", role: site_foreman, authority_id: site_foreman, quorum: one, signature_level: 1, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Передача"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: data.from_location_id, label: "Откуда"}
          - {key: data.to_location_id, label: "Куда"}
          - {key: data.container_id, label: "Тара"}
          - {key: event.at, label: "Дата"}
          - {key: event.actor, label: "Кто"}
      - kind: table
        title: "Отправки и приёмки"
        rows: rows
        columns:
          - {key: no, label: "№"}
          - {key: at, label: "Дата"}
          - {key: event, label: "Запись журнала"}
          - {key: step, label: "Операция"}
          - {key: actor, label: "Кто"}
          - {key: summary, label: "Данные"}
      - {kind: route, title: "Подписи"}
  - {id: interworkshop-transfer,       title: "Накладная на передачу между цехами",                           class: record}
  - {id: welding-log,                  title: "Журнал сварочных работ",                                       class: record}
  - {id: special-process-log,          title: "Журнал параметров специального процесса",                      class: record}
  - {id: ndt-conclusion,               title: "Заключение неразрушающего контроля",                           class: input}
  - {id: assembly-card,                title: "Карта сборки (отметки скрытых работ)",                         class: record}
  - {id: torque-log,                   title: "Журнал затяжек",                                               class: record}
  - id: intervention-record
    title: "Запись вмешательства (вскрытия)"
    class: record
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [item.intervention.opened, item.intervention.closed], per: item}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: data.intervention_id, label: "Вмешательство"}
      - {key: data.purpose, label: "Цель"}
    route:
      - {stage: 1, title: "Мастер — вскрытие", authority_id: source_record, quorum: one, signature_level: 1, paper_allowed: false, by_source: true}
      - {stage: 2, title: "Контролёр — закрытие после повторной проверки зоны", role: quality_inspector, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Вмешательство"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: data.intervention_id, label: "Вмешательство"}
          - {key: data.zone_ids, label: "Зоны"}
          - {key: data.purpose, label: "Цель"}
          - {key: data.removed_components, label: "Снятые компоненты"}
          - {key: event.at, label: "Дата"}
          - {key: event.actor, label: "Кто"}
      - kind: table
        title: "Открытие и закрытие"
        rows: rows
        columns:
          - {key: no, label: "№"}
          - {key: at, label: "Дата"}
          - {key: event, label: "Запись журнала"}
          - {key: step, label: "Операция"}
          - {key: actor, label: "Кто"}
          - {key: summary, label: "Данные"}
      - {kind: route, title: "Подписи"}
  - {id: test-program,                 title: "Программа и методика испытаний",                               class: input}
  - {id: test-protocol,                title: "Протокол испытаний на герметичность",                          class: record}
  # Эпик 44: предъявление представителю заказчика; ответ ВП — «Заключение ВП» (связанный документ).
  - id: customer-presentation-notice
    title: "Извещение о предъявлении ВП / ПЗ"
    class: decision
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [item.presentation.recorded], per: event, when: {field: presented_to, values: [customer_representative]}}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: data.step_key, label: "Точка приёмки"}
      - {key: data.presentation_no, label: "Предъявление №"}
    route:
      - {stage: 1, title: "Мастер — предъявил", authority_id: source_record, quorum: one, signature_level: 2, paper_allowed: false, by_source: true}
      - {stage: 2, title: "Контролёр ОТК — принято ОТК", role: quality_inspector, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
    layout:
      - kind: fields
        title: "Извещение"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: item.order_id, label: "Задание"}
          - {key: item.lots, label: "Партии"}
          - {key: data.step_key, label: "Точка приёмки"}
          - {key: data.presentation_no, label: "Предъявление №"}
          - {key: data.presented_by, label: "Предъявил"}
          - {key: event.at, label: "Дата предъявления"}
      - {kind: route, title: "Подписи"}
  - id: customer-conclusion
    title: "Заключение ВП (связанный документ)"
    class: decision
    version: 1
    doc_type: generic
    subject: item
    summary:
      - {key: subject, label: "Изделие"}
      - {key: decision, label: "Заключение"}
      - {key: comment, label: "Замечания"}
    route:
      - {stage: 1, title: "Представитель заказчика", role: customer_representative, authority_id: customer_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, external_party: customer_representative}
    layout:
      - kind: fields
        title: "Заключение ВП"
        fields:
          - {key: subject, label: "Объект"}
          - {key: decision, label: "Заключение / что решается"}
          - {key: comment, label: "Содержание"}
          - {key: requested_by, label: "Составил"}
          - {key: requested_at, label: "Дата"}
          - {key: sources, label: "Основания"}
      - {kind: route, title: "Подпись"}
  - id: acceptance-certificate
    title: "Свидетельство о приёмке (паспорт, формуляр)"
    class: decision
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [item.release.recorded], per: event}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: item.item_type_id, label: "Обозначение"}
      - {key: data.warehouse_id, label: "Склад"}
      - {key: data.after_rework, label: "После переделки"}
    route:
      - {stage: 1, title: "Начальник ОТК", role: head_of_qc, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
      - {stage: 2, title: "Руководитель производства", role: production_manager, authority_id: production_manager, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
      - {stage: 3, title: "Представитель заказчика (для МО)", role: customer_representative, authority_id: customer_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, external_party: customer_representative}
    layout:
      - kind: fields
        title: "Свидетельство о приёмке"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: item.order_id, label: "Задание"}
          - {key: item.lots, label: "Партии"}
          - {key: data.warehouse_id, label: "Склад"}
          - {key: data.received_by, label: "Принял на склад"}
          - {key: data.after_rework, label: "После переделки"}
          - {key: data.concession_id, label: "Разрешение на отклонение"}
          - {key: event.at, label: "Дата выпуска"}
      - {kind: route, title: "Подписи"}
  - id: passport
    title: "Паспорт / формуляр изделия"
    class: decision
    version: 1
    doc_type: event_record
    subject: item
    trigger: {events: [item.release.recorded], per: event}
    summary:
      - {key: item.item_id, label: "Изделие"}
      - {key: item.item_type_id, label: "Обозначение"}
      - {key: item.order_id, label: "Задание"}
    route:
      - {stage: 1, title: "Начальник ОТК", role: head_of_qc, authority_id: qc_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation}
      - {stage: 2, title: "Представитель заказчика", role: customer_representative, authority_id: customer_acceptance, quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, external_party: customer_representative}
    layout:
      - kind: fields
        title: "Паспорт изделия"
        fields:
          - {key: item.item_id, label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: item.order_id, label: "Задание"}
