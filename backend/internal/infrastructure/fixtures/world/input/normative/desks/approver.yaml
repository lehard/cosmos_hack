# Стол редкого подписанта (PRD §3a): карточка «Требуется ваше решение» (FR-136).
# Тот же стол у ролей customer_representative и approver — различия задают полномочия, не код.
# Владелец после волны 1 — эпик 11.
version: 1
role: approver
title_key: desks.decisionCard
density: comfortable
help_key: approver # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  - id: decision
    title_key: desks.decisionCard
    layout: main-side
    slots:
      - {id: card, area: main, widget: decision-request-card}
      - {id: passport, area: right, widget: item-passport, slice: {view: compact}}
