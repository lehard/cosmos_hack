# Стол Аудитора ИБ (PRD §3a): целостность и аудит, только чтение. Владелец после волны 1 — эпик 14.
version: 1
role: security_auditor
title_key: desks.integrityAudit
density: compact
help_key: security_auditor # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  # Общий журнал (PRD §3a; AD-2, AD-44; FR-68, FR-140; кейс §7.2): полоса целостности (вердикт верификатора,
  # отпечаток отчёта, голова журнала) и все записи — факты, выводы системы, решения людей, служебные — с источником
  # и статусом подписи; щелчок — окно записи. «Журнал решений» — тот же виджет со срезом entry_kind: decision.
  - id: journal
    title_key: desks.journal
    layout: single
    slots:
      - {id: journal, area: main, widget: journal}
  - id: decisions-journal
    title_key: desks.decisionsJournal
    layout: single
    slots:
      - {id: decisions, area: main, widget: journal, slice: {entry_kind: decision}}
  - id: integrity
    title_key: desks.integrityAudit
    layout: single
    slots:
      - {id: reports, area: main, widget: integrity-reports}
  - id: critical-actions
    title_key: desks.criticalActionsLog
    layout: single
    slots:
      - {id: log, area: main, widget: critical-actions-log}
  - id: security-events
    title_key: audit.securityEvents.title
    layout: single
    slots:
      - {id: events, area: main, widget: security-events}
  - id: grants
    title_key: widgets.grantsHistory
    layout: single
    slots:
      - {id: grants, area: main, widget: grants-history}
  # Реестр документов (эпик 44; FR-65, FR-66, FR-139): все документы по процессам, изделиям, НС, версиям процесса —
  # состояние, кто должен подписать; щелчок — окно документа с маршрутом подписей и кнопками по правам.
  - id: documents
    title_key: docRegistry.tab
    layout: single
    slots:
      - {id: documents, area: main, widget: documents-registry}
