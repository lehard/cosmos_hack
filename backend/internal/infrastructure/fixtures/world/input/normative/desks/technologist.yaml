# Стол технолога (PRD §3a, UI-32): главный объект — расследование. Первый раздел —
# рабочее пространство: слева «Мои расследования», в центре область риска ступенями
# 34 → 13 → 6 и три дорожки «как было дело» (FR-153), справа — гипотезы по двум
# причинам (почему возник / почему не остановили) с «что проверить следующим».
# Разбор причин (группы и общие факторы), меры, процесс, документы — следующие разделы.
# Плотный инженерный вид. Владелец после волны 1 — эпик 12.
version: 1
role: technologist
title_key: desks.causeAnalysis
density: compact
help_key: technologist # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  - id: investigation
    title_key: desks.investigation
    layout: queue-main-side
    slots:
      - {id: investigations, area: left, widget: investigations}
      - {id: scope, area: main, widget: risk-scope}
      - {id: tracks, area: main, widget: circumstances}
      - {id: hypothesis, area: right, widget: hypothesis}
  - id: causes
    title_key: desks.causeAnalysis
    layout: main-side
    slots:
      - {id: groups, area: main, widget: cause-analysis, slice: {group_by: [defect_type, operation, equipment]}}
      - {id: factors, area: right, widget: common-factors}
  # Эпик 42 (FR-64, FR-138): меры и их эффективность — тот же виджет, что у руководителя, плотный вид.
  - id: actions
    title_key: widgets.quality.tab
    layout: single
    slots:
      - {id: actions, area: main, widget: corrective-actions}
  - id: process
    title_key: desks.process
    layout: single
    slots:
      - {id: processes, area: main, widget: process-registry}
  # Реестр документов (эпик 44; FR-65, FR-66, FR-139): все документы по процессам, изделиям, НС, версиям процесса —
  # состояние, кто должен подписать; щелчок — окно документа с маршрутом подписей и кнопками по правам.
  - id: documents
    title_key: docRegistry.tab
    layout: single
    slots:
      - {id: documents, area: main, widget: documents-registry}
