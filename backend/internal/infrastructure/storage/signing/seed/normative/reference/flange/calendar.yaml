# Производственный календарь РФ (FR-55, AD-4): сроки в рабочих днях. Даты — местные (МСК).
# holidays — нерабочие дни сверх субботы и воскресенья: праздники (ТК РФ, ст. 112) и перенесённые выходные;
# working_days — рабочие субботы и воскресенья (перенос); shortened_days — предпраздничные дни на час короче (ст. 95).
# 2026: Постановление Правительства РФ о переносе выходных в 2026 году — 3 января → 9 января, 4 января → 31 декабря;
#       247 рабочих дней. 2027: Постановление от 17.09.2026 № 1187 — 2 января → 5 ноября, 3 января → 31 декабря,
#       20 февраля → 22 февраля (суббота 20 февраля — рабочая). Сокращённые дни 2027 — по ст. 95 ТК РФ [сверить].
