# Шаблоны документов шагов процесса (AD-12, FR-65) — нормативный слой. Шаги ссылаются на них (ant:document/@template).
# Класс: record — генерируется из журнала; decision — черновик + маршрут подписей; input — внешняя запись.
# Полностью описаны (эпик 28, «позвоночник»): сопроводительная карта, заявление о несоответствии, решение по
# несоответствующей продукции, лист утверждения версии процесса, «Запросить решение». Остальные — только объявлены;
# поля, отрисовку и маршруты строит эпик 44 по каталогу документов спайна.
#
# Поля полного шаблона (схема — contracts/normative/templates.schema.json):
#   version   — версия шаблона: template_ref = ‹id›@‹версия›; новая версия шаблона — новый файл templates.v‹N›.yaml;
#   doc_type  — построитель содержимого в domain/documents (traveler, nc_statement, nc_disposition, generic);
#   summary   — поля сводки уровня 2 (3–7), входят в отпечаток;
#   route     — маршрут подписей (AD-13): этапы по порядку; обязательные подписи вычисляет access.RequiredApprovals
#               при черновике и замораживает в каноническом JSON документа (AD-43);
#   layout    — каноническая отрисовка HTML: разделы fields / table / route / text; печатная рамка (QR, дата печати,
#               колонтитул «получено из системы») в отрисовку не входит.
# Полномочия и роли — из normative/policy/policy.v1.yaml. Все составы маршрутов — проектные допущения [ПП].
version: 1
templates:
  - {id: incoming-register,            title: "Журнал регистрации продукции, поступившей на входной контроль", class: record}
  - {id: incoming-inspection-protocol, title: "Протокол входного контроля (снимки — приложение)",            class: record}
  - {id: incoming-inspection-act,      title: "Акт входного контроля",                                        class: record}
  - {id: incoming-results-register,    title: "Журнал результатов входного контроля",                         class: record}
  - {id: lot-conformity-label,         title: "Ярлык соответствия / несоответствия партии (QR)",              class: record}
  - {id: item-tag,                     title: "Бирка изделия с QR",                                           class: record}
  - id: traveler
    title: "Сопроводительная карта изделия"
    class: record
    version: 1
    doc_type: traveler
    subject: item
    summary:
      - {key: item.item_id,   label: "Изделие"}
      - {key: rows_count,     label: "Операций"}
      - {key: otk_count,      label: "Отметок ОТК"}
      - {key: nc_count,       label: "Несоответствий"}
      - {key: final.status,   label: "Итоговая годность"}
    route:
      - {stage: 1, title: "Контролёр ОТК — итоговая годность", role: quality_inspector, authority_id: qc_acceptance, stamp_kind: final,
         quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers, not_item_participant]}
      - {stage: 2, title: "Мастер участка — итоговая годность", role: site_foreman, authority_id: site_foreman,
         quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers]}
    layout:
      - kind: fields
        title: "Изделие"
        fields:
          - {key: item.item_id,              label: "Изделие"}
          - {key: item.item_type_id,         label: "Обозначение ДСЕ"}
          - {key: item.item_revision,        label: "Изменение КД"}
          - {key: item.order_id,             label: "Задание"}
          - {key: item.lots,                 label: "Партии"}
          - {key: item.process_version_hash, label: "Версия техпроцесса"}
      - kind: table
        title: "Операции"
        rows: rows
        columns:
          - {key: no,        label: "№"}
          - {key: operation, label: "Операция"}
          - {key: executor,  label: "Исполнитель"}
          - {key: date,      label: "Дата"}
          - {key: signature, label: "Подпись"}
          - {key: params,    label: "Фактические параметры"}
          - {key: otk,       label: "Отметка ОТК"}
          - {key: remarks,   label: "Отметки"}
      - kind: table
        title: "Несоответствия и разрешения"
        rows: nonconformities
        columns:
          - {key: number,      label: "№ заявления"}
          - {key: status,      label: "Состояние"}
          - {key: disposition, label: "Решение"}
          - {key: concession,  label: "Разрешение на отклонение"}
      - kind: fields
        title: "Итог"
        fields:
          - {key: final.status, label: "Итоговая годность"}
          - {key: final.at,     label: "Дата"}
      - {kind: route, title: "Итоговая годность — подписи"}
      - {kind: text, title: "Происхождение", key: origin}
  - {id: requisition,                  title: "Требование-накладная",                                         class: record}
  - {id: first-article-act,            title: "Акт первой детали",                                            class: record}
  - {id: cmm-protocol,                 title: "Протокол КИМ, карта измерений",                                class: input}
  - {id: presentation-log,             title: "Журнал предъявления ОТК",                                      class: record}
  - {id: route-sheet,                  title: "Маршрутный лист межцеховой передачи",                          class: record}
  - {id: interworkshop-transfer,       title: "Накладная на передачу между цехами",                           class: record}
  - {id: welding-log,                  title: "Журнал сварочных работ",                                       class: record}
  - {id: special-process-log,          title: "Журнал параметров специального процесса",                      class: record}
  - {id: ndt-conclusion,               title: "Заключение неразрушающего контроля",                           class: input}
  - {id: assembly-card,                title: "Карта сборки (отметки скрытых работ)",                         class: record}
  - {id: torque-log,                   title: "Журнал затяжек",                                               class: record}
  - {id: intervention-record,          title: "Запись вмешательства (вскрытия)",                              class: record}
  - {id: test-program,                 title: "Программа и методика испытаний",                               class: input}
  - {id: test-protocol,                title: "Протокол испытаний на герметичность",                          class: record}
  - {id: customer-presentation-notice, title: "Извещение о предъявлении ВП / ПЗ",                           class: decision}
  - {id: acceptance-certificate,       title: "Свидетельство о приёмке (паспорт, формуляр)",                  class: decision}
  - {id: passport,                     title: "Паспорт / формуляр изделия",                                   class: decision}
  - {id: isolator-log,                 title: "Журнал изолятора",                                             class: record}
  - {id: nc-label,                     title: "Ярлык «Брак» / НП (QR)",                                       class: record}
  - id: nc-statement
    title: "Заявление о несоответствии"
    class: record
    version: 1
    doc_type: nc_statement
    subject: nonconformity
    summary:
      - {key: nc.number,      label: "Заявление"}
      - {key: item.item_id,   label: "Изделие"}
      - {key: nc.requirement, label: "Требование"}
      - {key: nc.fact,        label: "Факт"}
      - {key: nc.severity,    label: "Значимость"}
    route:
      - {stage: 1, title: "Обнаруживший", authority_id: nc_detection, quorum: one, signature_level: 1, paper_allowed: false, by_source: true}
      - {stage: 2, title: "Контролёр качества подтверждает", role: quality_inspector, authority_id: qc_acceptance,
         quorum: one, signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, by_source: true}
    layout:
      - kind: fields
        title: "Заявление"
        fields:
          - {key: nc.number,       label: "Номер"}
          - {key: item.item_id,    label: "Изделие"}
          - {key: item.item_type_id, label: "Обозначение ДСЕ"}
          - {key: nc.found_at,     label: "Обнаружено"}
          - {key: nc.found_by,     label: "Кто обнаружил"}
          - {key: nc.stage,        label: "Этап (операция)"}
          - {key: nc.requirement,  label: "Требование"}
          - {key: nc.fact,         label: "Факт"}
          - {key: nc.severity,     label: "Значимость"}
          - {key: nc.defect_type,  label: "Вид дефекта"}
          - {key: nc.evidence,     label: "Доказательства"}
          - {key: nc.confirmed_by, label: "Подтвердил"}
          - {key: nc.confirmed_at, label: "Дата подтверждения"}
          - {key: nc.reason,       label: "Основание"}
      - {kind: route, title: "Подписи"}
  - id: nc-disposition
    title: "Решение по несоответствующей продукции"
    class: decision
    version: 1
    doc_type: nc_disposition
    subject: nonconformity
    summary:
      - {key: nc.number,           label: "Несоответствие"}
      - {key: item.item_id,        label: "Изделие"}
      - {key: decision.label,      label: "Решение"}
      - {key: decision.concession, label: "Разрешение на отклонение"}
      - {key: decision.reason,     label: "Основание"}
    route:
      - {stage: 1, title: "Автор решения (контролёр качества)", authority_id: nc_disposition, quorum: one, signature_level: 2,
         paper_allowed: false, by_source: true, separation: [distinct_signers]}
      - {stage: 2, title: "Технолог", role: technologist, authority_id: nc_disposition, quorum: one, signature_level: 2,
         paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers], when: {decisions: [repair, use_as_is]}}
      - {stage: 3, title: "Начальник ОТК", role: head_of_qc, authority_id: nc_disposition, quorum: one, signature_level: 2,
         paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers], when: {decisions: [repair, use_as_is]}}
      - {stage: 4, title: "Представитель заказчика", role: customer_representative, authority_id: customer_acceptance, quorum: one,
         signature_level: 2, paper_allowed: true, attester_authority_id: paper_attestation, external_party: customer_representative,
         separation: [distinct_signers], when: {customer_acceptance: true}}
    layout:
      - kind: fields
        title: "Решение"
        fields:
          - {key: nc.number,           label: "Несоответствие"}
          - {key: item.item_id,        label: "Изделие"}
          - {key: nc.requirement,      label: "Требование"}
          - {key: nc.severity,         label: "Значимость"}
          - {key: decision.label,      label: "Решение"}
          - {key: decision.scrap_kind, label: "Вид списания"}
          - {key: decision.concession, label: "Разрешение на отклонение"}
          - {key: decision.claim,      label: "Основание претензии"}
          - {key: decision.reason,     label: "Основание"}
          - {key: decision.author,     label: "Автор решения"}
          - {key: decision.at,         label: "Дата решения"}
      - {kind: route, title: "Подписи маршрута"}
  - {id: scrap-act,                    title: "Акт о браке",                                                  class: decision}
  - {id: concession,                   title: "Разрешение на отклонение",                                     class: decision}
  - id: process-version-approval
    title: "Лист утверждения версии процесса"
    class: decision
    version: 1
    doc_type: generic
    subject: process_version
    summary:
      - {key: subject,  label: "Версия процесса"}
      - {key: decision, label: "Что утверждается"}
      - {key: comment,  label: "Читаемая разница"}
    route:
      - {stage: 1, title: "Технолог-автор", role: technologist, authority_id: quorum_signature, quorum: one, signature_level: 2, paper_allowed: false, separation: [distinct_signers]}
      - {stage: 2, title: "Контролёр качества (кворум)", role: quality_inspector, authority_id: quorum_signature, quorum: one, signature_level: 2, paper_allowed: false, separation: [distinct_signers]}
      - {stage: 3, title: "Руководитель производства (кворум)", role: production_manager, authority_id: quorum_signature, quorum: one, signature_level: 2, paper_allowed: false, separation: [distinct_signers]}
    layout:
      - kind: fields
        title: "Лист утверждения"
        fields:
          - {key: subject,        label: "Версия процесса"}
          - {key: decision,       label: "Что утверждается"}
          - {key: comment,        label: "Читаемая разница"}
          - {key: requested_by,   label: "Запросил"}
          - {key: requested_at,   label: "Дата запроса"}
          - {key: sources,        label: "Основания"}
      - {kind: route, title: "Подписи кворума"}
  - id: decision-request
    title: "Запрос решения уполномоченного"
    class: decision
    version: 1
    doc_type: generic
    subject: other
    summary:
      - {key: subject,  label: "Объект"}
      - {key: decision, label: "Что решается"}
      - {key: comment,  label: "Комментарий"}
    route:
      - {stage: 1, title: "Начальник ОТК", role: head_of_qc, authority_id: nc_disposition, quorum: one, signature_level: 2,
         paper_allowed: true, attester_authority_id: paper_attestation, separation: [distinct_signers]}
    layout:
      - kind: fields
        title: "Запрос решения"
        fields:
          - {key: subject,      label: "Объект"}
          - {key: decision,     label: "Что решается"}
          - {key: comment,      label: "Комментарий"}
          - {key: requested_by, label: "Запросил"}
          - {key: requested_at, label: "Дата запроса"}
          - {key: sources,      label: "Основания"}
      - {kind: route, title: "Подписи"}
  # Эпик 26: «Выдача ролей, полномочий, клейм» (каталог документов спайна). Решение — строка
  # grant:‹вид›:‹роль|полномочие|клеймо›:‹кому›:‹область› (access.FormatGrantDecision); этап второй подписи выбирает
  # сфера выдачи (access.Assess по эффективным правам). Маршрут совпадает с grant_route normative/policy (тест).
  # Выдачу по закрытому маршруту исполняет access.policy.grant с document_id.
  - id: policy-grant
    title: "Выдача ролей, полномочий, клейм"
    class: decision
    version: 1
    doc_type: generic
    subject: policy
    summary:
      - {key: subject,      label: "Кому"}
      - {key: decision,     label: "Что выдаётся"}
      - {key: requested_by, label: "Инициатор"}
      - {key: comment,      label: "Основание"}
    route:
      - {stage: 1, title: "Начальник ОТК — вторая подпись", authority_id: second_signature_qc, quorum: one, signature_level: 2, paper_allowed: false, separation: [distinct_signers], when: {grant_domains: [qc]}}
      - {stage: 2, title: "Руководитель производства — вторая подпись", authority_id: second_signature_production, quorum: one, signature_level: 2, paper_allowed: false, separation: [distinct_signers], when: {grant_domains: [production]}}
      - {stage: 3, title: "Аудитор ИБ — вторая подпись", authority_id: second_signature_audit, quorum: one, signature_level: 2, paper_allowed: false, separation: [distinct_signers], when: {grant_domains: [admin]}}
    layout:
      - kind: fields
        title: "Выдача ролей, полномочий, клейм"
        fields:
          - {key: subject,      label: "Кому"}
          - {key: decision,     label: "Что выдаётся"}
          - {key: comment,      label: "Основание"}
          - {key: requested_by, label: "Инициатор (администратор безопасности)"}
          - {key: requested_at, label: "Дата запроса"}
      - {kind: route, title: "Вторая подпись независимой стороны"}
  # Эпик 26 (PRD §11.18, FR-81): «Назначение контролёра на пост» — запрос мастера участка (сам запрос документа) →
  # согласование пользователя с полномочием начальника ОТК. Решение — quality_inspector:‹кто›@‹смена›, объект — пост.
  # Назначение по закрытому маршруту исполняет access.assignment.set с approval_document_id.
  - id: controller-assignment
    title: "Назначение контролёра на пост"
    class: decision
    version: 1
    doc_type: generic
    subject: other
    summary:
      - {key: subject,      label: "Пост"}
      - {key: decision,     label: "Кто и в какую смену"}
      - {key: requested_by, label: "Мастер"}
      - {key: comment,      label: "Комментарий"}
    route:
      - {stage: 1, title: "Начальник ОТК — согласование", role: head_of_qc, authority_id: controller_assignment_approval, quorum: one, signature_level: 2,
         paper_allowed: false, separation: [distinct_signers]}
    layout:
      - kind: fields
        title: "Назначение контролёра на пост"
        fields:
          - {key: subject,      label: "Пост"}
          - {key: decision,     label: "Кто и в какую смену"}
          - {key: comment,      label: "Комментарий"}
          - {key: requested_by, label: "Запросил мастер"}
          - {key: requested_at, label: "Дата запроса"}
      - {kind: route, title: "Согласование ОТК"}
