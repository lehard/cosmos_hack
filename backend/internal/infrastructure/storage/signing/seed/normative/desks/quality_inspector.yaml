# Стол контролёра качества (PRD §3a, Д-70): очередь «Ждут моего решения» во всю ширину;
# щелчок по строке открывает справа окно записи — карточка несоответствия, паспорт изделия
# и кнопки решения внизу окна (app/record). Виджетов «под списком» нет.
# Владелец после волны 1 — эпик 11.
version: 1
role: quality_inspector
title_key: desks.decisionQueue
density: comfortable
help_key: quality_inspector # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  - id: queue
    title_key: desks.decisionQueue
    layout: single
    slots:
      - {id: queue, area: main, widget: decision-queue, slice: {sort: [risk, deadline]}}
