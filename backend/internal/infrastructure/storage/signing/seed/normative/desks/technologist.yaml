# Стол технолога (PRD §3a): разбор причин, общие факторы, разбор обстоятельств, область риска, процесс.
# Плотный инженерный вид. Владелец после волны 1 — эпик 12.
#
# Разбор обстоятельств (FR-153): под тремя дорожками — таблица общих факторов
# (тот же виджет, что на вкладке «Разбор причин», — одна правда, разные взгляды),
# справа — гипотезы с доводами «за / против» и похожие случаи; вход из строки
# общих факторов в гипотезу — на той же вкладке.
version: 1
role: technologist
title_key: desks.causeAnalysis
density: compact
help_key: technologist # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  - id: causes
    title_key: desks.causeAnalysis
    layout: main-side
    slots:
      - {id: groups, area: main, widget: cause-analysis, slice: {group_by: [defect_type, operation, equipment]}}
      - {id: factors, area: right, widget: common-factors}
  - id: circumstances
    title_key: desks.circumstances
    layout: main-side
    slots:
      - {id: tracks, area: main, widget: circumstances}
      - {id: tracks-factors, area: main, widget: common-factors}
      - {id: hypothesis, area: right, widget: hypothesis}
  - id: risk
    title_key: riskScope.title
    layout: single
    slots:
      - {id: scope, area: main, widget: risk-scope}
  - id: process
    title_key: desks.process
    layout: single
    slots:
      - {id: versions, area: main, widget: process-versions, slice: {mode: diff}}
