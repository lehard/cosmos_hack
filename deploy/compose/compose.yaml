# Демо-стенд ant: `docker compose up` из корня репозитория (AD-25, FR-109).
#
# Порядок запуска: secrets-init (пароль БД в том, один раз) → postgres →
# migrate (разовая роль: схемы journal, engine, ingest, fixtures) → ant (роли api, worker,
# crossitem, projector, stands в одном процессе — делят пул и LISTEN; фронтенд встроен).
# ant входит в БД как ant_admin и работает ролью ant_app (SET ROLE, AD-1).
# trust-init (разово: ключи хранителя и верификатора, trust-anchors, демо-УЦ
# mTLS, KEK) → keeper (хранитель контрольных точек, свой том) → verifier
# (независимый верификатор по расписанию, роль БД ant_verifier) — эпик 29.
# Подделка в обход системы — make tamper (служба tamper, профиль tools).
# Следующие эпики добавляют сюда init (ключи, генезис), отдельные ant-worker ×N
# (нагрузочный профиль, эпик 35), edge-agent, demo-signer.
# Пересборка проекций — make rebuild [ITEM=‹item_id›].
#
# Память — под ~2,4 ГБ на всю систему (спайн, AD-25). Сейчас занято:
#   postgres 768 МБ + ant 384 МБ + keeper 48 МБ + verifier 256 МБ (+ разовые
#   secrets-init 32 МБ, trust-init 32 МБ, migrate 128 МБ);
#   остаток ~0,9 ГБ — воркерам и stand-ам.
#
# Переменные (необязательно): ANT_PROFILE (fixtures | demo | load | prod),
# ANT_HTTP_PORT (порт на машине, по умолчанию 8480), ANT_HTTP_BIND
# (по умолчанию 127.0.0.1 — закрытый контур), ANT_IMAGE, ANT_VERSION.

x-ant-image: &ant-image
  image: ${ANT_IMAGE:-ant:local}
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
    args:
      VERSION: ${ANT_VERSION:-dev}
    labels:
      ant.project: ant

x-ant-env: &ant-env
  ANT_PROFILE: ${ANT_PROFILE:-demo}
  ANT_DB_HOST: postgres
  ANT_DB_USER: ant_admin
  ANT_DB_NAME: ant
  ANT_DB_PASSWORD_FILE: /run/ant-secrets/ant/db_password
  # Доверие (эпик 29): хранитель по mTLS, KEK шифрования при хранении.
  ANT_SECURITY_KEEPER_URL: https://keeper:8444

x-ant-common: &ant-common
  environment: *ant-env
  volumes:
    - secrets:/run/ant-secrets:ro
    - ../config/ant.yaml:/etc/ant/ant.yaml:ro
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  labels:
    ant.project: ant

services:
  secrets-init:
    image: ${ANT_PG_IMAGE:-postgres:18.6-alpine}
    entrypoint: ["/bin/sh", "/init/secrets-init.sh"]
    volumes:
      - secrets:/secrets
      - ./secrets-init.sh:/init/secrets-init.sh:ro
    network_mode: none
    mem_limit: 32m
    restart: "no"
    labels:
      ant.project: ant

  postgres:
    image: ${ANT_PG_IMAGE:-postgres:18.6-alpine}
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ant_admin
      POSTGRES_DB: ant
      POSTGRES_PASSWORD_FILE: /run/ant-secrets/postgres/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
    volumes:
      - pgdata:/var/lib/postgresql
      - secrets:/run/ant-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ant_admin -d ant"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    mem_limit: 768m
    shm_size: 128m
    restart: unless-stopped
    labels:
      ant.project: ant

  migrate:
    <<: [*ant-image, *ant-common]
    command: ["-role=migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      # Затравка паспортов анализаторов пишет в журнал — уже с KEK (эпик 29).
      trust-init:
        condition: service_completed_successfully
    volumes:
      - secrets:/run/ant-secrets:ro
      - ../config/ant.yaml:/etc/ant/ant.yaml:ro
      - kek:/var/lib/ant-kek:ro
    mem_limit: 128m
    restart: "no"

  # Разовая подготовка доверия (эпик 29; до эпика 05 «ant init»): ключи
  # хранителя и верификатора (hybrid: ГОСТ + ML-DSA-65), trust-anchors, демо-УЦ
  # mTLS и сертификаты ant, verifier, tamper, KEK шифрования при хранении.
  # Повтор ничего не перезаписывает. Сети нет.
  trust-init:
    <<: *ant-image
    entrypoint: ["/keeper"]
    command: ["-init", "-data", "/var/lib/keeper", "-init-verifier", "/var/lib/verifier", "-init-ant", "/var/lib/ant-pki",
              "-init-tamper", "/var/lib/ant-tamper", "-init-kek", "/var/lib/ant-kek/kek"]
    volumes:
      - keeper-data:/var/lib/keeper
      - verifier-data:/var/lib/verifier
      - ant-pki:/var/lib/ant-pki
      - tamper-pki:/var/lib/ant-tamper
      - kek:/var/lib/ant-kek
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    restart: "no"
    labels:
      ant.project: ant

  # Хранитель контрольных точек (AD-8, AD-46): свой том, mTLS; принимает
  # головы обеих цепочек со звеньями, подписывает точки hybrid, сам поднимает
  # тревогу при молчании сервера дольше 2N. N — policy.audit.* (TODO(26): из
  # журнала; пока ANT_KEEPER_INTERVAL = security.interval ant).
  keeper:
    <<: *ant-image
    entrypoint: ["/keeper"]
    environment:
      ANT_KEEPER_INTERVAL: 10s
    depends_on:
      trust-init:
        condition: service_completed_successfully
    volumes:
      - keeper-data:/var/lib/keeper
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/keeper", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    mem_limit: 48m
    restart: unless-stopped
    labels:
      ant.project: ant

  # Независимый верификатор (AD-9, AD-46): роль БД ant_verifier (только
  # чтение), trust-anchors и ключ — свой том, контрольные точки — у хранителя;
  # отчёт подписывает и сдаёт хранителю. make verify — проверка по запросу.
  verifier:
    <<: [*ant-image, *ant-common]
    entrypoint: ["/verifier"]
    command: []
    depends_on:
      migrate:
        condition: service_completed_successfully
      keeper:
        condition: service_healthy
    volumes:
      - secrets:/run/ant-secrets:ro
      - ../config/ant.yaml:/etc/ant/ant.yaml:ro
      - verifier-data:/var/lib/verifier:ro
      - kek:/var/lib/ant-kek:ro
    # Живость: ключи и trust-anchors читаются (HTTP у верификатора нет;
    # отказ проверки виден в его журнале и в отчётах у хранителя).
    healthcheck:
      test: ["CMD", "/verifier", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    mem_limit: 256m
    restart: unless-stopped

  # Демо-инструмент подделки в обход системы (AD-28, make tamper): подключение
  # суперпользователя БД; только профили fixtures и demo. Не запускается
  # docker compose up — только make tamper (профиль tools).
  tamper:
    <<: [*ant-image, *ant-common]
    entrypoint: ["/tamper"]
    command: []
    profiles: [tools]
    healthcheck:
      disable: true
    volumes:
      - secrets:/run/ant-secrets:ro
      - ../config/ant.yaml:/etc/ant/ant.yaml:ro
      - kek:/var/lib/ant-kek:ro
    mem_limit: 64m
    restart: "no"

  ant:
    <<: [*ant-image, *ant-common]
    # stands — stand-ы и раннер прогонов симуляции (эпики 06, 30, 32, 16): пульт
    # сценариев держит прогоны в памяти процесса api, поэтому в том же процессе.
    # security — эпик 29: головы хранителю, отчёты верификатора, шина безопасности.
    command: ["-role=api,worker,crossitem,projector,scheduler,outbox,stands,security"]
    environment:
      <<: *ant-env
      ANT_SECURITY_EXPORT_FILE: /var/lib/ant-export/security-events.jsonl
    depends_on:
      migrate:
        condition: service_completed_successfully
      # KEK и сертификат mTLS должны быть до первой записи журнала (AD-23).
      trust-init:
        condition: service_completed_successfully
    ports:
      - "${ANT_HTTP_BIND:-127.0.0.1}:${ANT_HTTP_PORT:-8480}:8080"
      - "${ANT_HTTP_BIND:-127.0.0.1}:${ANT_STANDS_PORT:-8491}:8491"
    volumes:
      - secrets:/run/ant-secrets:ro
      - ../config/ant.yaml:/etc/ant/ant.yaml:ro
      # Хранилище материалов по адресу содержимого (materials.dir, AD-23).
      - materials:/var/lib/ant/materials
      # Каталог обмена с Галактикой (erp.galaktika.dir, эпик 43): корень ФС
      # только для чтения — out/ ack/ in/ in-ack/ about.xml пишут роль outbox
      # (адаптер) и роль stands (stand Галактики) в этом томе.
      - exchange:/var/lib/ant/exchange
      # Доверие (эпик 29): сертификат mTLS, KEK (только чтение), экспорт шины
      # безопасности во внешний мониторинг ИБ (JSON-строки).
      - ant-pki:/var/lib/ant-pki:ro
      - kek:/var/lib/ant-kek:ro
      - security-export:/var/lib/ant-export
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "/ant", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 384m
    restart: unless-stopped

volumes:
  pgdata:
    labels:
      ant.project: ant
  materials:
    labels:
      ant.project: ant
  exchange:
    labels:
      ant.project: ant
  secrets:
    labels:
      ant.project: ant
  keeper-data:
    labels:
      ant.project: ant
  verifier-data:
    labels:
      ant.project: ant
  ant-pki:
    labels:
      ant.project: ant
  tamper-pki:
    labels:
      ant.project: ant
  kek:
    labels:
      ant.project: ant
  security-export:
    labels:
      ant.project: ant
