# Конфигурация процессов ant (AD-25).
#
# Порядок наложения: defaults → profiles.<профиль> → переменные ANT_*.
# Имя переменной — путь ключа через «_» в верхнем регистре:
#   http.addr → ANT_HTTP_ADDR, db.password_file → ANT_DB_PASSWORD_FILE.
# Профиль выбирает ANT_PROFILE (fixtures | demo | load | prod), иначе ключ profile.
#
# Секретов здесь и в ANT_* нет: пароль БД и ключи — только файлами в томах
# с правами 0400; переменная указывает путь.
# Параметры аудита — не конфигурация, а данные журнала (AD-15).

profile: demo

defaults:
  log:
    level: info
  http:
    addr: ":8080"
    read_header_timeout: 5s
    shutdown_timeout: 15s
    max_body_bytes: 10485760 # 10 МиБ
  db:
    host: postgres
    port: 5432
    name: ant
    user: ant_admin
    password_file: /run/ant-secrets/ant/db_password
    sslmode: disable
    max_conns: 10
    connect_timeout: 5s
  ports:
    mode: live # fixtures | live (AD-36)
    # Переопределение режима по модулю — вертикальные срезы (AD-36), например:
    # modules: {quality: live, nonconformity: live}
    modules: {}
    # Адаптеры ведомых портов платформы по ключам AD-35 (application/platform.PortKeys).
    adapters:
      journal_store: postgres
      lease_store: postgres
      material_store: volume
      work_feed: postgres
      publisher: http
      telemetry: prometheus
      signer: demo_signer
      verifier: gogost
      cipher: gogost
      access_control: casbin     # эпик 08: Casbin над проекцией политики из журнала; permissive — заглушка волны 1
      identity_provider: local   # эпик 08: логин и пароль (argon2id), сеансы scs в Postgres; в fixtures и demo — ещё демо-персоны без пароля; demo — только демо-персоны без базы
      domain_clock: system
      infra_clock: system
      fixture_cursor: postgres
      consumer: postgres
  engine:
    partitions: 16 # P — фиксированные партиции по изделию (AD-6); одно P у приёма и движка
    fold_parallelism: 2
    lease_ttl: 10s # аренды партиций и ролей-лидеров по InfraClock, продление каждые TTL/3 (AD-6)
  materials:
    dir: /var/lib/ant/materials # том хранилища материалов по адресу содержимого (AD-23)
  journal:
    batch_max: 256 # K записей в пачке journal.Append (AD-44)
    batch_wait: 50ms
  integrations:
    enabled: [] # stand-ы внешних систем включают эпики 30, 31, 33
  # Каналы обмена с учётными системами (эпик 30, AD-18). Канал 1С работает,
  # если onec есть в integrations.enabled; роль outbox отправляет, роль stands
  # держит stand 1С (/stand/1c/). Реальная 1С — сменой base_url.
  erp:
    onec:
      base_url: "http://127.0.0.1:8491/stand/1c/erp" # stand 1С роли stands на этом хосте
      user: ""
      password_file: ""
      enterprise: ENT01
      stand: true
      timeout: 10s
      poll: 1s        # опрос очереди исходящих
      recheck: 5m     # сверка $metadata и версии qc при ok (при degraded — чаще)
      pull_every: 30s # опрос заданий, номенклатуры и партий
      retry_max: 8    # попыток при транспортных ошибках: 1 с, 5 с, 30 с, 2 мин, 10 мин, далее 30 мин; затем карантин
  # Доверие (эпик 29): хранитель, верификатор, шифрование при хранении, шина
  # безопасности. Интервалы и порог — параметры аудита policy.audit.*: пока нет
  # записи policy.audit.parameters_set, подписанной Аудитором ИБ (эпик 26), — здесь.
  security:
    keeper_url: "" # https://keeper:8444 в compose; пусто — хранителя нет
    pki_dir: /var/lib/ant-pki/pki # сертификат mTLS ant (выпускает keeper -init)
    kek_file: /var/lib/ant-kek/kek # KEK (AD-23); файла нет — блок записи открыт
    interval: 10s # N — головы хранителю
    verifier_interval: 30s # проверки верификатора; индикатор желтеет через 2 интервала
    max_gap: 5m # предельная задержка передачи записи хранителю
    late_write: 10m # порог «задержки записи» факта устройства
    export_file: "" # экспорт шины безопасности (JSON-строки); в compose — том
  # Роль stands (эпик 06, AD-18): stand-ы внешних систем и оборудования,
  # служебный порт сбоев /stand/_control/.
  stands:
    addr: ":8491"
    edge_url: "" # локальный вход edge-агента; пусто — stand оборудования IS-1 выключен
    interval: 5s # период телеметрии stand-а оборудования

profiles:
  # Заготовки за ведущими портами: интерфейс целиком на мире заготовок (AD-36).
  fixtures:
    ports:
      mode: fixtures
      # Живой вход поверх заготовок: приём пишет в настоящий журнал, движок
      # сворачивает, SSE присылает изменения вместе со сменой шага курсора.
      modules: {ingest: live}
    log:
      level: debug

  # Демо и проверка жюри: docker compose up на одной машине, офлайн.
  demo:
    ports:
      mode: live
    # integrations.enabled — список stand-ов заполняют эпики интеграций.
    integrations:
      enabled: [onec] # эпик 30: обмен с stand-ом 1С (роли outbox и stands)

  # Нагрузочный прогон: больше партиций и параллелизма, ant-worker ×N (FR-107).
  load:
    ports:
      mode: live
    log:
      level: warn
    engine:
      partitions: 64
      fold_parallelism: 4
    db:
      max_conns: 30
    journal:
      batch_max: 1024

  # Промышленный (описание): TLS к БД, внешний УЦ, k8s — см. deploy/k8s.
  prod:
    ports:
      mode: live
    log:
      level: info
    engine:
      partitions: 64
