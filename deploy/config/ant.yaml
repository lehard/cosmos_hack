# Конфигурация процессов ant (AD-25).
#
# Порядок наложения: defaults → profiles.<профиль> → переменные ANT_*.
# Имя переменной — путь ключа через «_» в верхнем регистре:
#   http.addr → ANT_HTTP_ADDR, db.password_file → ANT_DB_PASSWORD_FILE.
# Профиль выбирает ANT_PROFILE (fixtures | demo | load | prod), иначе ключ profile.
#
# Секретов здесь и в ANT_* нет: пароль БД и ключи — только файлами в томах
# с правами 0400; переменная указывает путь.
# Параметры аудита — не конфигурация, а данные журнала (AD-15).

profile: demo

defaults:
  log:
    level: info
  http:
    addr: ":8080"
    read_header_timeout: 5s
    shutdown_timeout: 15s
    max_body_bytes: 10485760 # 10 МиБ
  db:
    host: postgres
    port: 5432
    name: ant
    user: ant_admin
    password_file: /run/ant-secrets/ant/db_password
    sslmode: disable
    max_conns: 10
    connect_timeout: 5s
  ports:
    mode: live # fixtures | live (AD-36)
    # Переопределение режима по модулю — вертикальные срезы (AD-36), например:
    # modules: {quality: live, nonconformity: live}
    modules: {}
    # Адаптеры ведомых портов платформы по ключам AD-35 (application/platform.PortKeys).
    adapters:
      journal_store: postgres
      lease_store: postgres
      material_store: volume
      work_feed: postgres
      publisher: http
      telemetry: prometheus
      signer: demo_signer
      verifier: gogost
      cipher: gogost
      access_control: casbin     # эпик 08: Casbin над проекцией политики из журнала; permissive — заглушка волны 1
      identity_provider: local   # эпик 08: логин и пароль (argon2id), сеансы scs в Postgres; в fixtures и demo — ещё демо-персоны без пароля; demo — только демо-персоны без базы
      domain_clock: system
      infra_clock: system
      fixture_cursor: postgres
      consumer: postgres
  engine:
    partitions: 16 # P — фиксированные партиции по изделию (AD-6); одно P у приёма и движка
    fold_parallelism: 2
    lease_ttl: 10s # аренды партиций и ролей-лидеров по InfraClock, продление каждые TTL/3 (AD-6)
  materials:
    dir: /var/lib/ant/materials # том хранилища материалов по адресу содержимого (AD-23)
  journal:
    batch_max: 256 # K записей в пачке journal.Append (AD-44)
    batch_wait: 50ms
  integrations:
    enabled: [] # stand-ы внешних систем включают эпики 30, 31, 33
  # Каналы обмена с учётными системами (эпик 30, AD-18). Канал 1С работает,
  # если onec есть в integrations.enabled; роль outbox отправляет, роль stands
  # держит stand 1С (/stand/1c/). Реальная 1С — сменой base_url.
  erp:
    # Какая из установленных учётных систем ведёт учётный обмен (onec | galaktika;
    # пусто — galaktika, если она в integrations.enabled, иначе onec). Эпик 43:
    # переключение на Галактику — ANT_ERP_LEDGER=galaktika и перезапуск ant.
    ledger: ""
    onec:
      base_url: "http://127.0.0.1:8491/stand/1c/erp" # stand 1С роли stands на этом хосте
      user: ""
      password_file: ""
      enterprise: ENT01
      stand: true
      timeout: 10s
      poll: 1s        # опрос очереди исходящих
      recheck: 5m     # сверка $metadata и версии qc при ok (при degraded — чаще)
      pull_every: 30s # опрос заданий, номенклатуры и партий
      retry_max: 8    # попыток при транспортных ошибках: 1 с, 5 с, 30 с, 2 мин, 10 мин, далее 30 мин; затем карантин
    # Галактика ERP (эпик 31, gal.qc.v1): работает вместо 1С, если galaktika есть
    # в integrations.enabled и её выбирает erp.ledger (одна учётная система на
    # экземпляр, docs/new-adapter.md). Stand Галактики (эпик 43) — роль stands:
    # обрабатывает тот же каталог обмена (том exchange в compose) и REST-фасад.
    galaktika:
      transport: exchange-dir # exchange-dir | rest-facade
      dir: /var/lib/ant/exchange/galaktika # out/ ack/ in/ in-ack/ about.xml
      base_url: ""    # для rest-facade: http(s)://‹хост›/galaktika/esb/v1; пусто со stand: true — /stand/galaktika/esb/v1 этого хоста
      node: ant       # наш узел обмена
      peer: ""        # узел Галактики; пусто — из about
      database: ""    # база Галактики для внешних ID; пусто — из about
      enterprise: ENT01
      user: ""
      password_file: "" # секрет — только файлом
      stand: false    # true — на месте Галактики stand роли stands (эпик 43; в prod запрещён)
      timeout: 10s
      poll: 1s        # опрос очереди исходящих
      recheck: 5m     # сверка about
      pull_every: 30s # опрос входящих пакетов
      retry_max: 8    # для exchange-dir: ожидание квитанции ≈ 70 мин, затем карантин
  # Канал MES (эпик 31, B2MML-JSON mes.isa95.v1): работает, если mes есть в
  # integrations.enabled и задан base_url (или stand: true — stand MES роли
  # stands, эпик 43: /stand/mes/b2mml, страница /stand/mes/).
  mes:
    b2mml:
      base_url: ""    # http(s)://‹хост›/b2mml; пусто со stand: true — stand этого хоста
      logical_id: ant
      user: ""
      password_file: ""
      stand: false
      timeout: 10s
      poll: 1s        # отправка блоков
      recheck: 5m     # сверка /about при ok
      pull_every: 30s # опрос заданий и событий операций
      retry_max: 8    # транспортных попыток на блок
  # СКУД (эпик 37, FR-82): журнал проходов по протоколу skud.v1; работает, если
  # skud есть в integrations.enabled; роль outbox опрашивает, роль stands держит
  # stand СКУД (/stand/skud/ — страница с кнопками проходов). Реальная СКУД — сменой base_url.
  access:
    skud:
      base_url: "" # пусто — stand этого хоста (stands.addr)
      stand: true
      timeout: 5s
      poll: 1s   # опрос журнала проходов: панель «Посты» меняется за 1–2 с (FR-6)
      check: 30s # проверка «по графику должен быть, ключа нет» (FR-84)
  # Доверие (эпик 29): хранитель, верификатор, шифрование при хранении, шина
  # безопасности. Интервалы и порог — параметры аудита policy.audit.*: пока нет
  # записи policy.audit.parameters_set, подписанной Аудитором ИБ (эпик 26), — здесь.
  security:
    keeper_url: "" # https://keeper:8444 в compose; пусто — хранителя нет
    pki_dir: /var/lib/ant-pki/pki # сертификат mTLS ant (выпускает keeper -init)
    kek_file: /var/lib/ant-kek/kek # KEK (AD-23); файла нет — блок записи открыт
    interval: 10s # N — головы хранителю
    verifier_interval: 30s # проверки верификатора; индикатор желтеет через 2 интервала
    max_gap: 5m # предельная задержка передачи записи хранителю
    late_write: 10m # порог «задержки записи» факта устройства
    export_file: "" # экспорт шины безопасности (JSON-строки); в compose — том
  # Роль stands (эпик 06, AD-18): stand-ы внешних систем и оборудования,
  # служебный порт сбоев /stand/_control/.
  stands:
    addr: ":8491"
    edge_url: "" # локальный вход edge-агента; пусто — stand оборудования IS-1 выключен
    interval: 5s # период телеметрии stand-а оборудования
    # Пульт тестовых сценариев (эпики 32, 16): каталог scenarios/ в образе;
    # пусто — симуляция выключена (операции simulation — 501).
    scenarios: /etc/ant/scenarios
    tick: 500ms # период раннера прогонов

profiles:
  # Заготовки за ведущими портами: интерфейс целиком на мире заготовок (AD-36).
  fixtures:
    ports:
      mode: fixtures
      # Живой вход поверх заготовок: приём пишет в настоящий журнал, движок
      # сворачивает, SSE присылает изменения вместе со сменой шага курсора.
      modules: {ingest: live}
    log:
      level: debug

  # Демо и проверка жюри: docker compose up на одной машине, офлайн.
  demo:
    ports:
      mode: live
    # Эпик 35 (прогон MS-1): десятки потребителей проектора в одном процессе —
    # пул больше 10, иначе они ждут соединения; фиксации не ждут сброса WAL
    # на диск (db.synchronous_commit, docs/scaling.md §8).
    db:
      max_conns: 24
      synchronous_commit: "off"
    # integrations.enabled — список stand-ов заполняют эпики интеграций.
    integrations:
      # эпик 30: обмен с stand-ом 1С; эпик 37: stand СКУД; эпик 43: stand-ы
      # Галактики и MES (роли outbox и stands); эпик 41: партнёры федерации (выписки паспорта).
      enabled: [onec, skud, galaktika, mes, partner]
    # Эпик 43: учётный обмен ведёт 1С; Галактика установлена stand-ом —
    # «Проверить соединение» работает, переключение — ANT_ERP_LEDGER=galaktika.
    erp:
      ledger: onec
      galaktika:
        stand: true
    # Эпик 43: блоки ОТК уходят в stand MES (mes.hold.requested → ConfirmBOD).
    mes:
      b2mml:
        stand: true

  # Нагрузочный прогон: больше партиций и параллелизма, ant-worker ×N (FR-107).
  load:
    ports:
      mode: live
    log:
      level: warn
    engine:
      partitions: 64
      fold_parallelism: 4
    db:
      max_conns: 30
      synchronous_commit: "off"
    journal:
      batch_max: 1024

  # Промышленный (описание): TLS к БД, внешний УЦ, k8s — см. deploy/k8s.
  prod:
    ports:
      mode: live
    log:
      level: info
    engine:
      partitions: 64
