# Разделение обязанностей (FR-56, AD-43, AD-11).
separation_of_duties:
  - id: SOD-1
    statement: "Кто участвовал в изготовлении изделия, не принимает его на точке предъявления (FR-56)"
    conflicting_actions: ["process.operation.start", "nonconformity.presentation.resolve"]
  - id: SOD-2
    statement: "Заверитель бумажной подписи ≠ подписант (AD-43)"
    conflicting_actions: ["documents.document.sign", "documents.paper.attest"]
  - id: SOD-3
    statement: "Выдача прав себе — только со второй подписью независимой стороны (AD-11)"
    conflicting_actions: ["access.policy.grant", "access.policy.receive"]

# Вторая подпись при выдаче прав — от независимой стороны (AD-11, PRD §11.16).
second_signature:
  qc_authorities_stamps_keys: second_signature_qc
  production_authorities_keys: second_signature_production
  admin_and_audit_privileges: second_signature_audit

# Параметры аудита — принадлежат Аудитору ИБ (AD-8, AD-15); в генезисе — policy.audit.parameters_set.
audit:
  checkpoint_interval_s: 30
  checkpoint_max_gap_s: 120
  security_bus_subscribers: [notifications, integrity_indicator, siem_export_file]
