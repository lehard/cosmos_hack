# Стол администратора (PRD §3a): доступ и технические настройки, не производство.
# Первая вкладка — тестовые сценарии: пульт демонстрации (демо-трек, эпик 14). Владелец после волны 1 — эпик 14.
version: 1
role: administrator
title_key: desks.testScenarios
density: comfortable
help_key: administrator # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  - id: scenarios
    title_key: desks.testScenarios
    layout: main-side
    slots:
      - {id: console, area: main, widget: scenario-console}
      - {id: board, area: right, widget: verification-board}
  - id: access
    title_key: desks.access
    layout: single
    slots:
      - {id: access, area: main, widget: access-admin}
  - id: sources
    title_key: desks.sources
    layout: single
    slots:
      - {id: sources, area: main, widget: sources}
  # Карантин сообщений — отдельной вкладкой, чтобы не мешал источникам (решение пользователя 26.09).
  - id: quarantine
    title_key: desks.quarantine
    layout: single
    slots:
      - {id: quarantine, area: main, widget: quarantine}
  - id: integrations
    title_key: widgets.integrations.title
    layout: single
    slots:
      - {id: integrations, area: main, widget: integrations}
  - id: components
    title_key: desks.components
    layout: single
    slots:
      - {id: health, area: main, widget: system-health}
  - id: vision-adaptation
    title_key: widgets.visionAdaptation.title
    layout: single
    slots:
      - {id: adaptation, area: main, widget: vision-adaptation}
  # Реестр документов (эпик 44; FR-65, FR-66, FR-139): все документы по процессам, изделиям, НС, версиям процесса —
  # состояние, кто должен подписать; щелчок — окно документа с маршрутом подписей и кнопками по правам.
  - id: documents
    title_key: docRegistry.tab
    layout: single
    slots:
      - {id: documents, area: main, widget: documents-registry}
  # Федерация предприятий (эпик 41; FR-131, FR-132, AD-19): партнёры и их корни доверия, входящие и исходящие
  # выписки паспорта с проверкой подписей; щелчок — окно выписки справа (Д-70).
  - id: federation
    title_key: widgets.federation.title
    layout: single
    slots:
      - {id: federation, area: main, widget: federation}
