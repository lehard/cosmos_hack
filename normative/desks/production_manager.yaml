# Стол руководителя производства — «сердце» (PRD §3a, UJ-1). Владелец после волны 1 — эпик 10.
# Формат — desk.schema.json; id виджетов — frontend/src/widgets/registry.ts.
version: 1
role: production_manager
title_key: desks.dashboard
density: comfortable
help_key: production_manager # раздел встроенной справки (эпик 47); наследники роли получают его вместе со столом
tabs:
  # Обзор разгружен (UI-10): сверху показатели, затем «требует вашего внимания»
  # и тревоги; живая карта и посты — отдельными разделами.
  - id: overview
    title_key: desks.dashboard
    layout: single
    slots:
      - {id: tiles, area: main, widget: metric-tiles, slice: {set: production_manager}}
      - {id: attention, area: main, widget: attention}
      - {id: alerts, area: main, widget: alerts-feed}
  - id: processes
    title_key: desks.processes
    layout: single
    slots:
      # Таймлайн — часть живой карты (полоса внизу, UI-19), отдельного слота нет.
      - {id: map, area: main, widget: live-map, slice: {counters: [queue, in_progress, passed, defects], period: shift}}
  - id: posts
    title_key: desks.posts
    layout: single
    slots:
      - {id: posts, area: main, widget: posts}
  - id: proposals
    title_key: desks.proposals
    layout: single
    slots:
      - {id: proposals, area: main, widget: proposals}
  # Эпик 42 (FR-138): взгляд руководителя по качеству совмещён со столом — меры, их эффективность, организационная память.
  - id: quality
    title_key: widgets.quality.tab
    layout: single
    slots:
      - {id: quality, area: main, widget: corrective-actions}
  - id: analytics
    title_key: desks.analytics
    layout: main-side
    slots:
      - {id: analytics, area: main, widget: analytics-overview}
      - {id: charts, area: main, widget: control-chart, slice: {step_key: welding.weld, metric_id: current_a}}
      - {id: drilldown, area: right, widget: metric-drilldown}
  - id: data-deficit
    title_key: desks.dataDeficit
    layout: single
    slots:
      - {id: deficit, area: main, widget: data-deficit-map}
  - id: process
    title_key: desks.processVersions
    layout: single
    slots:
      - {id: processes, area: main, widget: process-registry}
