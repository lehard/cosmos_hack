# Классификатор видов дефектов v1 — нормативный слой (FR-125, FR-14, FR-37).
# Код, наименование, класс тяжести по ГОСТ 15467 (критический / значительный / малозначительный),
# методы, способные выявить вид, признак «измеряемая характеристика» (значение против допуска).
# Сигнал с кодом, которого здесь нет, принимается как «неизвестный вид» с флагом (FR-125).
# Физический дефект — ключ (изделие, зона, место) без вида; вид уточняется новым наблюдением (FR-37).
# Все значения — проектные допущения [ПП] для демо-изделия «фланец люка гермокорпуса»; меняются новой версией нормы через кворум.
